# Warmonger / Crush Online: client<->server contract, WORLD subsystem
# (world entry, scene/map change and warps, unit spawn/despawn/refresh, movement, camera,
#  world map / field status, scene objects).
#
# Conventions
# - All offsets are from packet start; payload begins at +0x10. Header: u16 len | u16 0xA53C |
#   u16 opcode | u16 extra | u32 tick | u32 key.
# - Server packets: key 0 (plaintext), tick = monotonic ms (0 is accepted), length > 0x10 and
#   <= 0x1010 (ring-slot size). The dispatcher FUN_0047a36c checks only magic and len > 0x10;
#   there is NO per-opcode size check, so "min_size" below = the highest offset the handler reads.
# - C->S packets: extra = own uid (acct+0xec / unit+0x35e) for every in-world packet; payload
#   words obfuscated as ~(w - key) when key != 0.
# - uid ranges: players 1..0x3F6, monsters/NPCs 0x3F7..0x2B05 (client debug/script mobs 0x2B06+,
#   corpse rename target 0x521A). Handlers branch on uid < 0x3F7 (player) vs >= 0x3F7.
# - acct = *DAT_00847ac8. Scene state: acct+0x63c warp struct {i32 x*100, i32 y*100, i32 z*100,
#   u16 0x9f, i8 mapfort, u8 fortTeam, u32 mapGuild, i32 mapid, i32 sceneidx, 100 x {u16 id,i8,u8}};
#   acct+0x652 mapid, +0x656 sceneidx, +0x64c mapfort, +0x64d fort team, +0x64e mapGuild,
#   +0x64a channel, +0x65a scene-object (gadget) state table.
# - "rec" = unit record (unit+0x3a0, 0x65f bytes); "stats block" = 0x5c bytes at rec+0x443
#   {u32 HP, u32 MP, u32 maxHP, u32 maxMP, ..., +0x1c i16 attack speed, +0x1e i16 attack range,
#   +0x36 i16 move speed (x0.01 units/s; 450 = 4.5), +0x40 i16 revive delay s, ...}.
# - Buff list = u32 bitmask of 32 slots + one packed 12-byte entry per set bit (u16 buff id first).
# Sources: decompiled.c / disasm.txt (re-checked for this file), spec/world.md, movement.md,
# loading.md, group00..03.md, combat.md, monsters.md, contract/examples.md, live server
# server/{handlers,world,ai,loot}.py (live-tested = confirmed working).

opcodes:

  # ------------------------------------------------------------------ world entry
  - opcode: 0x2000
    name: enter_world
    direction: s2c
    s2c:
      min_size: 0x704
      extra: "the player's own unit uid (1..0x3F6); stored to entry+0x1ae, net+0xc, acct+0xec; every later C->S carries it"
      fields:
        - {offset: 0x10, type: u64, name: char_id, values: "must equal the u64 id of one of the 0x2001 slots (FUN_0042843a) else the WHOLE packet is silently ignored", notes: "becomes selected char acct+0x600/0x604"}
        - {offset: 0x18, type: i16, name: sceneidx, values: "0..0x7FFF; instance id. Keep identical in later in-scene 0x44e/0x44f", notes: "acct+0x656 = (int)(short), SIGN-extended; 0x44e/0x44f compare it with a ZERO-extended u16 and 0x47b with a u32, so a value >= 0x8000 never matches and every later warp becomes a full reload (verified FUN_00472272 vs FUN_00473548)"}
        - {offset: 0x1a, type: i16, name: mapid, values: "map table id (FUN_004e1c8d), 0..0x7FFF; 0x78 = fortress map special UI", notes: "acct+0x652 (sign-extended); drives UI/fort tables only, never terrain"}
        - {offset: 0x1c, type: f32, name: x, values: "world x; must lie in an existing Map/ZPxx_yy_00.zp piece with navmesh, never (0,0)", notes: "stored as i32 x*100 at acct+0x63c"}
        - {offset: 0x20, type: f32, name: z, values: "world z (same rule)", notes: "y forced 0, taken from terrain"}
        - {offset: 0x24, type: i8, name: team, values: "0..3 nation/team", notes: "own entry rec+0x655; team table acct+0x3628+idx*0x1a50"}
        - {offset: 0x25, type: i8, name: mapfort, values: "-1 = none, 0..19 fort index on this map", notes: "acct+0x64c"}
        - {offset: 0x26, type: "bytes[2]", name: pad, values: "0", notes: "unused"}
        - {offset: 0x28, type: "bytes[0x6b0]", name: profile, values: "zeros accepted", notes: "copied verbatim to acct+0x27cc; +0x2c container2 8x16B (= 0x423), +0xac inventory 70x16B (= 0x424), +0x50c u16[8] quick-slot codes, +0x51c u8[8] quick-slot types (0 item,1 skill), +0x524 15x0x18 quest slots, +0x68c 0x28B quest flags, +0x6b4..+0x6c0 u32 title fields (= 0x4a9), +0x6c4 u16,+0x6c6 u16,+0x6c8 u32 quest counters"}
        - {offset: 0x6d8, type: i16, name: item_use_gate, values: "unknown semantics; compared with an item-table byte", notes: "acct+0xb1a8"}
        - {offset: 0x6da, type: u8, name: guild_grade, values: "", notes: "own rec+0x656"}
        - {offset: 0x6db, type: u8, name: fort_owner_team, values: "team owning this map/fort", notes: "acct+0x64d"}
        - {offset: 0x6dc, type: u32, name: unread_mail, values: "", notes: "acct+0xb298/0xb29c"}
        - {offset: 0x6e0, type: u16, name: channel, values: "0-based channel index (UI shows +1)", notes: "acct+0x64a; 0x47a refuses the current one"}
        - {offset: 0x6e4, type: u32, name: map_guild, values: "guild id owning this map, 0 = none", notes: "acct+0x64e; 0x47a world-map warp needs own guild == this"}
        - {offset: 0x6e8, type: u32, name: currency_a, values: "", notes: "acct+0x634"}
        - {offset: 0x6ec, type: u32, name: jewel_bonus, values: "", notes: "acct+0x630"}
        - {offset: 0x6f0, type: u32, name: jewels, values: "", notes: "acct+0x638"}
        - {offset: 0x6f4, type: u32, name: threshold_b1ac, values: "unknown", notes: "acct+0xb1ac (FUN_00567f59/005681bc)"}
        - {offset: 0x6f8, type: u32, name: server_time, values: "unix seconds", notes: "time resync"}
        - {offset: 0x6fc, type: u32, name: fort_extra_a, values: "", notes: "fort record [team][mapfort]+0xa8, only if 0 <= mapfort < 20"}
        - {offset: 0x700, type: u32, name: fort_extra_b, values: "", notes: "fort record +0xac, same condition"}
      accepted_if: "char_id matches a 0x2001 slot. Out of game: switches char-select -> game scene, builds the OWN avatar locally from the slot record (no self 0x803), creates quest manager. In game (resent): kills the running load and starts a NEW load = full reload; do not resend 0x2000 as a warp."
    server_reply: "n/a (it IS the reply to C->S 0x406 {+0x10 u64 char id}, extra = session tag). Must be followed immediately by 0x41f (stats; HP > 0 revives the avatar which is built dead with speed 0), then optional 0x421/0x422/0x41e/0x424/0x423/0x2009/0x490/0x486, then 0x803/0x805(+0x804) for every unit in view."
    client_effect: "Scene 4 (game) + CLoadingProcess (ends by itself at step 0x19; 1 Hz reload loop if the position is on a missing terrain piece). Avatar built from slot record; profile block applied; UI refresh 0x44091c(7)."
    handler: FUN_00472272
    send_sites: []
    confidence: high
    verified: true
    evidence: "group03/loading.md traced; live-tested by server handlers.enter_world (0x704 bytes, sceneidx/mapid 87, team, mapfort -1, time). Verifier re-read FUN_00472272: profile copy 0x1ac dwords +0x28 -> acct+0x27cc, all listed acct stores match; note +0x6f8 time resync (FUN_0046ff6d) runs BEFORE the char-id check, so it applies even when the packet is otherwise ignored."

  # ------------------------------------------------------------------ unit spawn / despawn / refresh
  - opcode: 0x803
    name: spawn_unit_full
    direction: s2c
    s2c:
      min_size: "player 0xf0 + 12*popcount(buffmask) (send 0x270); monster 0x40 + 12*popcount (send 0x1c0)"
      extra: "uid of the unit; branch: < 0x3F7 player layout, >= 0x3F7 monster/NPC layout. Same uid as an existing unit = in-place update (no re-create, no reposition)."
      fields:
        - {offset: 0x10, type: "char[40]", name: name, values: "ASCII NUL-padded", notes: "PLAYER branch only; rec+0x20b and widened to rec+0x1b3"}
        - {offset: 0x38, type: f32, name: x, values: "world", notes: "player branch"}
        - {offset: 0x3c, type: f32, name: z, values: "world", notes: "player branch"}
        - {offset: 0x40, type: u16, name: class_id, values: "non-zero UnitDB id, else packet ignored", notes: "player branch; rec+0x239"}
        - {offset: 0x42, type: u16, name: battle_side, values: "0 or match team/party; non-zero on both overrides team for friend/foe", notes: "player; rec+0x659"}
        - {offset: 0x44, type: i16, name: guild_id, values: "0 = none", notes: "player; rec+0x27f"}
        - {offset: 0x46, type: u8, name: heading, values: "0..255 = full turn", notes: "player"}
        - {offset: 0x47, type: u8, name: spawn_fx, values: "0 none; 1..3 play appear action 0x3d", notes: "player"}
        - {offset: 0x48, type: u8, name: guild_grade, values: "", notes: "player; rec+0x656"}
        - {offset: 0x49, type: u8, name: level, values: ">= 1", notes: "player; rec+0x237"}
        - {offset: 0x4a, type: i8, name: team, values: "0..3", notes: "player; rec+0x655"}
        - {offset: 0x4b, type: u8, name: fort_role, values: "0 (value 4 tested by UI)", notes: "player; rec+0x64c"}
        - {offset: 0x4c, type: u8, name: flag_byte, values: "0; bits 0x80/0x02 tested by nameplate/minimap", notes: "player; rec+0x64b"}
        - {offset: 0x50, type: u32, name: status_flags, values: "0; 0x200 visual state, 0x80/0x2000/0x4000 mount-type", notes: "player; rec+0x64d"}
        - {offset: 0x54, type: u32, name: appearance_a, values: "copy of slot rec+0x38", notes: "player"}
        - {offset: 0x58, type: u32, name: appearance_b, values: "copy of slot rec+0x3c", notes: "player"}
        - {offset: 0x5c, type: u16, name: territory_buff, values: "0", notes: "player; FUN_0046fe22 -> rec+0x297"}
        - {offset: 0x60, type: "bytes[0x5c]", name: stats, values: "HP (+0x60) must be > 0 else created dead; move speed i16 at +0x96", notes: "player; rec+0x443"}
        - {offset: 0xbc, type: "bytes[0x20]", name: equipment, values: "2 x 16B items, copy slot rec+0x40", notes: "player"}
        - {offset: 0xdc, type: "bytes[0x10]", name: costume, values: "copy slot rec+0x60", notes: "player"}
        - {offset: 0xec, type: u32, name: buff_mask, values: "bitmask", notes: "player"}
        - {offset: 0xf0, type: "struct[n]", name: buffs, values: "12 B each, packed in bit order", notes: "player"}
        - {offset: 0x10, type: u16, name: template_id, values: "non-zero UnitDB id else ignored", notes: "MONSTER/NPC branch; rec+0x239"}
        - {offset: 0x12, type: u8, name: level, values: "", notes: "monster"}
        - {offset: 0x13, type: u8, name: category, values: "0 = use UnitDB +0x8a (1 monster, 4/9/50 NPC kinds)", notes: "monster; send 0"}
        - {offset: 0x14, type: f32, name: x, values: "world", notes: "monster"}
        - {offset: 0x18, type: f32, name: z, values: "world", notes: "monster"}
        - {offset: 0x1c, type: u32, name: status_flags, values: "0", notes: "monster"}
        - {offset: 0x20, type: u32, name: hp, values: "> 0 (0 spawns a corpse)", notes: "monster"}
        - {offset: 0x24, type: u32, name: max_hp, values: "", notes: "monster"}
        - {offset: 0x28, type: u32, name: mp, values: "", notes: "monster"}
        - {offset: 0x2c, type: u32, name: max_mp, values: "", notes: "monster"}
        - {offset: 0x30, type: u16, name: stat_1c, values: "0", notes: "monster; stats +0x1c (attack speed)"}
        - {offset: 0x32, type: u8, name: heading, values: "0..255", notes: "monster"}
        - {offset: 0x33, type: u8, name: spawn_fx, values: "0/1..3", notes: "monster"}
        - {offset: 0x34, type: i8, name: team, values: "0 neutral/attackable by all, 1..3 nation", notes: "monster"}
        - {offset: 0x36, type: u16, name: battle_side, values: "0", notes: "monster"}
        - {offset: 0x38, type: i16, name: guild_id, values: "0 (fort guards)", notes: "monster"}
        - {offset: 0x3a, type: u16, name: territory_buff, values: "0", notes: "monster"}
        - {offset: 0x3c, type: u32, name: buff_mask, values: "", notes: "monster"}
        - {offset: 0x40, type: "struct[n]", name: buffs, values: "12 B each", notes: "monster"}
      accepted_if: "class/template id non-zero and present in UnitDB (FUN_00499180) else silently dropped. Monster branch carries NO move speed (stats +0x36 = 0) and no name (UnitDB row+8)."
    server_reply: "n/a"
    client_effect: "Creates the unit (model + movement controller synchronously, so 0x416 may follow immediately); buffs, UI unit-added event. Update path rewrites fields and refreshes model; for the own uid also HP/revive sync + HUD."
    handler: FUN_00477d13
    send_sites: ["FUN_0051c52e (local debug fake)", "FUN_005ad62b (dead script code, local)"]
    confidence: high
    verified: true
    evidence: "world.md full trace 0x477d56..0x4781ee; examples.md A1/A2 local builds; live server world.spawn (monster 0x1c0) works."

