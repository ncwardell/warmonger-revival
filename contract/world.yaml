flows:
  - name: enter_world
    steps:
      - "C->S 0x406 (0x20, extra = session tag from 0x2001, +0x10 u64 char id; rate-limited 1/5 s)"
      - "S->C 0x2000 (0x704, extra = new player uid, +0x10 char id, +0x18 sceneidx, +0x1a mapid, +0x1c/+0x20 x/z on valid terrain, +0x24 team, +0x25 mapfort -1, +0x6e0 channel, +0x6f8 time)"
      - "S->C 0x41f (extra = uid, stats with HP > 0 and speed 450) -- mandatory: revives the avatar built dead"
      - "S->C optional 0x421 / 0x422 / 0x41e / 0x424 / 0x423 / 0x2009 / 0x490 / 0x486 / skill re-equip 0x426"
      - "S->C 0x803 (or 0x805) for every unit in view, each monster followed by 0x804 (speed)"
      - "S->C 0x803 of the new player to every other client that can see them"
      - "client loads (CLoadingProcess) and finishes by itself; no packet ends loading"
  - name: movement_relay
    steps:
      - "C->S 0x416 type 0x20/0x02 every 0.5 s while moving (lookahead x/z), type 0x00 once on stop"
      - "server: store position; S->C 0x416 (same 32 bytes, extra = mover uid) to every other viewer; never echo"
      - "AOI: units entering a viewer's range -> 0x803/0x805 (+0x804); leaving -> 0x806 mode 2 or 0x43f removals"
  - name: stuck_resync
    steps:
      - "C->S 0x416 type 1 (navmesh lookup failed at the player position for ~5 s; repeats every 30 s)"
      - "S->C 0x416 type 1 to the sender only, extra = own uid, x/z = authoritative on-navmesh position"
  - name: server_driven_unit_movement
    steps:
      - "S->C 0x416 (extra = monster uid, type 0/2/0x20, speed, destination) per unit, or"
      - "S->C 0x43f batch (40 moves + 15 removals) about once per second per client"
  - name: unknown_attacker
    steps:
      - "S->C 0x411 names an attacker uid the client lacks"
      - "C->S 0x4ca (+0x10 uid), at most once per uid per 50 s"
      - "S->C 0x803 + 0x804 (alive), 0x803 + 0x420 HP 0 (corpse), or 0x806 mode 2 (gone)"
  - name: monster_death_and_respawn
    steps:
      - "S->C 0x420 HP 0 or 0x806 mode 5 (dies, corpse stays)"
      - "after the corpse delay: S->C 0x806 mode 1 (fade out) or keep the corpse"
      - "respawn: S->C 0x804 with HP = max at the home position (revives in place if the uid still exists), else 0x803 + 0x804"
      - "alternative: 0x806 mode 6 frees the uid at once so a fresh 0x803 can reuse it"
  - name: npc_teleport
    steps:
      - "player clicks a teleporter NPC (category 4) or picks Teleport in the NPC menu -> C->S 0x44e {+0x10 npc uid, +0x14 0}"
      - "S->C 0x44c {npc uid, destinations, costs} (or 0x44d for a counted list)"
      - "client: msgbox DoYouTeleport_S / DoYouTeleportTax_SS (refused locally if cost > money) or PanelTeleport"
      - "C->S 0x44e {+0x10 npc uid, +0x14 destination, +0x1c cost}"
      - "server: validate, deduct cost (0x428), S->C 0x44e/0x44f to the sender (new sceneidx = scene change, same = teleport)"
      - "server: 0x806 mode 2 to old viewers, 0x803(+0x804) to new viewers, units of the new area to the player"
      - "auto-travel (order mode 0xb): the 0x44c offer is answered locally by msgbox 0xc; after the scene change the client sends C->S 0x445 and only resumes the route when S->C 0x446 arrives (FUN_00474eb1 -> FUN_00598a5f)"
  - name: map_portal
    steps:
      - "player walks into a portal trigger -> C->S 0x44e {+0x10 0, +0x14 portal link id, +0x1c 0} (same trigger at most every 3 s; not in match maps)"
      - "S->C 0x44e or 0x44f to the linked destination"
  - name: worldmap_open_and_poll
    steps:
      - "C->S 0x445, 0x449, 0x473 {+0x10 own nation} on open; 0x445 + 0x449 (+ 0x447 for the selected location) on every poll"
      - "S->C 0x446 (full war state), 0x44a (owner table), nation info for 0x473, 0x48d for 0x447"
  - name: worldmap_warp
    steps:
      - "location warp button -> C->S 0x48c {+0x10 location id}, or msgbox 0x35 -> C->S 0x44e {+0x10 location, +0x14 dest, +0x24 1}"
      - "guild-owned fort / field / channel -> C->S 0x47a {mapfort, map id, option, fort value, channel}"
      - "S->C 0x44f/0x44e scene change (new sceneidx/mapid/mapfort); client waits on a 5 s timer"
      - "other WorldMap msgboxes in the same handler FUN_0057349b (owned by other subsystems): 0x36 -> C->S 0x42d (use item; +0x10 map row from table 1, likely a teleport scroll) with a 1 s timer; 0x34 -> C->S 0x4c0 {+0x10 own guild id, +0x14 map id (table 0xb), +0x18 row, +0x1c/+0x20 arg} with a 5 s timer; 0x26 -> C->S 0x47e (nation vote, pvp)"
  - name: gadget_interaction
    steps:
      - "C->S 0x451 {gadget id, 1, 1, type} (start)"
      - "S->C 0x451 broadcast to the other viewers (animation)"
      - "on completion: C->S 0x415 {mapid, gadget, state 1} (scene object of type 5 in state 1), then C->S 0x451 {gadget, 1, 0, type}"
      - "server: S->C 0x415 {gadget, new state} or 0x414 table to everyone in the scene"
      - "alternative trigger: NPC dialog action on an NPC linked to a scene object (types 1/3/4/6, level window) -> C->S 0x415 {mapid, entry} only (FUN_0056e3d8); answer the same way"
  - name: in_scene_teleport_by_server
    steps:
      - "S->C 0x44e (0x2c, extra = own uid, current sceneidx, new x/z), or S->C 0x416 type 1 for a short snap, or 0x804 for any unit"

server_rules:
  - name: spawn_point_and_terrain
    client_expects: "0x2000/0x44e x/z inside an existing Map/ZPxx_yy_00.zp piece with navmesh, else a 1 Hz reload loop or 0x416 type-1 resyncs"
    informed_by: "map.jpk piece list, navmesh tool (tools/navmesh.py), WorldmapData/Teleport_List, StartPos-type tables in data/setting"
    default: "per-map spawn = a validated on-navmesh point; never (0,0)"
  - name: sceneidx_allocation
    client_expects: "same sceneidx = in-place teleport, different = full reload; instance identity only"
    informed_by: "none (server-only concept)"
    default: "one sceneidx per (map, channel, instance), in 0..0x7FFF (0x2000 sign-extends it, 0x44e/0x44f zero-extend, 0x47b compares u32); keep it stable across in-scene warps"
  - name: uid_allocation
    client_expects: "players 1..0x3F6, monsters/NPCs 0x3F7..0x2B05, unique per scene; the own uid fixed from 0x2000"
    informed_by: "none"
    default: "per-scene allocators; reuse a monster uid only after 0x806 mode 2/6 or with 0x804 revive"
  - name: area_of_interest
    client_expects: "units spawned before any 0x416 for them; removed with 0x806/0x43e/0x43f/0x49b; client renders a 5x5 window of 256-unit pieces (about +-512 units)"
    informed_by: "terrain window size; 0x417 camera focus point when detached"
    default: "view radius ~200 units around the player (plus around the camera focus while 0x417 detached = 1); hysteresis on exit"
  - name: npc_placement
    client_expects: "the client never places NPCs from map data; every shop/quest/teleporter NPC must be spawned with 0x803/0x805 (UnitDB id, category from UnitDB +0x8a)"
    informed_by: "UnitDB.cdb, NPC position tables in data/setting (Npc*/Unit* tables)"
    default: "static NPC spawn list per map, sent on entry"
  - name: move_validation
    client_expects: "no acknowledgement; correction only via 0x416 type 1"
    informed_by: "navmesh, stats +0x36 speed"
    default: "accept positions within speed x elapsed x 1.5 + 3 units; otherwise send type-1 correction"
  - name: monster_move_speed
    client_expects: "speed only from 0x41f/0x804/0x416/0x43f (0x803 carries none)"
    informed_by: "UnitDB / monster tables"
    default: "300 (live server) for monsters, 450 players"
  - name: teleport_destinations_and_costs
    client_expects: "0x44c lists (map ids, fort ids, costs) and the 0x44e destination id semantics"
    informed_by: "WorldmapData/Teleport_List, map table (FUN_004e1c8d: +0xc map type, 5 = abyss), fort tables"
    default: "per-teleporter-NPC destination list from Teleport_List; cost 0 until economy exists; destination id = map id; spawn = map's portal arrival point"
  - name: portal_links
    client_expects: "C->S 0x44e +0x14 = trigger link id from map trigger data"
    informed_by: "map trigger data in map.jpk (CTrigger params)"
    default: "table link id -> (mapid, x, z)"
  - name: world_map_state
    client_expects: "0x446/0x44a/0x48d contents (87 bases, owners, battle records)"
    informed_by: "fort/base tables in data/setting"
    default: "all bases neutral/owner 0, empty records; answer every poll so the panel does not wait"
  - name: scene_objects
    client_expects: "gadget ids and states 0..2 in 0x414/0x415/0x44f"
    informed_by: "map gadget data (gadget record[6] type 5)"
    default: "all zero until capture points are implemented"
  - name: channel_list
    client_expects: "channel table at acct+0x618 (0x74-byte entries, +0x70 u16 load, >= 10000 = maintenance) and 0x2000 +0x6e0 current channel"
    informed_by: "server config"
    default: "single channel 0"
  - name: change_nation_policy
    client_expects: "0x429 confirmation"
    informed_by: "none"
    default: "allow free change when the account nation is 0; otherwise fee/cooldown policy"
