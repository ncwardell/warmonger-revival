# Warmonger / Crush Online: client<->server contract, SOCIAL subsystem
# (chat on every channel and whisper, party, legion = guild: create/join/ranks/permissions/
#  warehouse/ether/stock/dividend/donation/core/battlefield summon, friends/block list/invites,
#  mail, player inspect).
#
# Conventions (same as world.yaml)
# - All offsets are from packet start; payload begins at +0x10. Header: u16 len | u16 0xA53C |
#   u16 opcode | u16 extra | u32 tick | u32 key. Server packets: key 0, len > 0x10. The dispatcher
#   FUN_0047a36c does NOT check per-opcode sizes, so s2c.min_size = highest offset the handler reads.
# - C->S: extra = own uid (unit+0x35e) for every packet below; payload words obfuscated as
#   ~(w - key) when key != 0. Builder FUN_004a730b(buf, op, size, extra, clear=1) zero-fills.
# - "me" = local unit DAT_0084a758, "rec" = me+0x3a0 (char record): rec+0x203 u64 char id,
#   rec+0x20b char[40] name (ANSI), rec+0x27f i16 guild id, rec+0x651 u32 fame, rec+0x655 u8 nation,
#   rec+0x656 u8 fame rank (0..19 FameRank.tsv, >=200 = GM), rec+0x64c u8 my guild grade.
#   acct = *DAT_00847ac8. "guild mgr" = FUN_00428772() object; "grec" = guild record = mgr+8
#   (0x198 bytes, returned by FUN_004b3f39 only while grec+0xe4 == rec+0x27f).
# - Strings: names (char/guild) are ANSI (CP_ACP, CP949 on the original Korean build; MultiByteToWideChar(0));
#   chat text, guild notice, mail title/body (web) are UTF-8 (code page 0xFDE9). Mail body/title in
#   C->S 0x809 are UTF-16LE.
# - Messages: most social error/success texts are system_msg ids (data/tables/system_msg.tsv).
#   The server shows them with S->C 0x41d {+0x10 id, +0x14 param, +0x18 %s args} (system.yaml) or
#   0x2003 {+0x18 id}. A display-type-3 id (e.g. 42 StrDef_AreYouJoinGuild) is a Yes/No box whose
#   Yes answer comes back as C->S 0x41d {+0x10 id, +0x14 param}.
#
# BIG FINDING: friend list, block list, pending friend invites, mail list + unread counter, guild
# member list, guild names (<dictg %d>), guild stock lists, rankings and the auction house are NOT
# TCP packets. The client fetches them over HTTP from the "web" endpoint of serverlist.sof
# (server/stub.py :8080) with POST application/x-www-form-urlencoded and parses a JSON reply
# (FUN_006d7b70 is Json::Reader::parse; arrays of row objects, not XML). The shared
# parser was identified during world/channel status testing on 2026-10-05; social
# response contents still need their own live verification.
# Dispatcher: FUN_0047b95b (request kind at req+8; status at req+0: 4 = OK, 3 = failed; body at
# req+0x100c). See web_endpoints below; the TCP opcodes only carry the realtime deltas.
#
# Sources: decompiled.c / disasm.txt (re-checked for this file), spec/group01..03.md,
# contract/examples.md, StringAll_Eng.cdb, data/tables/{system_msg,Level_Table_Guild,GuildMastery,
# GuildMissionReward,FameRank,constants}.tsv. The live server implements none of these yet
# (no confirmed-working examples; server/handlers.py only has the WorldChannel.asp stub).

opcodes:

  # ================================================================== CHAT
  - opcode: 0x800
    name: chat_message
    direction: both
    c2s:
      size: 0x13c
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: i16, name: peerage, values: "type 8: sender fame rank (rec+0x656); else 0", notes: "set only for type 8"}
        - {offset: 0x12, type: u8, name: chat_type, values: "1 normal/local (default tab), 2 whisper, 3 battle ('!' prefix), 4 legion ('$', needs guild), 5 nation ('@'), 6 world/shout (/World tab), 7 system (server only), 8 command/peerage ('#', needs fame rank >= 15), 9 party ('%', needs party)", notes: "prefix char is stripped; default type = chat panel +0x90 (current tab, set by /General /Legion /Country /Battle /World slash words). '/name text' = whisper"}
        - {offset: 0x13, type: u8, name: lang, values: "client language id DAT_00846e98 (1 = English build)", notes: "receiver: 0 -> decode text as ANSI, non-zero -> UTF-8. Forward unchanged"}
        - {offset: 0x14, type: "char[40]", name: name, values: "type 2: whisper TARGET name; other types: own name (UNIT+0x41c string, i.e. me+0x41c, not rec+0x41c)", notes: "ANSI (WideCharToMultiByte CP_ACP via FUN_0042d75d)"}
        - {offset: 0x3c, type: "char[255]", name: text, values: "UTF-8, NUL-terminated, <= 254 bytes", notes: "built by FUN_0042db5b (WideCharToMultiByte 0xFDE9)"}
    s2c:
      min_size: 0x3d
      extra: "sender uid (unit looked up with FUN_0044d3b9; 0/unknown is allowed, then no speech balloon)"
      fields:
        - {offset: 0x10, type: i16, name: peerage, values: "type 8: sender fame rank; else 0", notes: "passed through to the chat line builder"}
        - {offset: 0x12, type: u8, name: chat_type, values: "1..9 as C->S. Tab mask/colour: 1 Local 0x1, 2 Whisper 0x8, 3 War 0x2, 4 Guild 0x4, 5 Nation 0x20, 6 World 0x10 ('Shout [name] : text'), 7 System 0xF000 (+ notice ticker FUN_0051ac1c), 8 Peerage 0x20 (+ notice popup FUN_0059c4a6), 9 Party 0x40", notes: "any other value: nothing printed"}
        - {offset: 0x13, type: u8, name: lang, values: "0 = text is ANSI, else UTF-8", notes: "server-made lines: use 1 + UTF-8"}
        - {offset: 0x14, type: "char[40]", name: sender_name, values: "ANSI. For type 2 when extra == my uid it is the target ('To [x]'), otherwise the sender ('From [x]')", notes: "if non-empty and on my block list (friend mgr list +0x14, 0x48-byte entries) the line is DROPPED"}
        - {offset: 0x3c, type: "char[255]", name: text, values: "per +0x13", notes: ""}
      accepted_if: "game scene up (DAT_0084e3ec != 0); sender name not on the block list. A speech balloon is shown when the sender unit is visible and is not me. Viewers with fame rank >= 200 (GM) get extra sender info on types 1 and 5."
    server_reply: >-
      Do NOT echo to the sender: the client prints its own line locally right after sending
      (FUN_00580a68 -> FUN_0057fd07(me, type, ...)). Relay 0x800 (same type/lang/text, extra = sender
      uid, +0x14 = sender name) to: type 1 players in view range of the sender; 2 the named player only
      (offline/unknown -> 0x41d sysmsg 98 StrDef_NotExistFriend or a type-7 line to the sender);
      3 same battle/match; 4 online legion members; 5 same nation (rec+0x655); 6 everyone on the
      world/channel; 8 everyone (sender fame rank >= 15 re-checked server-side); 9 party members.
      Type 1 text "/time" (sent by the local command table, FUN_004637e3) is a request for the server
      time: answer with a type-7 line.
    client_effect: "chat window line in the colour of constants.tsv ChatColor (System0, System1, Local, War, Guild, Nation, Peerage, World, Whisper, Party) on tabs by mask; balloon over the sender"
    handler: FUN_00477be3
    send_sites: [FUN_00580a68, FUN_004637e3]
    confidence: high
    verified: true
    evidence: "send at 0x580e7a (inline 0xa53c013c); local echo 0x580fe8; receive -> FUN_0057fd07 type switch; encodings via FUN_0042d65e/0042dc73. Re-verified: +0x10/+0x12/+0x13/+0x14/+0x3c, text WideCharToMultiByte(0xFDE9), receiver block-list drop via FUN_004b6b02, GM (rank>199) extras on types 1/5"

  # ================================================================== PARTY
  - opcode: 0x4ac
    name: party_command
    direction: both
    c2s:
      size: 0x40
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u32, name: subcmd, values: "0 invite, 1 accept invite, 3 leave, 4 kick, 5 give leader", notes: "2 is never sent; declining an invite sends nothing"}
        - {offset: 0x14, type: u32, name: target_uid, values: "0 invite: target uid when invited from the unit popup (FUN_005cf655), 0 when by name (chat /partyinvite or chat-name popup); 1: the INVITER uid copied from S->C +0x14; 3: own uid; 4/5: member uid (1..0x3F6, only the leader's menu offers it)", notes: ""}
        - {offset: 0x18, type: "char[40]", name: name, values: "0: target name; 1: inviter name copied from S->C +0x18; 3/4/5: empty", notes: "ANSI"}
    s2c:
      min_size: 0x40
      extra: "not read"
      fields:
        - {offset: 0x10, type: u32, name: subcmd, values: "must be 0 (invite); anything else is ignored", notes: ""}
        - {offset: 0x14, type: u32, name: inviter_uid, values: "non-zero", notes: "echoed back in the accept"}
        - {offset: 0x18, type: "char[40]", name: inviter_name, values: "non-empty, ANSI", notes: "shown in msg_partyinviteyou_s"}
        - {offset: 0x40, type: "bytes[0]", name: end, values: "", notes: "the box stores the first 0x40 bytes"}
      accepted_if: "+0x10 == 0, +0x18[0] != 0, +0x14 != 0, me loaded"
    server_reply: >-
      0 invite: resolve target (uid if non-zero else name); refuse if target is in a party (0x41d sysmsg
      234 StrDef_AlreadJoinParty) or offline (98); else S->C 0x4ac {0, inviter uid, inviter name} to
      the target. 1 accept: create/extend the party, then 0x4ad to every member. 3/4: remove the member,
      0x4ad to the remaining members and 0x4ad with party_id 0 to the removed one. 5: set leader, 0x4ad
      to all.
    client_effect: "S->C opens PanelMsgboxPartyInvite (dialog 0x8a) 'X invite you party'; OK sends subcmd 1"
    handler: FUN_00471fcc
    send_sites: [FUN_0052646e, FUN_005274c0, FUN_0057e71d, FUN_00581078, FUN_005cf655]
    confidence: high
    verified: true
    evidence: "Move=5/Ban=4/Exit=3 at 0x52646e; accept copies panel+0x38/+0x3c (stored S->C +0x14/+0x18) at 0x527502; invites at 0x57e870/0x58218c/0x5cf872"

  - opcode: 0x4ad
    name: party_member_list
    direction: s2c
    s2c:
      min_size: 0x108
      extra: "not read"
      fields:
        - {offset: 0x10, type: u32, name: party_id, values: "0 = not in a party (chat '%' and party UI disabled); else any non-zero id", notes: "-> acct+0xb2b4"}
        - {offset: 0x14, type: u32, name: leader_uid, values: "uid of the leader", notes: "-> acct+0xb2b8; if == my uid I get Ban/Move in the member menu"}
        - {offset: 0x18, type: "struct[5]", name: members, values: "5 x 0x30 bytes; empty slot = uid 0", notes: "-> acct+0xb2bc. Order = slot order in the party frame"}
        - {offset: 0x18, type: u16, name: "members[i].uid", values: "unit uid", notes: "+i*0x30"}
        - {offset: 0x1a, type: "bytes[4]", name: "members[i].unknown", values: "unknown (send 0)", notes: ""}
        - {offset: 0x1e, type: u8, name: "members[i].status_cache", values: "send 0", notes: "client overwrites it with the unit's rec+0x64b badge flags"}
        - {offset: 0x20, type: "char[40]", name: "members[i].name", values: "ANSI, non-empty for a used slot", notes: ""}
      accepted_if: "always (the add/del chat lines are only printed when the new party_id != 0; party_id 0 silently replaces the list)"
    server_reply: "none"
    client_effect: "diffs against the old list and prints msg_partyadd_s / msg_partydel_s (skips my own uid), then replaces the list and fires UI event 0x3b (party frame). Member HP etc. come from the units themselves (must be in view)."
    handler: FUN_004770a1
    send_sites: []
    confidence: high
    verified: true
    evidence: "FUN_004770a1 loops 5 x 0x30 from +0x18 (name at entry+8), copies 0x3c dwords to acct+0xb2bc; leader compare at 0x5264xx/0x526540"

  # ================================================================== FRIENDS / BLOCK LIST
  - opcode: 0x811
    name: friend_invite
    direction: c2s
    c2s:
      size: 0x58
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u32, name: zero, values: "0", notes: ""}
        - {offset: 0x18, type: u64, name: my_char_id, values: "rec+0x203", notes: ""}
        - {offset: 0x28, type: "char[40]", name: target_name, values: "ANSI; never my own name; (unit popup path) not already in my friend list", notes: ""}
    server_reply: >-
      Unknown name -> 0x41d sysmsg 98; already friends -> 137; already invited -> 139; else store a
      pending invite (target's InviteList.asp), send S->C 0x813 to the target if online and 0x41d 135
      StrDef_FriendInviteSuccess to the sender.
    client_effect: "none (no reply opcode is awaited)"
    handler: ""
    send_sites: [FUN_004b6b31, FUN_00531320]
    confidence: high
    verified: true
    evidence: "builds at 0x4b6baa / 0x5313bb: +0x18 = rec+0x203, name at +0x28"

  - opcode: 0x812
    name: friend_invite_answer
    direction: c2s
    c2s:
      size: 0x28
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u32, name: accept, values: "1 = Accept, 0 = Refusal", notes: "buttons of the 'Not accepted' tab of the friend panel"}
        - {offset: 0x18, type: u64, name: my_char_id, values: "rec+0x203", notes: ""}
        - {offset: 0x20, type: u64, name: inviter_char_id, values: "CHAR_UID of the selected InviteList.asp row", notes: ""}
    server_reply: "delete the pending invite; on accept add each to the other's friend list and send 0x41d sysmsg 136 StrDef_FriendAddSuccess (both if online). The client already removed the row locally (FUN_004b7fbd) and re-reads FriendList.asp when the tab is shown."
    client_effect: "row removed from the invite tab"
    handler: ""
    send_sites: [FUN_00530b0a]
    confidence: high
    verified: true
    evidence: "0x531164 (accept, +0x10=1) / 0x5311fd (deny, +0x10=0); +0x20 from list entry +0xb0; both only from friend-panel tab 2"

  - opcode: 0x813
    name: friend_invite_received
    direction: s2c
    s2c:
      min_size: 0x50
      extra: "not read"
      fields:
        - {offset: 0x18, type: u64, name: inviter_char_id, values: "non-zero (0 -> ignored)", notes: ""}
        - {offset: 0x28, type: "char[40]", name: inviter_name, values: "ANSI", notes: "GUI_Friend_MB_RecvInvite_S"}
      accepted_if: "+0x18 != 0"
    server_reply: "none; the answer is a later 0x812"
    client_effect: "Yes/No box (dialog 0x3c). Yes opens the friend panel on the 'Not accepted' tab, which requests InviteList.asp; the actual accept is 0x812 from there"
    handler: FUN_00476ed3
    send_sites: []
    confidence: high
    verified: true
    evidence: "FUN_00476ed3 (+0x18/+0x1c non-zero test, name +0x28 ANSI); scene dialog 0x3c in FUN_0048cd72 opens panel 0x76 tab 2"

  # ================================================================== MAIL
  - opcode: 0x808
    name: mail_recipient_lookup
    direction: both
    c2s:
      size: 0x48
      extra: "sender uid"
      fields:
        - {offset: 0x18, type: "char[40]", name: recipient_name, values: "ANSI", notes: "'Check Name' button"}
    s2c:
      min_size: 0x18
      extra: "not read"
      fields:
        - {offset: 0x10, type: u64, name: char_id, values: "found -> the recipient's char id (result 0 'OkCheckRecvCharName'); 0 or all-ones -> 1 'NoNameCharacter'; 0xFFFFFFFF_FFFFFFFE -> 2 'NotSameNation' (recipient is in another nation)", notes: "result posted as UI event 0x2f; texts from FUN_0053dd97"}
      accepted_if: "always"
    server_reply: "S->C 0x808 with the char id; 0 if unknown; 0xFFFFFFFFFFFFFFFE if the recipient's nation differs from the sender's"
    client_effect: "mail-compose name check result"
    handler: FUN_0047056b
    send_sites: [FUN_0053ca95]
    confidence: medium
    evidence: "handler FUN_0047056b result mapping exact; UI texts at FUN_0053dd97 event 0x2f: 0 OkCheckRecvCharName, 2 NotSameNation, else NoNameCharacter; C->S name at +0x18 (0x53d0f4)"

  - opcode: 0x809
    name: send_mail
    direction: c2s
    c2s:
      size: 0x328
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u64, name: my_char_id, values: "rec+0x203", notes: ""}
        - {offset: 0x18, type: "char[40]", name: recipient_name, values: "ANSI", notes: ""}
        - {offset: 0x48, type: u8, name: kind, values: "bit 0x01 = bill (demand money), 0x10 = has attachment/money, 0 = plain", notes: "same bits as MAIL_TYPE"}
        - {offset: 0x4c, type: u32, name: money, values: "attached money, or billed amount when kind & 1", notes: ""}
        - {offset: 0x50, type: "char[40]", name: my_name, values: "rec+0x20b", notes: ""}
        - {offset: 0x80, type: "bytes[0x50]", name: items, values: "5 x 16-byte item records (attachments)", notes: ""}
        - {offset: 0xd8, type: "u16[5]", name: item_slots, values: "inventory slot of each attachment, 0xFFFF = empty", notes: "spec called them counts; they are per-attachment slot ids"}
        - {offset: 0xe2, type: "wchar[256]", name: body, values: "UTF-16LE", notes: ""}
        - {offset: 0x2e2, type: "wchar[32]", name: title, values: "UTF-16LE", notes: ""}
    server_reply: "no opcode is awaited. Validate items/money (remove from sender: 0x4c2 money, item packets), charge tax (GUI_Mail_Send_Tax), store the mail, send 0x80b to the recipient if online."
    client_effect: "MailSendComplete box is shown locally"
    handler: ""
    send_sites: [FUN_0053d182]
    confidence: medium
    verified: true
    evidence: "0x53d876 build (buf ebp-0x4c0): +0x10 id, +0x18 name, +0x48 kind (1 if bill else 0x10 if money/attachment), +0x4c money, +0x50 rec+0x20b, +0x80 items, +0xd8 u16[5] (0xFFFF default), body +0xe2 0x100 wchar, title +0x2e2 0x20 wchar"

  - opcode: 0x80a
    name: mail_delete_selected
    direction: c2s
    c2s:
      size: 0x68
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u64, name: my_char_id, values: "rec+0x203", notes: ""}
        - {offset: 0x18, type: "u64[10]", name: mail_ids, values: "selected MAIL_UIDs (checked rows of the list), 0 = unused", notes: "sent after DoYouSelectDelMail / DoYouSelectDelMailItem ('There are items attached. Are you sure you want to delete them?') -> dialog result 0x2a"}
    server_reply: "DELETE those mails (attachments included). No reply is awaited; the client has already erased them from its list."
    client_effect: "client erases each selected mail from acct+0xb2a4 (FUN_0053e81d = vector erase), decrements the unread counter for unread ones, then re-reads MailList.asp"
    handler: ""
    send_sites: [FUN_0053e862]
    confidence: high
    verified: true
    evidence: "FUN_0053e862 param 0x2a; confirm box at 0x53e5b2/0x53e5b9 is DoYouSelectDelMailItem/DoYouSelectDelMail with result 0x2a (0x53e5cc); entries erased locally. CORRECTED: was 'take selected'"

  - opcode: 0x80b
    name: new_mail_notice
    direction: s2c
    s2c:
      min_size: 0x20
      extra: "not read"
      fields:
        - {offset: 0x18, type: u32, name: total, values: "total mails", notes: "-> acct+0xb29c"}
        - {offset: 0x1c, type: u32, name: unread, values: "unread mails", notes: "-> acct+0xb298 (mail icon)"}
      accepted_if: "always (the chat line only when the game scene exists)"
    server_reply: "none"
    client_effect: "chat line msg_mailarrival; mail indicator"
    handler: FUN_00476dd6
    send_sites: []
    confidence: high
    evidence: "FUN_00476dd6"

  - opcode: 0x80c
    name: mail_read
    direction: both
    c2s:
      size: 0x20
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u64, name: my_char_id, values: "rec+0x203", notes: ""}
        - {offset: 0x18, type: u64, name: mail_id, values: "MAIL_UID from MailList.asp", notes: ""}
    s2c:
      min_size: 0xa4
      extra: "not read"
      fields:
        - {offset: 0x10, type: u64, name: mail_id, values: "must match an entry of the client's web mail list (acct+0xb2a4 vector, 0x110-byte entries) and be non-zero", notes: ""}
        - {offset: 0x18, type: u8, name: mail_type, values: "MAIL_TYPE bits (0x01 bill, 0x04 system, 0x10 money/attachment)", notes: "-> entry+8"}
        - {offset: 0x19, type: u8, name: read_flags, values: "bit0 read, bit1 attachment taken/bill paid (greys the line)", notes: "-> entry+9; if the old value was 0 the unread counter is decremented"}
        - {offset: 0x1c, type: u32, name: unknown_1c, values: "unknown (probably money/bill amount)", notes: "-> entry+0xc"}
        - {offset: 0x50, type: "bytes[0x54]", name: attachments, values: "probably u32 money + 5 x 16-byte item records (mirrors 0x809 +0x4c/+0x80)", notes: "-> entry+0x40; entry+0x98 = 1 (details loaded)"}
      accepted_if: "mail id present in the list"
    server_reply: "S->C 0x80c with the attachment block; mark read. Remember this mail id per session: 0x80d/0x80e carry no id."
    client_effect: "fills the read view (UI event 0x2d)"
    handler: FUN_00474f00
    send_sites: [FUN_0053dfdb]
    confidence: medium
    verified: true
    evidence: "FUN_00474f00: id +0x10/+0x14 must be > 0 and in the list; +0x1c->entry+0xc, +0x18->entry+8, +0x19->entry+9, 0x15 dwords +0x50->entry+0x40, entry+0x98=1, event 0x2d. C->S 0x80c in FUN_0053dfdb {+0x10 my id, +0x18 mail id}. Attachment layout inside +0x50 still inferred"

  - opcode: 0x80d
    name: mail_take_item_or_pay_bill
    direction: c2s
    c2s:
      size: 0x18
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: "bytes[8]", name: zero, values: "always 0", notes: "client BUG: the mail id is written before FUN_004a730b(clear=1) wipes it"}
    server_reply: "act on the mail last opened with 0x80c. Two buttons send it: 'Receive Item' (DoYouRecvMailitem, result 0x2d; client checks free bag slots >= attached items, else StrDef_InventoryIsFull) -> move the attachments (items and money) to the reader; 'Payments' (DoYouPay, result 0x2c; only when MAIL_TYPE & 1 and the bill <= my gold rec+0x283, else MoneyIsLow) -> take the billed money from the reader, credit the sender, mark paid. The server must tell them apart by the open mail's MAIL_TYPE bit 0x01. Then S->C 0x80f for that mail (+ money/item updates)."
    client_effect: "none awaited"
    handler: ""
    send_sites: [FUN_0053e862]
    confidence: high
    verified: true
    evidence: "0x53eb7b..0x53eba6 (id at ebp-0xc/-0x8 = +0x10/+0x14, buffer ebp-0x1c, clear=edi=1) and 0x53ec93; confirm boxes 0x53e607 (0x2d) / 0x53e657 DoYouPay (0x2c)"

  - opcode: 0x80e
    name: mail_return_to_sender
    direction: c2s
    c2s:
      size: 0x18
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: "bytes[8]", name: zero, values: "always 0", notes: "same write-then-clear bug; the only client guard is 'a mail is open' (open mail id > 0), NOT money > 0"}
    server_reply: "return the last opened mail (0x80c) to its sender (GUI_Mail_Header_Return '[Return]' mail with the attachments) and remove it from the reader's box. No reply is awaited."
    client_effect: "client erases the open mail from its list (FUN_0053e81d) and goes back to the list view"
    handler: ""
    send_sites: [FUN_0053e862]
    confidence: high
    verified: true
    evidence: "0x53ed30..0x53ed4f; FUN_0053e862 param 0x2b, whose confirm box is DoYouReturnMail (0x53e6a4, button GUI_Mail_Read_ReturnMail 'Return'). CORRECTED: was 'take money'"

  - opcode: 0x80f
    name: mail_update
    direction: s2c
