flows:
  - name: chat (any channel)
    steps:
      - "C->S 0x800 {+0x12 type, +0x13 lang, +0x14 own name | whisper target, +0x3c UTF-8 text}; client already printed it"
      - "S->C 0x800 {same, extra = sender uid, +0x14 = sender name} to each recipient of the channel, NOT the sender"
      - "whisper to an offline/unknown name: S->C 0x41d sysmsg 98 (or 0x800 type 7) to the sender"
  - name: party invite and join
    steps:
      - "C->S 0x4ac {0, target uid | 0, target name}"
      - "S->C 0x4ac {0, inviter uid, inviter name} to the target (PanelMsgboxPartyInvite)"
      - "C->S 0x4ac {1, inviter uid, inviter name} from the target on OK (nothing on cancel)"
      - "S->C 0x4ad {party id, leader uid, 5 members} to every member"
  - name: party leave / kick / leader
    steps:
      - "C->S 0x4ac {3, own uid} | {4, member uid} | {5, member uid}"
      - "S->C 0x4ad to remaining members; S->C 0x4ad {party_id 0} to the one who left; disband when < 2 members"
  - name: friend invite
    steps:
      - "C->S 0x811 {my id, target name}"
      - "S->C 0x41d sysmsg 135 to the inviter; store invite; S->C 0x813 {inviter id, inviter name} to the target if online"
      - "target: Yes -> friend panel tab 2 -> POST InviteList.asp (charuid) -> JSON rows"
      - "C->S 0x812 {1|0, my id, inviter id}"
      - "S->C 0x41d sysmsg 136 to both; later FriendList.asp returns the new friend"
  - name: friend panel / block list (web)
    steps:
      - "world entry (FUN_00487c28): POST FriendList.asp, BlackList.asp, InviteList.asp (page=0&PageSize=200&charuid=<my id>)"
      - "delete friend: POST DelFriend.asp (charuid, fcharuid) -> reply = new FriendList rows"
      - "block: POST AddBlack.asp (charuid, blackName) -> <Result> 1 ok (client then re-reads BlackList.asp), -1 NoNameCharacter, -2 AlreadyBanUser"
      - "unblock: POST DelBlack.asp (charuid, fcharuid) -> reply = new BlackList rows"
  - name: mail
    steps:
      - "login/periodic: POST MailList.asp (charname) kind 4 -> TOTALCOUNT/UNREADCOUNT only; S->C 0x2013 +0x20 / 0x80b also set the unread counter"
      - "open mail box: POST MailList.asp (charname) kind 3 -> rows (MAIL_UID, MAIL_TYPE, MAIL_READ, Time, SEND_CHAR_NAME, MAIL_TITLE, MAIL_MSG)"
      - "C->S 0x80c {my id, mail id} -> S->C 0x80c {mail id, type, flags, attachments}; server remembers 'open mail'"
      - "receive attachments (DoYouRecvMailitem) or pay bill (DoYouPay): C->S 0x80d (empty) -> apply to the open mail (bill if MAIL_TYPE & 1, else take items+money); S->C 0x80f + 0x4c2/item updates"
      - "return to sender (DoYouReturnMail): C->S 0x80e (empty) -> move the open mail back to its sender as a [Return] mail; client already erased it locally"
      - "delete selected (DoYouSelectDelMail): C->S 0x80a {my id, up to 10 mail ids} -> delete; client already erased them and re-reads MailList.asp"
      - "compose: C->S 0x808 {name} -> S->C 0x808 {char id | 0 unknown | 0xFFFFFFFFFFFFFFFE other nation}; C->S 0x809 {...} -> recipient gets S->C 0x80b {total, unread}"
  - name: create legion
    steps:
      - "C->S 0x455 {+0x11 name, +0x1b0 my name}"
      - "S->C 0x4c2 gold update; S->C 0x2015 {extra = my uid, record (id > 0), my member record grade 4}"
      - "client: POST GuildMemberList.asp (guildidx, page 0, PageSize 128) and GuildName.asp (guildidx) -> <NAME>"
  - name: legion invite and join
    steps:
      - "C->S 0x45b {guild id, invitee name}"
      - "S->C 0x41d {+0x10 42, +0x14 guild id} to the invitee (Yes/No 'X has invited you to join')"
      - "C->S 0x41d {42, guild id} on Yes"
      - "S->C 0x457 {record, my_grade 0} + 0x2013 {current fame rank, guild id, unread mail, fame} to the new member; S->C 0x45b {guild id, member record} to all online members (exactly once per new member: each 0x45b bumps the client's member count)"
  - name: legion leave / kick
    steps:
      - "C->S 0x45c {guild id, target char id, target uid}"
      - "S->C 0x45c {char id} to remaining members; S->C 0x456 {+0x14 0} + 0x2013 {current fame rank, guild 0, unread mail, fame} + 0x41d sysmsg 82/84 to the removed player"
  - name: legion info refresh at world entry
    steps:
      - "S->C 0x2000 enter world (rec+0x27f from the char slot)"
      - "C->S 0x458 {guild id} (FUN_00489d6d) -> S->C 0x457 {record, my grade} (use 0x457 so the grade is set)"
      - "client: GuildMemberList.asp; S->C 0x45d per member log-in/out afterwards"
  - name: grade change / permissions / notice / level up
    steps:
      - "C->S 0x461 {my id, guild id, new grade, member node} -> S->C 0x461 {sysmsg, member record} to members"
      - "C->S 0x462 {guild id, perms[5]} -> S->C 0x462 to members"
      - "C->S 0x464 {guild id, UTF-8 notice} -> S->C 0x458 to members"
      - "C->S 0x463 {guild id, arg} -> S->C 0x458 to members (level/gold changed)"
  - name: legion warehouse
    steps:
      - "C->S 0x45e {guild id, open 1} -> S->C 0x45e {block, other_users 0} (or other_users 1 + name when busy); an unsolicited 0x45e only updates the stored block, the panel needs the client's open request first"
      - "C->S 0x45f {... move ...} -> S->C 0x45f {+0x68 block} + bag item update"
      - "C->S 0x45e {guild id, open 0} (no reply)"
  - name: battlefield summon
    steps:
      - "C->S 0x466 {guild id, channel, map, member name, member session}"
      - "S->C 0x466 {guild id, channel, map, summoner name, cookie} to that member"
      - "C->S 0x467 {echo} on Yes -> server warps the member"
  - name: guild names at character select
    steps:
      - "S->C 0x2001 character list -> client POST GuildNameAllPage.asp Page=0,1,2... until a page has no rows (<U> id, <A> ?, <N> name)"

web_endpoints:   # HTTP POST to the serverlist 'web' host; form body; reply JSON array of row objects
  - {path: /JoyImpact/FriendList.asp, kind: 0x10, form: "page=0&PageSize=200&charuid=<u64>", row_tags: "CHAR_UID (i64), CHAR_FACE (int, class/face icon), CHAR_SESSION (int, online uid/0), nation (int), CHAR_NAME (UTF-8)", parser: FUN_004b8125}
  - {path: /JoyImpact/DelFriend.asp, kind: 0x13, form: "page=0&PageSize=200&charuid=<u64>&fcharuid=<u64>", row_tags: "same as FriendList (the reply IS the new friend list)", parser: FUN_004b8125}
  - {path: /JoyImpact/BlackList.asp, kind: 0x11, form: "page=0&PageSize=200&charuid=<u64>", row_tags: "CHAR_UID, CHAR_NAME (UTF-8)", parser: FUN_004b838b}
  - {path: /JoyImpact/DelBlack.asp, kind: 0x15, form: "page=0&PageSize=200&charuid=<u64>&fcharuid=<u64>", row_tags: "same as BlackList", parser: FUN_004b838b}
  - {path: /JoyImpact/AddBlack.asp, kind: 0x14, form: "charuid=<u64>&blackName=<url-encoded name>", row_tags: "Result: 1 ok (client then requests BlackList.asp), -1 NoNameCharacter, -2 AlreadyBanUser", parser: FUN_004b7bc6}
  - {path: /JoyImpact/InviteList.asp, kind: 0x12, form: "page=0&PageSize=200&charuid=<u64>", row_tags: "CHAR_UID (inviter), CHAR_NAME", parser: FUN_004b85ac}
  - {path: /JoyImpact/MailList.asp, kind: "3 (list) / 4 (counts)", form: "charname=<url-encoded own name>", row_tags: "every row: TOTALCOUNT, UNREADCOUNT; kind 3 rows also MAIL_UID (i64), MAIL_TYPE (bits 1 bill, 4 system, 0x10 money/item), MAIL_READ (bit0 read, bit1 taken/paid), Time (remaining days), SEND_CHAR_NAME (<40 bytes), MAIL_TITLE (UTF-8), MAIL_MSG (UTF-8)", parser: FUN_0047b95b}
  - {path: /JoyImpact/GuildMemberList.asp, kind: 0xd, form: "guildidx=<id>&page=0&PageSize=128", row_tags: "CHAR_UID (i64), CHAR_FAME_RANK (= guild GRADE 0..4 despite the name), CHAR_GUILD_POINT, CHAR_SESSION (online uid/0), LAST_CONN (int), CHAR_NAME (ANSI)", parser: FUN_004b5a1d}
  - {path: /JoyImpact/GuildName.asp, kind: 0xe, form: "guildidx=<id>", row_tags: "NAME (UTF-8)", parser: FUN_004b569b}
  - {path: /JoyImpact/GuildNameAllPage.asp, kind: 0xf, form: "Page=<n>", row_tags: "U (guild id), A (int, unused), N (name, UTF-8); client asks page n+1 while a page returns rows", parser: FUN_004b6533}
  - {path: /JoyImpact/GuildStrockList.asp, kind: 1, form: "Nation=<n>", row_tags: "GUILD_UID, NATION, LEVEL, CURSTOCK, MAXSTOCK, FACEVALUE", parser: FUN_00551e1a}
  - {path: /JoyImpact/GuildStrock.asp, kind: 2, form: "charname=<name>", row_tags: "GUILD_UID, PURCHASE_VALUE, STOCK_AMOUNT, FACEVALUE, STOCK_UID, CHAR_NAME, PURCHASE_DATE", parser: FUN_00551a86}

server_rules:
  - name: social lists live behind the web endpoint
    expects: "HTTP POST + JSON for friends, blocks, invites, mail list, guild members, guild names, stock lists (web_endpoints). Without them the panels stay empty but nothing breaks."
    data: "server/stub.py handle_http + WEB_PAGES"
    default: "serve all 12 pages from the same in-memory store as the TCP server; reply an empty JSON array when nothing exists (social rows still need live verification)"
  - name: chat routing and range
    expects: "no echo to the sender; per-type audience (see 0x800); speech balloons only for visible senders"
    data: "none"
    default: "type 1 = same scene within ~40 m (or the whole scene); 3 = same match; 6 = same channel; rate limit 1 line/0.5 s per sender; length cap 254 bytes"
  - name: block list is client-side only
    expects: "the client drops chat whose +0x14 name is on its block list"
    data: "BlackList.asp"
    default: "also refuse whispers, party/friend/guild invites from blocked players on the server"
  - name: party rules
    expects: "max 5 members (5 slots in 0x4ad); leader uid; party id non-zero"
    data: "none"
    default: "party id = leader's uid; leader leaves -> next member leads; disband at 1 member; exp/loot sharing is server-only (none required by the client)"
  - name: guild grades and permissions
    expects: "grades 0..4 (GuildGradeName_0..4); perms u16 per grade; master is grade 4 and unique; max 3 Sub Masters (sysmsg 246)"
    data: "StringAll GUI_GuildPermission_*"
    default: "grade 4: 0xFFFF; 3: all except 0x80 hand-over; 2: 0x1|0x4|0x8|0x20; 1: 0x4; 0: 0"
  - name: guild level, member cap and level-up cost
    expects: "client compares grec exp/gold with Level_Table_Guild (exp, max members, cost c4)"
    data: "Level_Table_Guild.tsv (10 levels: exp 0..1,170,227,036; members 200..2000; cost 0..54,875,874)"
    default: "use the table as-is; guild exp from members' kills/missions (GuildMissionReward.tsv)"
  - name: guild creation cost and name rules
    expects: "name < 32 bytes ANSI; cost shown in the Guild_Create panel"
    data: "unknown (GUI_GuildCreate_Cost text only)"
    default: "cost 100,000 gold; names 2..16 chars, unique, no profanity"
  - name: guild mastery
    expects: "15 masteries with per-level costs and need_guild_lv (GuildMastery.tsv); no C->S opcode for buying mastery was found in this subsystem"
    data: "GuildMastery.tsv"
    default: "leave unimplemented until the buying packet is found (probably in another subsystem)"
  - name: ether price and dividend
    expects: "ether buy/sell price; dividend allowed once a week, needs gold > 2,000,000, stock 100 kept by the guild"
    data: "none (strings only)"
    default: "fixed ether price 1,000 gold; dividend = (gold - 2,000,000) / 20 split pro rata by shares; 7-day cooldown"
  - name: donation
    expects: "gold 200,000 once a day, jewel 100; 60 donors/day; reward tiers 3M..45M gold"
    data: "StringAll GUI_GuildDonation_*"
    default: "as the strings say; weekly reset Monday 00:00"
  - name: mail rules
    expects: "5 attachments + money or a bill; tax; expiry ('Time' remaining days); system mails (Mail_Title_1..15)"
    data: "StringAll Mail_Title_n / Mail_Msg_n"
    default: "tax 5% of money + 100 per item; expiry 30 days; returned to sender on expiry"
  - name: open-mail state for 0x80d/0x80e
    expects: "both packets arrive with zero payload (client bug)"
    data: "none"
    default: "track the mail id of the last 0x80c per session and act on it"
  - name: guild member session ids
    expects: "member.session = online uid (used as kick target and summon target), 0 when offline"
    data: "none"
    default: "send 0x45d on every login/logout of a member"
