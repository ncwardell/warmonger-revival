# Warmonger / Crush Online - PvP subsystem contract
# Scope: match queue, battlefield/arena match lifecycle, custom game rooms, scoreboards/rewards,
# fort/castle (field) war, nation war / world map, nation vote, dungeon entry panel.
#
# Conventions
# - All offsets are from packet start (16-byte header: u16 len | u16 0xA53C | u16 opcode | u16 extra | u32 tick | u32 key).
# - acct = *DAT_00847ac8 (global game state). self = DAT_0084a758 (own unit, uid at +0x35e, char record at +0x3a0).
# - char = unit+0x3a0 record: +0x655 i8 nation (0 neutral, 1..3 nations), +0x659 u16 match team id, +0x283 u32 gold.
# - mgr = CWarDataManager singleton DAT_0084a75c (0x2b0 bytes), via FUN_0044ad5f; reset FUN_004fbd4c.
# - war = acct+0x3628 world-war data object: 4 nation blocks x 0x1a50 (index = nation id 0..3), then
#   87 field records x 0x20 at war+0x6940 (index = SceneList field id 1..86), war+0x7420 0xe4-byte resource block,
#   war+0x7514 last-event block (0x650). FUN_004285cf() = own nation block (char+0x655 must be 0..3), FUN_004285ff(n) = block n.
# - nation block (0x1a50): +0x00 u32 nation id, +0x08 u8, +0x09 u8, +0x0c..+0x18 u32 x4, +0x28 20 fort records x 0xb0,
#   +0xde8 0x130 block, +0xf18 20 x 0x28 fort counters (10 x u32 each), +0x1238 u8, +0x1240 0x6e0 stats block,
#   +0x1920 0x130 vote block.
# - FORT RECORD (0xb0), shared by 0x448/0x475/0x479 and read by the debug panel FUN_0051f196 ("IDX/FortSlot/Guild/Type/State",
#   "Channel/MapID/TownID", "Core Slot/ItemIndex") and PanelFortInfo FUN_005343e8:
#     +0x00 i8 fort slot (0..19, must equal the index it is stored at) | +0x01 i8 type | +0x02 i8 channel index (compared to acct+0x64a)
#     +0x03 i8 shield ("GUI_FortInfo_Shield") | +0x04 u8 field id (SceneList id 1..86; 0 = slot empty/not present)
#     +0x06 i8 town id | +0x08 i16 owning guild id | +0x0c u32 state (non-zero = active)
#     +0x10 u32 fort level, 0-based (UI shows +1; C->S 0x4a5 sends this+1) | +0x18 i64 fort funds (tax pool; cost check for 0x4a6; TaxRecv enabled when > 0)
#     +0x20 6 x 16-byte core slots (+0 i16 item index, 0 = empty) | +0x80 u8 lab flag bits | +0x81 u8[6] lab level bits (NationInfo Lab0..Lab5)
#     +0xac u32 level progress (7-segment gauge vs FortMastery/level table; full when >= table value)
#     all other bytes unknown.
# - FIELD RECORD (0x20 in client, first 0x14 from the server in 0x446): +0x00 i8 owner nation (N) | +0x01 i8 attacking nation
#   | +0x02 i8 state | +0x03 i8 war type | +0x08 u32 flags (bits 0xe0 = forts of owner nation present here; 0x8000 = show bonus icon)
#   | +0x0c i8 kind (7 = +2 hop penalty in route calc) | rest of the first 0x14 unknown. Client-computed: +0x14 hop distance from own forts,
#   +0x18 derived value. +0x1c u16 from 0x44a.
# Confidence: high = read from code at every step; medium = layout certain, meaning inferred; low = guess.
# Server code (server/*.py) has NO pvp packets yet; nothing here is live-tested. match.md flows are code-verified only.

opcodes:

  # ---------------------------------------------------------------- match queue / team queue
  - opcode: 0x470
    name: match_queue
    direction: both
    c2s:
      size: 0xec
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u8, name: action, values: "1 = register solo (Match.panel Single / minimap button), 2 = register team (MatchTeam Start, FUN_005362e8), 4 = cancel (minimap 'MatchOnDoYouCancle' or auto-cancel FUN_00428e81)", notes: ""}
        - {offset: 0x11, type: u8, name: offer_kind, values: "echo of acct+0xb1bd (last S->C state-0 +0x11)", notes: ""}
        - {offset: 0x12, type: u8, name: echo, values: "echo of acct+0xb1be (last S->C +0x12)", notes: ""}
        - {offset: 0x13, type: "bytes[0xd9]", name: pad, values: "0", notes: ""}
    s2c:
      min_size: 0xec
      extra: "player uid (not read)"
      fields:
        - {offset: 0x10, type: u8, name: state, values: "0 = match offered (Match button available), 1 = queued solo, 2 = queued team, 3 = team formed", notes: "-> acct+0xb1bc"}
        - {offset: 0x11, type: u8, name: offer_kind, values: "0 = 'War of Warmonger is being held', 1 = 'Battle Arena is held' (GUI_MatchPopup_Message_%d)", notes: "stored to acct+0xb1bd only when state == 0"}
        - {offset: 0x12, type: u8, name: echo, values: "any; client echoes it back", notes: "-> acct+0xb1be"}
        - {offset: 0x14, type: i16, name: sysmsg_id, values: "0 = none; else system_msg id shown (state 0 only)", notes: ""}
        - {offset: 0x16, type: "u16[5]", name: team_uids, values: "team member uids, first = leader; 0 = empty", notes: "-> acct+0xb1c0"}
        - {offset: 0x20, type: "char[5][40]", name: team_names, values: "member names (CP949)", notes: "-> acct+0xb1ca"}
        - {offset: 0xe8, type: u32, name: offer_lifetime_s, values: "seconds; expiry = now + v*1000 (acct+0xb1b4). Suggest 86400", notes: "minimap tick FUN_00572593 wipes the 0xe4-byte queue block when it passes while state == 0"}
      accepted_if: "always applied; sets acct+0xb1b0 = 1 (gates all match UI). state != 0 also records acct+0xb1b8 = now (queue start time)"
    server_reply: "To C->S action 1/2: reply 0x470 state 1/2 to the sender (team: to every member). To action 4: reply 0x470 state 0 (re-offer) or nothing. Ignore action 4 from a player who is already in a match (the client auto-sends it when match data arrives while queued)."
    client_effect: "Match.panel / minimap Match button availability, 'Queue' indicator (GUI_Minimap_Match_Waiting), UI event 0x36; sysmsg on offer."
    handler: FUN_004705ac
    send_sites: [FUN_005360a0, FUN_005362e8, FUN_00571c20, FUN_00571e3a, FUN_00428e81]
    confidence: high
    verified: true
    evidence: "FUN_004705ac and FUN_00428e81 read in full; send sites 0x53614f(1),0x5363e8(var),0x571c5f(4),0x571f12(1),0x428eca(4); match.md step 1-3"

