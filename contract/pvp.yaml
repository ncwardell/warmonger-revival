flows:
  - name: match offer and solo queue
    steps:
      - "S->C 0x470 (state 0, +0x11 offer kind 0/1, +0xe8 86400) after enter world, after every match, after a cancel"
      - "C->S 0x470 (action 1, +0x11 echo, +0x12 echo)"
      - "S->C 0x470 (state 1)"
      - "[cancel] C->S 0x470 action 4 -> S->C 0x470 state 0"
  - name: team queue
    steps:
      - "client: Match.panel Team -> MatchTeam.panel (local state 3)"
      - "C->S 0x471 (+0x10 invitee name)"
      - "S->C 0x472 to invitee (state 3, +0x16 uids leader first, +0x20 names) -> MatchTeam panel opens"
      - "S->C 0x470 or 0x472 state 3 with the member list to every member"
      - "C->S 0x470 action 2 (leader Start)"
      - "S->C 0x470 state 2 to all members"
  - name: queued match (arena / War of Warmonger)
    steps:
      - "S->C 0x44f to each participant (extra = uid, +0x10 mapid 140/141, +0x12 NEW sceneidx, x/z on loaded terrain); scene change wipes mgr"
      - "S->C 0x803 spawn of all participants (+0x42 match team for flag2 types)"
      - "S->C 0x43b (type 2/3/4 or 7, state 3, +0x16 sides, +0x1c seconds, +0x20 team table, +0x110 TP)"
      - "C->S 0x470 action 4 (auto, ignore)"
      - "loop: S->C 0x4b5 TP tick / 0x443 kill / 0x439 ping / 0x4c6 markers / 0x43a status"
      - "S->C 0x43a state 7 (optional) then S->C 0x440 result (+0x10 0 win / 1 lose, echoed char fields, real stats + equipment)"
      - "C->S 0x442 action 1 (Exit, flag2 types) or server timeout ~5 s"
      - "S->C 0x44f back to world (original mapid, different sceneidx), respawns, then S->C 0x470 state 0"
  - name: custom game room
    steps:
      - "NPC Training Officer opens CustomGameList (GUI 0x62); C->S 0x46c"
      - "S->C 0x46d (10 rooms)"
      - "create: C->S 0x46b (+0x12 field, +0x3e room name, +0xc4 max) | join: C->S 0x46e (mode 0, +0x12 room id)"
      - "S->C 0x43c to the new member (type 6/0xa, state 1, teams, uids, host first) -> lobby GUI 0x65"
      - "S->C 0x441 (extra = joiner, team 0xff, +0x14 0) to existing members"
      - "C->S 0x441 (team 0/1/-1) -> broadcast S->C 0x441"
      - "C->S 0x46f (invite name) -> server-side prompt (unknown)"
      - "leave: C->S 0x442 (1) -> broadcast S->C 0x442 extra = leaver; host change S->C 0x441 +0x14 = new host"
      - "host: C->S 0x442 (0) -> 0x44f warp (wipes mgr: roster uids, host flag, state)"
      - "S->C 0x43c AGAIN after the warp (type 6/0xa, state 2, member_team + member_uids): 0x43b's state-3 team-id loop iterates the 0x43c roster (mgr+0x0c/+0x84), which the scene change zeroed; without this re-send char+0x659 is only set by 0x803 +0x42"
      - "S->C 0x803 spawns (+0x42 match team 1/2), then S->C 0x43b (same type, state 3, +0x16 = {1,2}) and the rest of the queued-match steps"
      - "reconnect: S->C 0x46e (+0x10 3) -> C->S 0x46e mode 1 (rejoin) / 2 (decline)"
  - name: world map / nation war refresh
    steps:
      - "C->S 0x445 (world-map status) + C->S 0x449 (refresh) [owned by world subsystem], on open also C->S 0x473 (nation)"
      - "S->C 0x446 (field ownership, resources) -> clears world-map wait handle"
      - "S->C 0x44a (per-field bonus/icon ids)"
      - "S->C 0x475 x ceil(forts/4) (nation values + fort records + counters)"
      - "S->C 0x476 (stats block)"
      - "events during war: S->C 0x448 (event + optional fort record), S->C 0x479 (single fort), S->C 0x48d (field-war scoreboard for GameInfoWM)"
  - name: entering a fort scene
    steps:
      - "S->C 0x44f/0x44e scene change (mapfort byte +0x1e)"
      - "S->C 0x47b (+0x10 fort slot, +0x18 = new sceneidx) to set acct+0x64c"
      - "S->C 0x479 for that fort (sets mapGuild acct+0x64e when slot matches)"
  - name: fort management (owning guild)
    steps:
      - "C->S 0x816 donate (slot, amount, gold) -> S->C 0x816 (+0x18 new gold) + S->C 0x479"
      - "C->S 0x49e collect tax (slot) -> S->C 0x479 (+0x18 funds 0) + guild money update"
      - "C->S 0x4a5 level up (slot, nation, guild, level+1) -> S->C 0x479"
      - "C->S 0x4a6 buy mastery (slot, nation, guild, FortMastery id) -> S->C 0x479"
      - "C->S 0x4c3 mastery item (slot, item, slot) -> S->C 0x479 + inventory update"
  - name: nation (marshal) vote
    steps:
      - "S->C 0x47c (+0x10 != 0, +0x30 three candidates) -> VoteAlram (GUI 0x2e) -> Vote.panel (GUI 0x2f)"
      - "C->S 0x47e (+0x10 nation, +0x14 choice 0..2)"
      - "server: sysmsg/updated 0x47c (unknown)"
  - name: dungeon entry
    steps:
      - "server (NPC/portal trigger): S->C 0x481 (+0x12 zone, +0x18 group id or 0, +0x1a field ids, +0x30 party rows)"
      - "client Start: C->S 0x44e size 0x28: solo +0x10 u16 zone, +0x14 0, +0x18 selected field id, +0x1c cost set (0/1), +0x20 u16 option checkbox; party +0x10 zone, +0x14 group id, +0x1c 0"
      - "S->C 0x44f/0x44e warp into the dungeon scene (world subsystem)"

server_rules:
  - name: match_offer_schedule
    client_expects: "0x470 state 0 with +0x11 offer kind and a lifetime; without it the Match button is hidden"
    data_table: "none (server-only schedule)"
    suggested_default: "always offer kind 1 (Battle Arena) with +0xe8 86400; re-push after login, every match, every cancel"
  - name: matchmaking
    client_expects: "nothing between 0x470 state 1/2 and the warp; no accept round trip"
    data_table: "Level_Table (level brackets), char+0x655 nation"
    suggested_default: "start when 2 players (or 1 for testing) are queued; teams balanced by count; type 2 for nation teams, 7 for mixed teams with match team ids 1/2"
  - name: arena_location
    client_expects: "0x44f mapid 140/141 with x/z on an existing terrain zone and a new sceneidx"
    data_table: "SceneList, ZoneDB, ZoneTable, map.jpk (encrypted, coordinates unknown)"
    suggested_default: "reuse a known-good world area with a dedicated sceneidx until arena coordinates are recovered"
  - name: match_duration_and_win
    client_expects: "remaining seconds in 0x43b/0x43a; TP per team (cap display 10000); winner only in 0x440"
    data_table: "Skill_TP (TP skills), none for scoring"
    suggested_default: "600 s; kill = +100 TP to killer team, tower kill = +1000; first to 10000 or higher TP at time-out wins; draw = both lose"
  - name: match_rewards
    client_expects: "0x440 medals, fame (added), money (added), legion fame/contribution, icon flags"
    data_table: "WinAffect (war-winner buff), FameRank"
    suggested_default: "win: 1 gold medal, fame 100, money 1000; lose: 1 bronze, fame 20, money 200; award gold/silver/bronze to top-3 kill+assist"
  - name: kill_points
    client_expects: "0x443 +0x14/+0x16 points added to char+0x233"
    data_table: "none"
    suggested_default: "killer 10, assister 5"
  - name: custom_room_rules
    client_expects: "room ids, max players per field ('n / max'), cost item count; host = first roster uid; Start only when all have a team"
    data_table: "SceneList maxUsers column, DungeonAdmission cost items"
    suggested_default: "room id = increasing counter, max 30, cost 0; host leaving promotes the next member"
  - name: field_and_fort_ownership
    client_expects: "per-field owner/attacker/state/war type (0x446), per-nation fort records with guild, level, funds, shield, cores (0x475/0x479)"
    data_table: "SceneList (fields 1..86, links for routing), FortMastery, Level_Table_Guild, Policy/PolicyActive (server-only)"
    suggested_default: "nations 1..3 each own their home fields; forts start unowned (guild 0, level 0, funds 0, state 1); no war events until a war schedule is designed"
  - name: war_schedule_and_state_values
    client_expects: "field +2 state, +3 war type, 0x448 event ids, 0x43b types 8/9 for fort war"
    data_table: "none recovered (enumerations unknown)"
    suggested_default: "keep all 0 (peace) until enumerations are recovered from panel strings"
  - name: fort_economy
    client_expects: "fort funds i64 (record +0x18), level (+0x10), progress (+0xac)"
    data_table: "FortMastery (costs at rec +0x14), Level_Table_Guild"
    suggested_default: "tax = 5% of NPC shop sales in the fort's field into funds; donation adds 1:1 to funds and progress; level up costs the FortMastery level threshold"
  - name: nation_vote
    client_expects: "three candidates (guild name + character name) in 0x47c; choice index back in 0x47e"
    data_table: "Policy (server-only) for the policy vote"
    suggested_default: "weekly marshal vote: candidates = top 3 guild masters by fame of that nation; one vote per account; winner gets WinAffect buff"
  - name: dungeon_entry
    client_expects: "0x481 field list and party rows; 0x44e request with field id and cost set; client pre-checks ticket counts"
    data_table: "DungeonAdmission (tickets: item 688 x N per cost set), Dungeon (groups), Event_Dungeon (schedule)"
    suggested_default: "deduct the tickets server-side again, warp to the dungeon field's default spawn, max 4 party members (the client refuses Start with 'Strdef_DungeonUserCountOver' when all 5 0x481 party rows are filled: cmp edx,5 at 0x535eb6)"
  - name: misassignment_notes
    client_expects: "n/a"
    data_table: "n/a"
    suggested_default: "0x47e is the nation vote cast (not dungeon entry; dungeon entry is C->S 0x44e). 0x47c is the vote block (not war result). 0x4c6 is minimap markers (not team stats). 0x48d is the world-map field-war scoreboard (not the match result). 0x445/0x449/0x47a (world-map requests and fort warp) belong to this flow but are owned by the world subsystem."
