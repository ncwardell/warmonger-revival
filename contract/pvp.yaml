  # ---------------------------------------------------------------- match lifecycle (mgr)
  - opcode: 0x43b
    name: match_info_start
    direction: s2c
    s2c:
      min_size: 0x16e
      extra: "unused"
      fields:
        - {offset: 0x10, type: u8, name: match_type, values: "row of DAT_0083a888: 2/3/4 queued (teams by nation), 6/0xa custom room, 7 team-id no lobby, 8/9 fort war, 0xc, 0xd (no medals), 5 no scoreboard", notes: "-> mgr+0xad"}
        - {offset: 0x11, type: u8, name: state, values: "1 lobby/recruiting, 2 preparing (low), 3 = START (client rewrites to 4 'in progress'), 7/9 finished", notes: "-> mgr+0xac"}
        - {offset: 0x12, type: u8, name: progress, values: "0..100 (fort-war gauge, type 8)", notes: "-> mgr+0xae"}
        - {offset: 0x13, type: "u8[2]", name: unknown_13, values: "unknown; 0", notes: "-> mgr+0xbc/+0xc0"}
        - {offset: 0x16, type: "u16[2]", name: side_values, values: "flag2 types: at state 3 the client writes +0x16[team] to char+0x659 of every member of the 0x43c ROSTER (mgr+0x0c uids / mgr+0x84 team, spawned units only) - NOT the +0x20 team table; with no 0x43c roster since the last scene change nothing is written (use 1, 2; 0 = none). flag2=0 types: nation per side (4 = any other)", notes: "-> mgr+0xb6"}
        - {offset: 0x1c, type: u32, name: remaining_s, values: "seconds left (HUD counts down locally, display cap 5940)", notes: "-> mgr+0xa4"}
        - {offset: 0x20, type: "struct[2][15]{u32 uid, u16 kills, u16 assists}", name: team_table, values: "team 0 = Defence, 1 = Attack; uid 0 = empty", notes: "-> mgr+0xcc; own team = table containing self uid"}
        - {offset: 0x110, type: "u32[2]", name: tp, values: "TP per team (gauge cap 10000)", notes: "own -> mgr+0xb0"}
        - {offset: 0x118, type: "struct[2]{u32,u32}", name: unknown_118, values: "unknown", notes: "-> mgr+0x288"}
        - {offset: 0x128, type: "struct[3]{u32,u32}", name: unknown_128, values: "unknown", notes: "-> mgr+0x298"}
        - {offset: 0x140, type: "struct[2]{u32,u32}", name: unknown_140, values: "unknown", notes: "-> mgr+0x278"}
        - {offset: 0x150, type: "u32[4]", name: unknown_150, values: "unknown (same as 0x43d)", notes: "-> mgr+0x1bc"}
        - {offset: 0x160, type: u16, name: unknown_160, values: "unknown", notes: "-> mgr+0x1cc"}
        - {offset: 0x162, type: "u16[6]", name: queue_panel_counts, values: "queue/dungeon panel counters; only if that panel is open", notes: ""}
      accepted_if: "always. If acct+0xb1bc is 1/2 (queued) the client first sends C->S 0x470 action 4 and clears the queue UI. Scoreboard rows are built only for SPAWNED units (FUN_0044d3b9)."
    server_reply: none
    client_effect: "HUD Teamscore.panel appears (time, kill/assist, TP gauge), UI 0x32 fired; at state 3 sets char+0x659 for flag2 types; refreshes queue panel (FUN_004e1425(0xb))."
    handler: FUN_00471125
    send_sites: []
    confidence: high
    verified: true
    evidence: "FUN_004fc4e7 via match.md step 5 (layout H, meanings M)"

