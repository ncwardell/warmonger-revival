      fields:
        - {offset: 0x10, type: "char[40]", name: invitee_name, values: "character name typed in msgbox 0x2e InputInviteCharName (CP949, NUL-padded)", notes: ""}
    server_reply: "0x472 to the invitee (team state, opens MatchTeam panel); then 0x470/0x472 state 3 with the updated member list to all members. If the name is unknown/offline, a 0x41b sysmsg (id unknown)."
    client_effect: "none locally"
    handler: null
