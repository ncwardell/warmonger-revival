      fields:
        - {offset: 0x10, type: u8, name: state, values: "as 0x470 (3 = team formed)", notes: "-> acct+0xb1bc"}
        - {offset: 0x12, type: u8, name: echo, values: "any", notes: "-> acct+0xb1be"}
        - {offset: 0x16, type: "u16[5]", name: team_uids, values: "first = leader", notes: ""}
        - {offset: 0x20, type: "char[5][40]", name: team_names, values: "", notes: ""}
      accepted_if: "always; sets acct+0xb1b0 = 1 but does NOT set offer kind (+0xb1bd) or expiry"
    server_reply: none
    client_effect: "UI event 0x36, opens GuiTogglePanel 0x74 (MatchTeam.panel) if closed."
    handler: FUN_004717d1
    send_sites: []
    confidence: high
