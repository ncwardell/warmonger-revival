# Warmonger / Crush Online: client<->server contract, ITEMS subsystem
# (inventory/bag, equipment, warehouse, quick slots, item move/split/use/destroy/sort,
#  gold / fame / medals / jewels, NPC shop + buyback, cash mall + hero gacha, crafting,
#  reinforce, rune sockets, dye, costume carve, decomposition, auction).
#
# Conventions
# - All offsets are from packet start; payload begins at +0x10. Header: u16 len | u16 0xA53C |
#   u16 opcode | u16 extra | u32 tick | u32 key. Server packets: key 0, tick any (0 accepted),
#   len > 0x10. The dispatcher FUN_0047a36c has NO per-opcode size check: "min_size" = highest
#   byte the handler reads.
# - C->S: extra = own uid (unit+0x35e) except 0x200f (session tag acct+0xec). Payload words are
#   obfuscated ~(w - key) when key != 0.
# - acct = *DAT_00847ac8 (account/profile state). me = own unit (DAT_0084a758); rec = me+0x3a0
#   (unit record). The 0x2000 profile block (packet +0x28..+0x6d7) is copied to acct+0x27cc, so
#   acct+N  <=>  0x2000 packet offset N-0x27cc+0x28.
#
# ITEM RECORD (16 bytes, "item16") - the unit of every container, verified from FUN_004dfe59,
# FUN_004dfa01, FUN_0056b6ca, FUN_00545f6d, FUN_004e0603, tooltip FUN_005c5xxx:
#   +0x0 u16 Item_Base code (0 = empty slot)
#   +0x2 u8  flags: bit0 (1) = bound ("LockOn"; set on equip of Item_Base bind=2 items),
#            bit1 (2) = second tooltip flag (unknown), bit3 (8) = cannot sell ("ItemFlagsMsgNoSell"),
#            bit4 (0x10) = cannot be dragged/moved (checked at 0x562f25)
#   +0x3 s8  tier/grade 0..9 (price multiplier table 100,150,200,400,800,1600,3200,6400,12800,25600 %;
#            decomposition cost index 0..6; "Tier" in rune panel; craft material grade match)
#   +0x4 u8  stack count (only for stackable kinds, FUN_00440e65(kind) > 0; 0 is read as 1)
#   +0x5 u8  unknown (0)
#   +0x6 u16[3] rune sockets: 0 = no socket, 1 = open empty socket, else rune item code
#   +0xc u32 unknown (0) - probably period/expiry for timed items ("CantTimeLimitItem"); unverified
#
# CONTAINERS (FUN_004dfe59(container, slot)); "container" bytes in packets use these ids:
#   1  bag            70 slots  acct+0x2850 (= 0x2000 +0xac; 0x424). Usable = acct+0x27cc * 5 (rows).
#   2  gear/armour     8 slots  acct+0x27d0 (= 0x2000 +0x2c; 0x423). Item kinds 50..57
#                             (helmet, armor, gloves, shoes, necklace, belt, bracelet, ring).
#   3  weapons         2 slots  rec+0x243 (slot 0 main, slot 1 sub). Kind 31. Drives the skill bar.
#   4  costume         1 slot   rec+0x263. Kind 32.
#   5  Innocence/hero  1 slot   acct+0x2e58 (= 0x2000 +0x6b4; 0x4a9). Kind 18.
#   6  warehouse      90 slots  acct+0x2e7c (0x425 / 0x2009). Usable = acct+0x3420 * 5.
#   7  guild warehouse 40, 9 fort storage 6/fort, 0xb guild 6 (social subsystem: 0x45f/0x4bc).
#   0xa (0x427 only) = another player's weapon visual.
# CURRENCIES: gold rec+0x283 (u32); fame rec+0x287; warehouse gold acct+0x341c; Yellow Jewel
#   (item 1006, "auction/production") acct+0x634 = currency code 8; Purple Jewel (cash, premium
#   items) acct+0x638 = code 7; code 0xd = 7+8 summed; decomposition points rec+0x293 (u16);
#   medals are bag items 1000 Bronze, 1001 Silver, 1002 Gold, 1007 Arena (counted by FUN_004e048c).
# Item_Base currency codes (record +0x1f buy currency, +0x24/+0x25 cost-pair currencies):
#   1/2/0x11 gold, 9/0x10/0x13 (unknown currency), 10 bronze, 11 silver, 12 gold medal,
#   15 arena medal, 0x12 fame. Raw (not rate-scaled) prices: 9/0xa/0xb/0xc/0xf/0x10 always;
#   0x12/0x13 only in the cost pair (see server_rules price_formula).
# Item_Base record offsets used by the client: +0x1c kind, +0x1e required rank (vs rec+0x656),
#   +0x1f buy currency, +0x20 buy price, +0x24 u8[2] + +0x26 i32[2] cost pair checked on buy,
#   +0x2e fame requirement, +0x32 bind (1 on pickup, 2 on equip), +0x33 class mask, +0x36 flags
#   (bit1 = no sell), +0x3e 10 x {u16 opt type, i32 value} (opt 0x105 = cooldown s, 0x106 =
#   cooldown group, 0xd2 = cast-time item, 0x153 = opens UI 8, 200 = WeaponBase id).
# Sources: decompiled.c / disasm.txt (re-read for this file), spec/group00..03.md, skills.md,
# monsters.md (loot), world.md, contract/examples.md (no item packets there), live server
# server/{skills,loot}.py (0x427/0x428/0x42a/0x494 live-tested = confirmed working).

opcodes:

  # ------------------------------------------------------------------ container snapshots
  - opcode: 0x424
    name: bag_contents
    direction: s2c
    s2c:
      min_size: 0x470
      extra: "ignored"
      fields:
        - {offset: 0x10, type: "item16[70]", name: bag, values: "70 x 16-byte item records, slot order; code 0 = empty", notes: "memcpy 0x460 bytes -> acct+0x2850 (container 1)"}
      accepted_if: "always (no extra/unit check). If the inventory UI exists (DAT_00850a0c) all 70 slots are redrawn (FUN_004e1425(1,-1))."
    server_reply: "none"
    client_effect: "replaces the whole bag; no popup, no message"
    handler: FUN_004703cf
    send_sites: []
    confidence: high
    verified: true
    evidence: "handler is a plain 0x118-dword copy; same bytes as 0x2000 +0xac which the live server fills"

  - opcode: 0x423
    name: gear_contents
    direction: s2c
    s2c:
      min_size: 0x90
      extra: "own uid (or the not-yet-spawned selected character's uid)"
      fields:
        - {offset: 0x10, type: "item16[8]", name: gear, values: "armour/accessory slots, kinds 50..57", notes: "-> acct+0x27d0 (container 2)"}
      accepted_if: "extra resolves to the own unit (DAT_0084a758), or no unit exists and the pending char-select record (FUN_00428494) has +0x1ae == extra; otherwise dropped"
    server_reply: "none"
    client_effect: "replaces container 2; redraws it when the inventory UI exists. Does NOT redraw the avatar or recompute stats (send 0x41f/0x804 for stats)."
    handler: FUN_0047043d
    send_sites: []
    confidence: high
    verified: true
    evidence: "FUN_0047043d copies 0x20 dwords to acct+0x27d0; FUN_004e0087 container 2 = 8 slots; equip path sends kinds 50..57 to container 2"

  - opcode: 0x425
    name: warehouse_contents
    direction: s2c
    s2c:
      min_size: 0x5b0
      extra: "ignored"
      fields:
        - {offset: 0x10, type: "item16[90]", name: warehouse, values: "code 0 = empty", notes: "-> acct+0x2e7c (container 6)"}
      accepted_if: "always"
    server_reply: "none"
    client_effect: "replaces the warehouse; redraws it if the inventory UI exists. Warehouse gold (acct+0x341c) and capacity (acct+0x3420) are NOT in this packet (they come with 0x2009 +0x5b8/+0x5bc, 0x4c2, 0x47f)."
    handler: FUN_00470406
    send_sites: []
    confidence: high
    verified: true
    evidence: "copy of 0x168 dwords; 0x2009 copies 0x7a8 bytes from +0x18 to the same acct+0x2e7c (warehouse 0x5a0, then +0x5a0 gold, +0x5a4 rows)"

  - opcode: 0x4a9
    name: innocence_slot_update
    direction: s2c
    s2c:
      min_size: 0x24
      extra: "ignored"
      fields:
        - {offset: 0x10, type: u32, name: unused, values: "0", notes: "not read"}
        - {offset: 0x14, type: item16, name: item, values: "Innocence (kind 18) item or zeros", notes: "-> acct+0x2e58 (container 5 slot 0)"}
      accepted_if: "own unit and its record exist"
    server_reply: "none"
    client_effect: "stores container 5, fires UI event 0x3a (hero/Innocence display). Same store as 0x427 container 5."
    handler: FUN_004704c8
    send_sites: []
    confidence: high
    verified: true
    evidence: "FUN_004704c8; FUN_004dfe59(5,0) = acct+0x2e58; equip of kind 0x12 targets container 5"

  # ------------------------------------------------------------------ single-slot / visual updates
  - opcode: 0x427
    name: item_slot_update
    direction: s2c
    s2c:
      min_size: 0x28
      extra: "uid of the unit whose container changes (own uid for containers 1/2/5/6)"
      fields:
        - {offset: 0x10, type: u16, name: reason, values: "0 = silent; otherwise a system_msg.cdb id printed with the item code as %d. Special: 0x46 (70 GetItem) = acquire popup 'You acquired X' / 'X x N' (N = new count - old count) + slot highlight; 0x48 (72 UpgradeFail) / 0x4a (74 UpgradeSuccess) = reinforce result (PanelMakeItemMsgbox + PanelItemReinforce refresh, 0x4a on kind 31/50..57 also raises quest event 0x2715); 0x5f (95 MakeBigSuccess) / 0x60 (96 MakeSuccess) = craft result popup, PanelMakeItem refresh, count shown = delta; 0xf8 / 0xf9 (249 JewelSocketUpgrade_Fail) = rune upgrade success / fail (PanelJewelUpgrade); 0xfa / 0xfb = rune set / removed (PanelJewelSocket refresh FUN_00546309(code, slot); 0xfa also quest event 0x271c)", notes: "special panels only for container 1 and item code > 0 (exception: 0xf8/0xf9 run the PanelJewelUpgrade result even when the new code is 0); the 0x4a quest event 0x2715 runs for any container; the generic message fires for any non-zero reason (FUN_00498605/FUN_00498a40)"}
        - {offset: 0x12, type: u16, name: container, values: "1 bag, 2 gear, 3 weapon, 4 costume, 5 Innocence, 6 warehouse, 0xa other player's main weapon visual", notes: "other values: only the reason message runs"}
        - {offset: 0x14, type: u16, name: slot, values: "bag <70, gear <8, weapon 0/1, costume/Innocence 0, warehouse <90", notes: "not range-checked by the handler: stay in range"}
        - {offset: 0x18, type: item16, name: item, values: "new slot content; zeros = empty", notes: "copied verbatim"}
      accepted_if: "extra must resolve to a spawned unit (FUN_0044d294) else the WHOLE packet is dropped (no message). Containers 1/2/5/6 additionally require extra == own unit. Container 3 and 4 work for any unit (other players' weapon/costume). Container 0xa only for OTHER units (moves the old main weapon visual to +0x253 and plays effect 0x21b)."
    server_reply: "none"
    client_effect: "container 3: stores rec+0x243+slot*16, redraws avatar (FUN_004bd738); for self also reloads the weapon's 4 skills (FUN_005848d5(slot)) + skill bar event 0x18. Container 4: costume redraw (FUN_004bc19e). Container 1: stores, redraws slot, highlight/popup as per reason. Container 5: also UI event 0x3a."
    handler: FUN_00478d54
    send_sites: []
    confidence: high
    verified: true
    evidence: "live server: container 3 slot 0 fills the skill bar (skills.py), container 1 reason 0x46 loot popup (loot.py); reasons cross-checked against system_msg.cdb ids 70/72/74/95/96/249"

  - opcode: 0x426
    name: equipment_and_stats_refresh
    direction: s2c
    s2c:
      min_size: "0x98 + 12 * popcount(+0x94)"
      extra: "unit uid"
      fields:
        - {offset: 0x10, type: "item16[2]", name: weapons, values: "main, sub weapon", notes: "self: written to container 3 slots 0/1 via FUN_004e1301; others: rec+0x243/+0x253"}
        - {offset: 0x30, type: u32, name: status_flags, values: "unit status bits", notes: "FUN_00470a7b (rec+0x64d)"}
        - {offset: 0x34, type: "bytes[0x5c]", name: stats, values: "stats block {u32 HP, MP, maxHP, maxMP, ...}", notes: "FUN_00472103 -> rec+0x443 (see world.yaml stats block)"}
        - {offset: 0x94, type: u32, name: slot_mask, values: "bitmask of 32 buff/visual slots", notes: ""}
        - {offset: 0x98, type: "struct[n]", name: entries, values: "one 12-byte entry per set bit, ascending (u16 buff id first)", notes: "FUN_0046fd59 (unit slot table)"}
      accepted_if: "unit must exist (and have a record) for the weapon part; the stat/buff parts are applied first by uid regardless"
    server_reply: "none"
    client_effect: "self: sets both weapon slots, redraws avatar, reloads BOTH skill sets (FUN_005848d5(-1)), refreshes HUD/skill controller. Others: weapon visuals. Plays effect 0x21b on the unit."
    handler: FUN_004725ae
    send_sites: []
    confidence: medium
    verified: true
    evidence: "FUN_004725ae re-read; layout shared with 0x453/0x41e. Not live-tested (server uses 0x427 instead)."

  - opcode: 0x428
    name: character_value_update
    direction: s2c
    s2c:
      min_size: "0x1c (0x20 for field 9)"
      extra: "unit uid (own uid for gold/jewels)"
      fields:
        - {offset: 0x10, type: u16, name: reason, values: "6 with field 2 = 'Strdef_NationPayMoney' (%s Gold has been paid in the country) when the delta > 0; 4 or 5 with field 0xd = acquire popup for item 1006 Yellow Jewel x delta; else 0", notes: ""}
        - {offset: 0x12, type: u16, name: field, values: "2 gold -> rec+0x283 (or pending record); 3 warehouse gold -> acct+0x341c; 5 rec+0x447 (MP) UI 0xf; 7 Purple Jewel -> acct+0x638; 9 fame block; 0xd jewel pair; 0xe match manager +0xb0 (UI 0x1d)", notes: "other values ignored"}
        - {offset: 0x14, type: u32, name: value, values: "new TOTAL (not a delta). Field 9: fame rec+0x287. Field 0xd: Yellow Jewel acct+0x634", notes: ""}
        - {offset: 0x18, type: u32, name: value2, values: "field 9: u8 rank rec+0x656 (low byte); field 0xd: Purple Jewel acct+0x638", notes: ""}
        - {offset: 0x1c, type: u32, name: value3, values: "field 9 only: nation fame rec+0x651", notes: ""}
      accepted_if: "field 2/9: own or any spawned unit, else the pending char-select record with +0x1ae == extra. Field 0xd: popup only when extra is the own unit."
    server_reply: "none"
    client_effect: "updates the value and fires UI event 0x1b (money display) / 0x1c (fame) / 0xf (MP)"
    handler: FUN_00476461
    send_sites: []
    confidence: high
    verified: true
    evidence: "field 2 live-tested by loot.py (gold total); other branches read in FUN_00476461"

  - opcode: 0x4c2
    name: money_update
    direction: s2c
    s2c:
      min_size: 0x18
      extra: "own uid"
      fields:
        - {offset: 0x10, type: u32, name: warehouse_gold, values: "new warehouse gold total", notes: "-> acct+0x341c (always written)"}
        - {offset: 0x14, type: u32, name: gold, values: "new carried gold total", notes: "-> rec+0x283 of the own unit, or the pending record if extra matches"}
      accepted_if: "always for +0x10; +0x14 goes to the own record whenever it exists (extra NOT checked), else to the pending char-select record only if its +0x1ae == extra"
    server_reply: "none"
    client_effect: "both gold displays refresh (UI event 0x1b)"
    handler: FUN_004702af
    send_sites: []
    confidence: high
    verified: true
    evidence: "acct+0x341c is shown by the warehouse panel (FUN_00562bcx/FUN_005635a8) next to rec+0x283; the natural reply to C->S 0x4c1"

  - opcode: 0x200f
    name: jewel_balance_refresh
    direction: both
    c2s:
      size: 0x40
      extra: "session tag acct+0xec (not the uid)"
      fields:
        - {offset: 0x10, type: "char[32]", name: account, values: "account name (acct+0x70), uppercased", notes: ""}
        - {offset: 0x30, type: "bytes[0x10]", name: zero, values: "0", notes: ""}
    s2c:
      min_size: 0x40
      extra: "ignored"
      fields:
        - {offset: 0x38, type: u32, name: purple_jewels, values: "cash jewel balance", notes: "-> acct+0x638"}
        - {offset: 0x3c, type: u32, name: jewel_bonus, values: "unknown secondary value", notes: "-> acct+0x630 (also 0x2000 +0x6ec)"}
      accepted_if: "always"
    server_reply: "S->C 0x200f with the current balances (to the sender)"
    client_effect: "stores balances, UI event 0x1b"
    handler: FUN_004754d5
    send_sites: ["FUN_00429671 (0x4296e0, in game, once per 10 s)", "FUN_004935a7 (0x4936a3, char-select JewelRefresh button)"]
    confidence: high
    evidence: "both send sites re-read (FUN_004a730b(buf,0x200f,0x40,acct+0xec,1) + strcpy account at +0x10)"

  # ------------------------------------------------------------------ moving items
  - opcode: 0x42a
    name: move_item
    direction: both
    c2s:
      size: 0x18
      extra: "own uid"
      fields:
        - {offset: 0x10, type: u8, name: dst_container, values: "container id (1,2,3,4,5,6)", notes: ""}
        - {offset: 0x11, type: u8, name: dst_slot, values: "", notes: ""}
        - {offset: 0x12, type: u8, name: src_container, values: "", notes: ""}
        - {offset: 0x13, type: u8, name: src_slot, values: "", notes: ""}
      notes: "Senders: equip FUN_0048bd47 (src bag; dst 3/<0|1> weapon kind 31 after class/rank/'same weapon' checks, dst 4/0 costume kind 32, dst 5/0 Innocence kind 18 (level check), dst 2/<slot> gear kinds 50..57; bind-on-equip asks 'EquipAndItemLock' first); unequip FUN_0048c6b6 (dst 1/<first free bag slot>, src 3|2|5|4); main/sub swap FUN_0048c92a (dst 3/1, src 3/0, rate-limited, needs both weapons; or explicit slots); drag-drop FUN_00562cc2 / FUN_00532bce / inventory drag in FUN_00579707 (bag<->warehouse, bag<->bag, kind 37 'Holy Things' path); items with flag 0x10 are not draggable"
    s2c:
      min_size: 0x14
      extra: "own uid"
      fields:
        - {offset: 0x10, type: u8, name: dst_container, values: "echo", notes: ""}
        - {offset: 0x11, type: u8, name: dst_slot, values: "echo", notes: ""}
        - {offset: 0x12, type: u8, name: src_container, values: "echo", notes: ""}
        - {offset: 0x13, type: u8, name: src_slot, values: "echo", notes: ""}
      accepted_if: "game scene active (DAT_0084e3ec), extra resolves to ANY spawned unit with a record (not checked to be the own unit); the swap (FUN_004e1357) always acts on the OWN containers. Both (container,slot) must be valid in FUN_004dfe59 else nothing happens"
    server_reply: "accept: echo the same 4 bytes (extra = uid) to the sender only; when container 3 or 4 is involved follow with 0x427 for that slot (the echo does not redraw the avatar or reload skills) and broadcast 0x427 container 3/4 (or 0x426) to nearby players for the visual. Refuse: send nothing (or 0x41b with a reason)."
    client_effect: "swaps the two 16-byte records in local state (FUN_004e1357), fires UI event 0x14, redraws both slots. Pure swap: no stacking/merging."
    handler: FUN_00470376
    send_sites: ["FUN_0048bd47", "FUN_0048c6b6", "FUN_0048c92a", "FUN_00532bce", "FUN_00562cc2", "FUN_00579707"]
    confidence: high
    verified: true
    evidence: "echo + 0x427 container 3 live-tested (skills.py move_item); senders re-read"

  - opcode: 0x432
    name: split_stack
    direction: c2s
    c2s:
      size: 0x18
      extra: "own uid"
      fields:
        - {offset: 0x10, type: u8, name: src_slot, values: "bag slot holding the stack", notes: "container 1 implied"}
        - {offset: 0x11, type: u8, name: dst_slot, values: "first empty bag slot (FUN_004e0087(1)) chosen by the client", notes: ""}
        - {offset: 0x12, type: u16, name: quantity, values: "1 .. stack-1 (typed in the msgbox, checked 0 < q < count)", notes: ""}
        - {offset: 0x14, type: u16, name: item_code, values: "code at src_slot", notes: ""}
    server_reply: "0x427 (reason 0) for src_slot with count - quantity and 0x427 (reason 0) for dst_slot with a copy of the record and count = quantity. Refuse silently on mismatch."
    client_effect: "none until the 0x427s arrive"
    handler: null
    send_sites: ["FUN_00579707 (msgbox 0x19, 0x5799d1)"]
    confidence: high
    verified: true
    evidence: "disasm 0x579930..0x579a07: FUN_004e0087(1) for +0x11, _wtoi(input) for +0x12, FUN_004dfe59(1,slot) code check"

