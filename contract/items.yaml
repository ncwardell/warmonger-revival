flows:
  - name: enter_world_items
    steps:
      - "S->C 0x2000: +0x28 bag rows (acct+0x27cc), +0x2c gear 8x16, +0xac bag 70x16, +0x50c/+0x51c quick bar, +0x6b4 Innocence item, +0x6e8 Yellow Jewel, +0x6f0 Purple Jewel, +0x6f4 next free gacha time; slot record +0x40/+0x50 main/sub weapon, gold/fame in the record"
      - "S->C 0x41f (stats, mandatory)"
      - "S->C 0x427 container 3 slot 0 (and slot 1) reason 0 = equipped weapon(s) -> fills the skill bar (live-tested)"
      - "S->C 0x452 {buy rate, sell rate, 0} (recommended, see price_formula)"
      - "S->C 0x2009 (warehouse 90x16 at +0x18, warehouse gold +0x5b8, warehouse rows +0x5bc) or 0x425 + 0x4c2 + 0x47f type 6"
      - "S->C 0x4b3 {points, mode} (optional)"
  - name: equip_weapon_from_bag
    steps:
      - "C->S 0x42a {dst 3, slot 0|1, src 1, bag slot}"
      - "S->C 0x42a echo (sender) -> local swap"
      - "S->C 0x427 {reason 0, container 3, slot, weapon item} (sender) -> avatar + skill reload"
      - "S->C 0x427 container 3 (or 0x426) to nearby players for the visual"
  - name: equip_or_unequip_gear (armour/accessory, container 2)
    steps:
      - "C->S 0x42a {dst 2, slot, src 1, bag slot} (or reverse for unequip)"
      - "S->C 0x42a echo -> local swap only; the client does NOT recompute stats or redraw the avatar from it"
      - "S->C 0x41f / 0x426 with the new stats (missing from the first pass: gear changes stats, so a stats packet is required)"
      - "flags bit0 (bound) set on equip of Item_Base bind=2 items -> resend 0x427 container 2 slot with the bound record"
  - name: unequip
    steps:
      - "C->S 0x42a {dst 1, free bag slot, src 3|2|4|5, slot}"
      - "S->C 0x42a echo; S->C 0x427 for the equipment slot (zeros) when container 3/4"
  - name: main_sub_weapon_swap
    steps:
      - "C->S 0x42a {3,1,3,0}"
      - "S->C 0x42a echo; S->C 0x427 container 3 slot 0 and slot 1"
  - name: npc_shop_buy
    steps:
      - "client: NPC menu function 1 -> PanelItemShop opens locally with Npc_Carry[UnitDB+0xa2] (no packet)"
      - "C->S 0x430 {npc uid, index, qty, code, rate}"
      - "S->C 0x428 {0, 2, new gold} (or field 9 fame / 0x427 medal stacks)"
      - "S->C 0x427 {0x46 or 0, 1, slot, item}"
  - name: npc_shop_sell_and_buyback
    steps:
      - "C->S 0x431 {1, slot, npc uid, code, qty, rate}"
      - "S->C 0x427 {0, 1, slot, remaining or zeros}; S->C 0x428 {0, 2, new gold}"
      - "C->S 0x4b7 (BuyBack toggled)"
      - "S->C 0x4b8 {rate|0, 16 sold items}"
      - "C->S 0x4b9 {index, rate, item}"
      - "S->C 0x428 gold; S->C 0x427 bag slot; S->C 0x4b8 refreshed"
  - name: use_consumable
    steps:
      - "C->S 0x42d {1, slot, code, 1, 0} (client already decremented the stack and locked items 1 s)"
      - "S->C effect packets (0x420/0x41f HP-MP, 0x41e buffs, ...)"
      - "S->C 0x427 {0, 1, slot, authoritative record}"
      - "S->C 0x42d {+0x12 code} extra = uid -> cooldown + use FX"
  - name: destroy_item
    steps:
      - "C->S 0x42c {1, slot, code}"
      - "S->C 0x427 {0, 1, slot, zeros}"
  - name: split_stack
    steps:
      - "C->S 0x432 {src slot, dst slot, qty, code}"
      - "S->C 0x427 src (count - qty); S->C 0x427 dst (copy, count = qty)"
  - name: bag_to_warehouse
    steps:
      - "client: NPC function 0xf/0x1c (Warehouse) opens the panel locally"
      - "C->S 0x42a {6, wh slot, 1, bag slot} (or reverse)"
      - "S->C 0x42a echo"
  - name: warehouse_gold
    steps:
      - "C->S 0x4c1 {0 deposit | 1 withdraw, amount}"
      - "S->C 0x4c2 {warehouse gold, carried gold}"
  - name: expand_bag_or_warehouse
    steps:
      - "C->S 0x47f {1|6, ExpandSlot step}"
      - "S->C 0x428 {0, 2, gold} or {0, 0xd, yellow, purple}"
      - "S->C 0x47f {1|6, new rows}"
  - name: sort
    steps:
      - "C->S 0x454 {u8[70] order} or 0x4a0 {u8[90] order} (already applied by the client)"
      - "no reply"
  - name: craft
    steps:
      - "C->S 0x435 {npc, recipe, amount, material slots, material records}"
      - "S->C 0x427 reason 0 per consumed material slot; S->C 0x428 gold"
      - "S->C 0x427 {0x60|0x5f, 1, slot, result}  or 0x41b 97 on failure"
  - name: reinforce
    steps:
      - "C->S 0x436 {container, slot, mat slots, mode, code, mat codes, gold}"
      - "S->C 0x427 {0x4a success | 0x48 fail, 1, slot, new record}"
      - "S->C 0x427 reason 0 per material slot; S->C 0x428 gold"
  - name: rune_socket
    steps:
      - "C->S 0x4a7 {item slot, socket, rune slot (0 on remove), def id, 1|0, item code, rune code (0 on remove)}"
      - "S->C 0x427 {0xfa|0xfb, 1, item slot, record with sockets}"
      - "S->C 0x427 {0, 1, rune slot, ...}"
  - name: rune_upgrade
    steps:
      - "C->S 0x4a8 {recipe, rune code, rune slot, material slots/records}"
      - "S->C 0x427 {0xf8|0xf9, 1, rune slot, record}; 0x427 per material"
  - name: decompose
    steps:
      - "C->S 0x493 {slot, code}"
      - "S->C 0x493 {full bag, gained codes/counts, points}"
      - "auto mode: C->S 0x4b1 {mode}; on loot S->C 0x4b2 {points, slots, items}; S->C 0x4b3 {points, mode} to resync"
  - name: cash_mall
    steps:
      - "C->S 0x200f (balance refresh, rate-limited 10 s) -> S->C 0x200f {+0x38 purple, +0x3c bonus}"
      - "C->S 0x484 {product id, item code, price}"
      - "S->C 0x428 {0, 7, purple} ; S->C 0x427 {0x46, 1, slot, item}"
  - name: hero_gacha
    steps:
      - "C->S 0x4aa {type}"
      - "S->C 0x428 {0, 0xd, yellow, purple} (paid types)"
      - "S->C 0x4aa {type, slots[10], items[10], next free time}"
  - name: dye_and_carve
    steps:
      - "C->S 0x437 {part, dye slot} | 0x438 {dye slot} | 0x4a1 {1, slot, code}"
      - "S->C 0x427 container 1 (dye consumed / costume changed); 0x427 container 4 broadcast if the worn costume changed"
  - name: loot_pickup (live-tested, monsters.md)
    steps:
      - "S->C 0x427 {0x46, 1, slot, item} per item (popup)"
      - "S->C 0x428 {0, 2, gold total}"
      - "S->C 0x41b {36} when the bag is full"
  - name: auction (incomplete)
    steps:
      - "C->S 0x433 register / 0x434 buy / 0x498 cancel"
      - "S->C unknown: no handler fills PanelAuction lists"

server_rules:
  - name: item_record_and_ids
    client_expects: "every container slot is the 16-byte item16 record; code 0 = empty; count byte only for stackable kinds (Item_Base kind via FUN_00440e65); sockets at +0x6"
    data_table: "Item_Base.cdb (kind@1c, stack rules), ItemKind.tsv"
    suggested_default: "store item16 verbatim per slot; stack cap 99 (live server); never send count 0 for a non-empty stackable slot (shown as 1)"
  - name: authoritative_echo_vs_local_changes
    client_expects: "the client changes local state BEFORE any reply for: 0x454/0x4a0 sort, 0x42d stack decrement, 0x436 material/gold removal, 0x4b1 mode. Everything else waits for a server packet."
    data_table: "-"
    suggested_default: "mirror those local changes on the server; after any refusal resend the affected slots (0x427) and money (0x428) to undo the client's optimistic edit"
  - name: move_validation
    client_expects: "0x42a is a blind swap; the client checks class (+0x33 mask), rank (+0x1e vs rec+0x656), same-weapon, Innocence level, bind prompt"
    data_table: "Item_Base kind@1c, req_class@33, bind@32, +0x1e"
    suggested_default: "allow only kind-compatible moves: container 3 = kind 31, 4 = 32, 5 = 18, 2 = 50..57 (slot = kind-50 suggested), 6 only within capacity; set flags bit0 on equip of bind=2 items and on pickup of bind=1; merge equal stackable codes instead of swapping (send two 0x427 instead of the echo)"
  - name: capacity
    client_expects: "usable bag slots = acct+0x27cc * 5, warehouse = acct+0x3420 * 5; locked rows are drawn locked"
    data_table: "ExpandSlot.cdb (bag cost1, warehouse cost2; currency 2 gold, 13 jewels)"
    suggested_default: "start bag rows 2 (10 slots) and warehouse rows 2 unless decided otherwise (ExpandSlot steps 1-2 cost 0 for the bag); require step == current rows + 1; max 14 / 18"
  - name: price_formula
    client_expects: "buy price from Item_Base +0x1f/+0x20 (FUN_004e0603) = scale(tier, price/100) * buy_rate + (price % 100) * buy_rate / 100, then +10%; currency 0x11: price +10%; currencies 9/0xa/0xb/0xc/0xf/0x10: raw price; EVERY other code (incl. 0x12 fame, 0x13, 1, 2) takes the rate formula. Cost pair +0x24/+0x26 (FUN_004e052e): raw for 9/0xa/0xb/0xc/0xf/0x10/0x12/0x13, 0x11 = +10%, others rate formula +10%. Sell (FUN_004e06b5) = rate formula with sell_rate then -10%; 0x11: x9/10 then -10% (= 81%); raw codes return the raw price without the -10%. scale(t,x) = {100,150,200,400,800,1600,3200,6400,12800,25600}[t] * x / 100. Rates are PERCENT values: the client initialises both to 1, which makes every gold price ~1/100."
    data_table: "Item_Base buy_currency@1f, buy_price@20, cost pair @24/@26, item16 +3 tier"
    suggested_default: "send 0x452 {100, 100, 0} after enter world (assumed original behaviour; unverified) and charge with the same formula"
  - name: shop_stock
    client_expects: "NPC shops are client data: UnitDB +0xa2 -> Npc_Carry.cdb row -> 70 item16; 0x430 +0x12 indexes that list"
    data_table: "UnitDB.cdb @a2, Npc_Carry.cdb"
    suggested_default: "validate 0x430 against the same row; 0x42f only for dynamic shops"
  - name: buyback
    client_expects: "16-entry list per player, requested with 0x4b7"
    data_table: "-"
    suggested_default: "keep the last 16 sold item16 records per character (newest first), price = buy price"
  - name: jewels
    client_expects: "two balances: Purple (cash, acct+0x638, code 7) for cash mall; Yellow (acct+0x634, code 8) for auction/production; code 0xd = sum (bag expansion, gacha)"
    data_table: "PrimiumShop.cdb (price@08, discount%@14), ExpandSlot"
    suggested_default: "spend Yellow first then Purple for code-0xd costs (assumption); report both via 0x428 field 0xd"
  - name: item_effects_and_cooldowns
    client_expects: "cooldown from item options 0x105 (s) / 0x106 (group); effect visuals from item def +0xa4"
    data_table: "Item_Base opt pairs (ItemOption.tsv), Skill_Buff for buff items, RandomBox.cdb for boxes (kind 28/29/30/43)"
    suggested_default: "implement HP/MP potions, buff scrolls, Exp boxes, random boxes; enforce the cooldown server side"
  - name: craft_reinforce_rune_odds
    client_expects: "success/fail reasons only; rolls and outputs are server-side"
    data_table: "Item_Make.cdb (success%@38, result@3c, fail item@44, gold), ItemSancMet.cdb (gold, 6 steps x 5 materials), JewelSocketMake.cdb (next_item, materials), Item_Jewel.cdb (server-only rune stats)"
    suggested_default: "use the table success% (100 if absent); on reinforce fail keep the item (GUI_WeaponReinforce_FailMsg says materials are destroyed)"
  - name: gacha_odds
    client_expects: "type 0 free once per period (acct+0xb1ac vs server time), types 1..6 paid; needs {3,10,10,5,10,10,10} free slots"
    data_table: "Gacha_00..06.cdb (item, grade; no rates), GUI_Herobind_GachaText_* (tiers per pool)"
    suggested_default: "uniform within grade, grade weights 70/25/5 (invented); free draw every 12 h (GUI_Herobind_GachaText_0)"
  - name: decomposition
    client_expects: "points cost by tier from client table 0x833314; gains are server-side"
    data_table: "Item_Make rows with GUI_ItemMakeFilter_Ore2/Plant2 (decompose) if any; hammer items 945..949 grant points"
    suggested_default: "return 1-3 tier-appropriate materials (e.g. 601/611 Passion Fragments) and charge the client's cost"
  - name: gold_and_currency_limits
    client_expects: "u32 totals; warehouse transfer clamps at 2,000,000,000"
    data_table: "-"
    suggested_default: "cap all currencies at 2,000,000,000; always send totals (0x428/0x4c2), never deltas"
  - name: auction
    client_expects: "PanelAuction exists and sends 0x433/0x434/0x498, but no S->C path fills its lists"
    data_table: "-"
    suggested_default: "ignore auction packets (reply nothing) until a list channel is found"
  - name: misassigned_opcodes
    client_expects: "-"
    data_table: "contract/inventory.tsv"
    suggested_default: "move 0x4b7 (system -> items: buyback list request), 0x4c1 (system -> items: warehouse gold), 0x498 (social -> items: auction cancel) here. 0x45f/0x4bc (guild warehouse moves) stay in social but use container ids 7/9/0xb and item16 records. Renamed: 0x434 search->buy, 0x433 register/bid->register, 0x4b9 medal shop->buyback, 0x4a1 cast-bar use->carve costume, 0x437/0x438 select/apply->costume/hair dye, 0x493 exchange->decompose, 0x4b8 cash info->buyback list, 0x42f cash info->NPC shop stock."
