flows:
  - name: enter world -- initial quest and achievement state
    steps:
      - "S->C 0x2000 (enter world, FUN_00472272 calls FUN_00599b7f(0)): +0x524 15 x 0x18 quest slot records (-> G+0x2cc8), +0x68c u32[10] quest flags (-> G+0x2e30), +0x6c4 u16 daily points, +0x6c6 u16 claimed point-reward steps, +0x6c8 u32 periodic done mask. All zero = empty log, nothing completed (quest 1 is then offered by NPC 201 if the map matches)."
      - "S->C 0x2009 (profile part 2): +0x5c0 0x200-byte achievement table (-> G+0x3424; packet +0x18 maps to G+0x2e7c)."
      - "optional S->C 0x490 (full quest log) / 0x486 (achievement table) at any later time to resync."
  - name: accept a quest from an NPC
    steps:
      - "client: availability computed locally from quest flags + Quest.cdb (giver = start_npc@18 template or c12@1c gadget, per-nation map@12); NPC shows the offer marker; talk dialogue QuestTalk row talk20@20 is client-only"
      - "C->S 0x48e {+0x12 1, +0x16 quest id}"
      - "S->C 0x491 {+0x10 free slot, +0x11 0, +0x14 flags, +0x44 {quest id, state 0}}"
  - name: accept from the quest board (notice quest)
    steps:
      - "C->S 0x48e {+0x10 NoticeQuest row id, +0x12 1, +0x16 quest id (NoticeQuest quest_id@08)}"
      - "S->C 0x491 as above"
  - name: kill / collect objective progress (server-detected, objective type 1)
    steps:
      - "server: on each kill of objN_a (or loot of objN_d) by the quest holder, Value[i]++"
      - "S->C 0x491 {slot, notify 0, record with Value[i]; Clear[i]=1 when Value >= objN_b; state 2 when all active objectives clear}"
  - name: talk / gadget objective (objective types 4 / 5)
    steps:
      - "client opens the NPC (or gadget) talk window while the quest is in the log with state != 2"
      - "C->S 0x492 {+0x10 slot, +0x12 quest id, +0x14 NPC template id or gadget id, +0x16 objective index, +0x18 4 or 5}"
      - "S->C 0x491 {slot, notify 0, record with Clear[i]=1 (state 2 if done)}"
  - name: client-detected objective (types 10001..10012)
    steps:
      - "client event (hit landed, item moved/equipped, panel opened, reinforce, decomposition, ...) -> C->S 0x492 {+0x18 event type, +0x14 objective param a, +0x16 objective index} for EVERY matching uncleared objective"
      - "S->C 0x491 {slot, notify 0, updated record}"
  - name: turn in a quest
    steps:
      - "C->S 0x48f {+0x10 quest id, +0x12 slot, +0x14 reward choice}"
      - "S->C reward packets (exp/level, gold, 0x427 item slot updates, fame via 0x4a2 +0x1c, ...)"
      - "S->C 0x491 {slot, notify 1, flags with Quest c6@04 bit set, record all zero} -> 'completed' toast, next quests offered"
  - name: abandon a quest
    steps:
      - "C->S 0x48e {+0x12 2, +0x14 slot, +0x16 quest id}"
      - "S->C 0x491 {slot, notify 0, record all zero}"
  - name: claim quest-board point rewards
    steps:
      - "C->S 0x4a3 {+0x10 step} (repeated for each unclaimed step up to the clicked one)"
      - "S->C 0x4a4 {+0x10 points, +0x12 claimed steps, +0x14 Yellow Jewels}"
  - name: achievements
    steps:
      - "C->S 0x485 (panel opened) -> S->C 0x486 {table}"
      - "server: when a counter crosses Achievement_Base goal[PreStep]: PreStep++, Time = now -> S->C 0x489 {+0x10 flag[i]=1, +0x38 new table}"
      - "C->S 0x487 {+0x10 index, +0x14 RewardStep} -> S->C 0x488 {table with RewardStep+1, +0x210 Yellow Jewels += reward[RewardStep]}"
  - name: Lords of the Land (WinAffect) reward
    steps:
      - "server sets PC+0x296 pending count (match result / 0x48b)"
      - "C->S 0x48a {+0x10 reward 1..6}"
      - "S->C 0x48b {+0x10 remaining, +0x12 bag slot, +0x14 0, +0x18 item record of WinAffect row item@0c}"
  - name: scene-object (gadget) interaction tied to quests
    steps:
      - "C->S 0x451 {target gadget, kind 1, state 1} ... interaction completes"
      - "C->S 0x415 {+0x10 map id, +0x14 object id, +0x16 current state} (only for type-5 objects whose state byte is 1); FUN_00462db9 then always sends C->S 0x451 {+0x10 gadget id, +0x12 1, +0x14 0, +0x16 gadget word[6]}"
      - "alternatively, from the gadget's NPC-style dialog (FUN_0056e3d8): C->S 0x415 when PC level is within gadget+0x1e..+0x1f (0 = unbounded) and gadget type is 1,3,4 or 6"
      - "S->C 0x415 {+0x14 object id, +0x16 new state} broadcast; and, if a quest objective of type 5 references it, the 0x492/0x491 exchange"

server_rules:
  - name: starter handoff from Floyd to Shaia
    client_expects: "Quest 4 (title key suffix 692) is offered by NPC 239 Floyd after completion bit 3, and received by NPC 201 Shaia. All objective and reward types are zero. Accept into a slot with state 2, then complete only on the validated Shaia turn-in; do not auto-complete merely because it has no objective counters."
    data_table: "Quest.cdb row 4: giver field 10 = 239; receiver field 17 = 201; completion bit 4; automatic field 13 = 0."
    suggested_default: "Support quest 4 after the first three quests. Live 2026-10-05: repeated C->S 0x48e body 0000010000000400 was silently rejected by the previous rows-1-through-3 allowlist, leaving the offer marker on Floyd while the dialogue directed the player to Shaia. Quest 5 crosses to another map and remains outside the prototype slice."
  - name: quest ids, bits and availability
    client_expects: "Quest id in packets = Quest.tsv id column (record+0x00), not the Quest_Title_NNN number. The completion bit is c6@04 (several rows share a bit, e.g. 23-25 are a pick-one-of-three set); prerequisite bit c4@08, exclusion bit c5@0c. The client offers quests by itself; the server only has to keep the flags truthful and must re-check the same rules on accept."
    data_table: "Quest.tsv (291 rows; bits up to 129 of 320)"
    suggested_default: "Persist per character: 15 slot records, the 320-bit flag set, daily points, claimed steps, periodic mask. On accept, reject if bit already set, prerequisite missing, or log full."
  - name: objective stages
    client_expects: "flag1..5 (record+0xf0..+0xf4): with i = first uncleared objective, n = flag[i] is a cumulative end index and objectives 0..n-1 are active (data: 1,2,3,5,5 / 1,5,5,5,5 / 5,5,5,5,5 / 0,0,0,0,0). The client only reports (0x492) uncleared objectives inside that window; n == 0 => no reports at all (marker code treats 0 as 5)."
    data_table: "Quest.tsv flag1..flag5"
    suggested_default: "Mirror the same window when accepting 0x492 and when counting kills."
  - name: objective types the server must detect
    client_expects: "Type 1 = kill unit objN_a, need objN_b, drop objN_d at objN_c % (loot.py already drops these); types 2,3,6..34 exist in data with no client report -- the server must detect them (meaning per type unknown; e.g. 7 with a=25 looks like 'reach level 25', 13 with 911/912 and 15 look like dungeon/war events)."
    data_table: "Quest.tsv obj*_type histogram: 1:128, 4:90, 12:46, 15:30, 8:22, 3:17, 5:16, 13:14 ..."
    suggested_default: "Implement 1 (kill/collect), 4/5 via 0x492, 7 (level >= a); treat unknown types as auto-complete so chains do not stall."
  - name: client-detected objectives
    client_expects: "Types 10001..10012 are reported by the client via 0x492. Observed triggers: 10001 from 0x411/0x412 hit results and 0x439 (+0x10==1) with params (2,0x1462); 10003 from item moves (FUN_0048bd47, a mapped 3->1,2->2,5->3,4->4, b = item); 10004 = panel opened (a: 1 world map, 2 reinforce, 3 panel 0x23, 4 quest board); 10005 from 0x427 item update; 10007 guild storage / item use (item code); 10008 item move FUN_0048c92a; 10009 a <= value from FUN_004fcc10; 10010 decomposition; 10012 (0x271c) from 0x427. No client sender found for 10013 (present in data)."
    data_table: "Quest.tsv objective types 10001,10003,10004,10007,10008,10010,10012,10013"
    suggested_default: "Trust the report after validating slot/quest/objective index and type; mark Clear[i]."
  - name: quest rewards
    client_expects: "Client shows rewards from Quest.tsv but grants nothing itself. Reward types: 1 = item {a = class/choice flag, b = item, c = count}, 2 = exp, 4 = gold, 5 = fame?, 6 = negative value (cost?), 8 = {item, count}, 10 = ?. 'Choose Reward' entries are selected by 0x48f +0x14 (index among the selectable ones)."
    data_table: "Quest.tsv rew1..rew5"
    suggested_default: "Grant type 2 via the exp/level opcode, 4 via gold update, 1/8 via 0x427 into free bag slots; ignore unknown types."
  - name: automatic completion with no receiver
    client_expects: "The ready-state marker path FUN_005990ce at 0x59925d..0x5992ab tries receiver NPC (definition +0x2c), then gadget (+0x30); when both are zero it skips the marker. The only direct call found to the 0x48f sender FUN_00597a70 is the NPC-dialogue path at 0x56e5f9. Quest.cdb field 13 loads into definition byte +0x11 at 0x43e7f0."
    data_table: "Quest.cdb row 1: field 13 is 1; receiver NPC and gadget are zero. Live 2026-10-05: accept 0x48e, valid Shaia talk report 0x492, then no 0x48f; keeping state 2 left the user seeing the old talk objective."
    suggested_default: "For the supported tutorial slice, interpret nonzero field 13 with both receivers zero as automatic completion. After validated objectives become ready, grant rewards, set the completion bit and send 0x491 notify=1 with an empty slot. Resume an already-saved ready state once; do not replace receiver 0 with the giver. This server policy is inferred from the data and live failure, not recovered official server code."
  - name: quest board / notice quests
    client_expects: "NoticeQuest rows map board entries to quest ids; Daily Quest Point (G+0x2e68) +1 per completed daily quest, rewards per NoticeQuestReward (need 5/20/40/65/95/137 -> 20/20/20/20/2500/5000 Yellow Jewels); tooltip says points reset on the 1st of each month; daily/weekly/monthly quests (kinds 9/10/11) are tracked in the G+0x2e6c mask and reset daily 00:00 UTC+1 / Monday / 1st."
    data_table: "NoticeQuest.tsv, NoticeQuestReward.tsv, Quest kind column"
    suggested_default: "Implement the resets server-side; clear the periodic mask bits and the matching completion bits on reset."
  - name: achievement counters
    client_expects: "Value per achievement is purely server-tracked (gold held, medals, wars, kills, deaths, bosses, monsters, fame, reinforces, crafting, exploration ...); grades from goal1..10, rewards (Yellow Jewels) from reward1..10."
    data_table: "Achievement_Base.tsv (32 rows, ids 0..39, category 1..6 = Normal/War/Battle/Repute/Creation/Explore)"
    suggested_default: "Start with Gold (0), Monsters (18), Bosses (17), Deathblows (14); send 0x489 on each grade crossing."
  - name: titles
    client_expects: "No title opcode in this subsystem: an achievement with RewardStep > 0 is listed as earned in the 'Sum up' tab (sorted by entry Time). A displayed title string comes from the profile (0x2000 +0x6b4 / 0x4a9 +0x14, items subsystem)."
    data_table: "Achievement_Base name_key"
    suggested_default: "Keep Time = unix time of the last grade."
  - name: fame and fame rank
    client_expects: "Nation fame lives in char+0x651 (set by 0x4a2 +0x1c, incremented by match results); rank = Level_Table fame_threshold bands, names from FameRank.tsv. No quest packet carries fame."
    data_table: "Level_Table.tsv fame_threshold, FameRank.tsv"
    suggested_default: "Send fame through 0x4a2 after any fame reward."
  - name: Lords of the Land rewards
    client_expects: "PC+0x296 = number of rewards the player may still claim, PC+0x297 = lord level (WinAffect row, buff), PC+0x298 = remaining minutes; 0x48a chooses one of rows 1..6."
    data_table: "WinAffect.tsv (minutes 120, buffs 3029-3034, items 1023-1028)"
    suggested_default: "Grant 1 pending reward to the winning nation's players after a war; decrement on claim."
  - name: currencies
    client_expects: "G+0x634 = Yellow Jewels (free, item 1006) changed by 0x488/0x4a4; G+0x638 = cash jewels (0x200f)."
    data_table: "Item_Base 1006"
    suggested_default: "Keep two balances per account."
  - name: tutorial map mismatch
    client_expects: "Quest 1 (giver NPC 201 Shaia) is offered only on map 89/93/97 (per nation 1/2/3). The live server spawns on map 117, so no tutorial quest marker appears there."
    data_table: "Quest.tsv map1..3, UnitDB 201"
    suggested_default: "Spawn new characters on the nation's map from Quest row 1, or accept that quests are invisible on 117."
