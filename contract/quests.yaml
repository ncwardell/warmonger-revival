        - {offset: 0x14, type: u32, name: npc_uid, values: "uid (unit+0x35e) of the clicked NPC", notes: ""}
      notes: "Two build paths in FUN_0056dd87: menu types 4/0x27/0x28 build the header INLINE (0xa53c0018, opcode 0x44b, extra = own uid; tick/key words left 0) gated by FUN_0046ffbf; menu type 0x16 uses FUN_004a730b(buf,0x44b,0x18,uid,1) gated by FUN_0044ad5f()+0xad == 0 and FUN_004872bd(...) != 1 (on failure returns WITHOUT closing the menu). Payload identical." 
    s2c: null
    server_reply: "unknown -- depends on the NPC. Menu type 4 is on UnitDB 20/30-39/76 (Nexus and Nexus add-ons), 216, 217, 221 Training Officer, 301 Abyss Portal, 310, 311 Fortress Portal, 607/608 bots, 10006; type 0x16 (22) on 80/99 Dimension Gate; type 0x27 on unit 327, 0x28 on unit 328. Portals most likely expect a teleporter offer (0x44c / 0x44d) or a warp (0x44e); Nexus most likely a war/capture action. Sending nothing is safe (client does not wait)."
    client_effect: "NPC menu closes (FUN_0056dcb1); nothing else happens client-side."
    handler: null
    send_sites: [FUN_0056dd87]
    confidence: medium
    verified: true
    evidence: "Header built inline at 0x56de66 (0xa53c0018, opcode 1099); payload stores at 0x56de89 ([ebp-0xc] = +0x10 movsx PC+0x655) and 0x56de93 ([ebp-0x8] = +0x14 NPC uid), buffer at ebp-0x1c; second path 0x56e0ad..0x56e104 (case 0x16) via FUN_004a730b jumping into the same stores; case 4/0x27/0x28 of the NPC menu switch on UnitDB u8@8c..8e (menu entry index 0..2); gated by FUN_0046ffbf. Not a quest packet: MISASSIGNED (world / war NPC services)."

