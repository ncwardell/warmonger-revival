# Warmonger / Crush Online -- client<->server contract: QUESTS subsystem
# (quests, NPC quest dialogue, quest board / notice quests, achievements, rewards, titles/fame).
#
# Conventions: offsets are from packet start (16-byte header, payload at +0x10). "G" = the client
# account/state block DAT_00847ac8 (acct+...). "PC" = local player's char info (DAT_0084a758+0x3a0).
# All C->S packets here are built with FUN_004a730b(buf, op, size, extra = own uid (unit+0x35e), clear=1)
# (exception: one 0x44b path builds the header inline -- see 0x44b) then obfuscated (FUN_00411a7b) and sent (FUN_0046ff99); unset payload bytes are 0.
# The S->C dispatcher (FUN_0047a36c) does NO per-opcode size check: a short packet makes the handler
# read garbage, so always send at least min_size.
#
# Key client structures (derived here, used by several opcodes):
#
#   QUEST SLOT RECORD (0x18 bytes; 15 of them at G+0x2cc8; debug dump FUN_0051fff5 labels in quotes)
#     +0x00 u16  quest id ("stInfo ID"; Quest.tsv id column = record+0x00; 0 = empty slot)
#     +0x02 i8   state ("nClear"): 0 = in progress (objective markers shown),
#                2 = all objectives done / ready to turn in (report marker on the turn-in NPC,
#                NPC talk then sends 0x48f). Other values: unknown.
#     +0x03 u8   unknown (not read by any code found; send 0)
#     +0x04 u32  "Time" (only shown by the debug dump; meaning unknown, 0 is safe)
#     +0x08 u8[5] per-objective "Clear" flags (0 = not done; non-zero = done). The client takes the
#                first 0 entry i and n = Quest record+0xf0+i ("flag1..5"); objectives 0..n-1 are then
#                active (n is a cumulative END index, e.g. flags 1,2,3,5,5 -- not a count from i).
#                n == 0 (14 rows have all flags 0): markers treat it as 5, but 0x492 is never sent.
#     +0x0d u8   pad
#     +0x0e i16[5] per-objective "Value" (progress counter, e.g. kills / items so far)
#
#   QUEST FLAGS (0x28 bytes = 10 x u32 = 320 bits; G+0x2e30, cached in quest manager+0x2c)
#     bit n (dword n>>5, bit n&31) = "quest with Quest.tsv c6@04 == n has been completed".
#     Availability test (FUN_005982b8): quest offered iff
#       own bit (record+0x04) NOT set, prerequisite bit (record+0x08, c4) set or 0,
#       exclusion bit (record+0x0c, c5) NOT set or 0, the per-nation map (record+0x12+2*(nation-1))
#       is 0 or == current map id (G+0x652), record+0x10 fort index (u8, 0 = none) is owned by
#       my nation, 5 prerequisite rows (record+0x78.., types 1 = level/class-table value, 4 = PC+0x237,
#       7 = guild) pass, and the quest is not already in the log.
#
#   QUEST-BOARD COUNTERS: G+0x2e68 u16 daily-quest points; G+0x2e6a u16 number of point-reward
#     steps already claimed (NoticeQuestReward rows); G+0x2e6c u32 periodic-quest done mask
#     (byte (kind-9) for Quest kinds 9/10/11 AND-ed with Quest record+0x04).
#
#   ACHIEVEMENT TABLE (0x200 bytes at G+0x3424; 40 entries x 12 bytes used = 0x1e0, last 0x20 unused)
#     entry[i] (i = Achievement_Base id 0..39):
#       +0 i8  "PreStep"    = number of grades reached (goals met)
#       +1 i8  "RewardStep" = number of grades whose reward was claimed (>0 => listed as a
#              title/achievement in the "Sum up" tab, sorted by +8)
#       +2 u16 pad
#       +4 u32 "Value"      = progress counter compared with Achievement_Base goal[k]
#       +8 u32 "Time"       = time of the last grade (sort key for "Recently Achieve")
#     Claim button enabled iff RewardStep < 10 && reward[RewardStep] != 0 &&
#       goal[RewardStep] <= Value && RewardStep < PreStep (FUN_0052eb27 / FUN_0052f0dc).
#
# Initial state does NOT come from these opcodes: 0x2000 (enter world) carries the quest log and
# 0x2009 carries the achievement table -- see flows.

opcodes:
  - opcode: 0x415
    name: scene_object_state_change
    direction: both
    c2s:
      size: 0x18
      extra: "sender uid"
      fields:
        - {offset: 0x10, type: u16, name: map_id, values: "G+0x652 = current map id (set from 0x2000 +0x1a / 0x44e +0x10)", notes: ""}
        - {offset: 0x12, type: u16, name: zero, values: "0", notes: ""}
        - {offset: 0x14, type: u16, name: object_id, values: "scene-object (gadget) id, copied from the G+0x65a table entry", notes: "the whole 4-byte table entry {u16 id, i8 state, u8} is copied to +0x14..+0x17"}
        - {offset: 0x16, type: i8, name: object_state, values: "the client's CURRENT state of that object (not a requested state)", notes: ""}
        - {offset: 0x17, type: u8, name: entry_byte3, values: "copied from the table entry", notes: "unknown"}
    s2c:
      min_size: 0x18
      extra: "not read"
      fields:
        - {offset: 0x14, type: u16, name: object_id, values: "must match an id in the 100-entry table G+0x65a (filled by 0x414 / 0x44f +0x2c); 0 or unknown id = ignored", notes: ""}
        - {offset: 0x16, type: i8, name: new_state, values: "new state; ignored if equal to the stored one", notes: "stored at G+0x65c+4*i, then FUN_00483b5c(state,1) re-renders the gadget and FUN_0048547e refreshes"}
      accepted_if: "id != 0, present in G+0x65a table, state differs, and gadget id exists in the scene (FUN_0044d2bf) -- otherwise only the table is updated / nothing happens"
    server_reply: "Broadcast S->C 0x415 {+0x14 id, +0x16 new state} to everyone in the map when the interaction changes the object (e.g. chest opened, flag taken). No ack required; silence leaves the object unchanged."
    client_effect: "Updates the scene-object state table and the gadget's visual; quest markers (FUN_005990ce, objective type 5 = gadget) depend on these objects."
    handler: FUN_004706c2
    send_sites: [FUN_00462db9, FUN_0056e3d8]
    confidence: medium
    verified: true
    evidence: "FUN_00462db9 sends it when an interaction (0x451) finishes on a type-5 gadget whose table state byte == 1, then sends 0x451 {target,kind 1,state 0}; FUN_0056e3d8 (NPC dialog on a gadget) sends it if PC level (PC+0x237) is within gadget+0x1e..+0x1f and gadget type (+0xc) is 1,3,4 or 6. Belongs with world/scene objects (0x414/0x44f) more than quests -- MISASSIGNED, kept here as assigned."

