flows:
  - name: login_production_path (serverlist world has a Login address; live-tested)
    steps:
      - "client (login state 1) polls web WorldChannel.asp (world=N) for every world and ChannelList.asp every 30 s; return JSON status rows. Earlier tests accepted empty HTTP 200 bodies, but the Windows token-login test remained at Checking without rows (2026-10-05)"
      - "user logs in (typed id/password are stored, not sent yet); state 2: connect to the Login address (60 s timeout)"
      - "C->S 0x4207 (0x9c, extra 0, +0x14 token char[128] (zeros with -nosg), +0x94 0x41e, +0x98 0xff) on the login connection"
      - "S->C 0x4201 (0x40, +0x10 result 0, +0x14 channel index 0, +0x18/+0x1c ticket A/B, +0x20 account name)"
      - "client waits 1 s, closes the login socket itself, connects to channel[+0x14]'s game server"
      - "C->S 0x4200 (0x60, extra 0, +0x10 account, +0x30 password, +0x44 channel, +0x48 0x41e, +0x4c 0xff, +0x50/+0x54 ticket)"
      - "S->C 0x2001 (0xb8c, extra = session tag, 5 slot records, +0xb50 account uid, +0xb74 nation, +0xb78/+0xb7c balances, +0xb80 unix time) -> character select scene"
  - name: login_error_and_duplicate_session
    steps:
      - "S->C 0x4201 with +0x10 = 3/4 bad credentials, 8 version, 9 disabled, 5/6 web errors, >= 10 default -> dialog, state 10"
      - "S->C 0x4201 with +0x10 = 7 (already logged in) -> C->S 0x4202 (0x60: account, password, +0x48 0x41e, +0x4c 0xff) on the same connection"
      - "server kicks the older session (optionally telling it sysmsg 118) -> S->C 0x4201 result 0 -> normal path"
  - name: legacy_direct_login (world without Login address; not used by the shipped serverlist)
    steps:
      - "client connects straight to channel 0's game server"
      - "C->S 0x405 (0x48, +0x14 account char[32], +0x34 password char[20])"
      - "S->C 0x405 {+0x18 0x14} = account not registered, or (inferred) S->C 0x2001 on success"
  - name: select_character_enter_world
    steps:
      - "C->S 0x406 (0x20, extra = session tag, +0x10 u64 char id; 1 per 5 s)"
      - "S->C 0x2000 (extra = player uid -> becomes the obfuscation key) + 0x41f + enter-world burst (world.yaml); from now on C->S payloads are ~(w - uid)"
  - name: create_character
    steps:
      - "client validates name (1..16 alnum), nation (if account nation 0), class != 7, finds the first free slot"
      - "C->S 0x407 (0x260, extra = session tag, +0x10 slot, +0x18 nation, +0x28 name, +0x56 class, +0x58/+0x5c appearance, +0x60 weapon code)"
      - "S->C 0x407 echo with +0x20 u64 new char id > 0 and the completed record -> slot filled, back to char select with it selected"
      - "failure: S->C 0x407 with id 0 + S->C 0x2003 {+0x18 sysmsg id (18 name in use)}"
  - name: delete_character
    steps:
      - "confirm dialog; client refuses guild members"
      - "C->S 0x408 (0x20, extra = session tag, +0x10 u64 char id) and the client wipes the slot at once"
      - "S->C 0x2004 {+0x10 id, +0x18 0} (or {+0x18 sysmsg}; restoring the wiped slot: 0x2001 restores data but does not redraw in char select; a 0x407 echo of the old record may, untested)"
  - name: buy_character_slot
    steps:
      - "'create' with no free slot but a locked (id -1) slot -> 'Do you want to buy extra slot?' -> ok"
      - "C->S 0x499 (0x20, extra = session tag, no payload)"
      - "S->C 0x499 {+0x10 0, +0x14 slot, +0x18 currency A, +0x1c jewels}"
      - "optional: C->S 0x200f (jewel refresh, 1 per 10 s) -> S->C 0x200f {+0x38 jewels, +0x3c bonus}"
  - name: back_to_character_select_from_game
    steps:
      - "menu button (FUN_0059c700) -> 4.95 s countdown (cancelled if busy/in combat, FUN_0048634f) -> C->S 0x409 {+0x10 0}"
      - "S->C 0x2001 (new list; client leaves the game scene and opens character select on the same connection). NOTE: the net key is not reset, so later char-select C->S packets carry key = old uid in +0x0c and are obfuscated with it"
      - "fallback if no 0x2001 within 3 s: client closes the socket -> login scene (or exits if launched with -ologin)"
  - name: exit_game
    steps:
      - "window close (WM_CLOSE) -> 4.95 s countdown (cancelled if busy) -> C->S 0x409 {+0x10 1} (extra = uid); client quits 1 s later; server saves and drops the session"
  - name: back_from_character_select
    steps:
      - "char-select 'back': no packet; client closes the socket and returns to the login scene (quits when launched with -ologin)"
  - name: channel_move
    steps:
      - "PanelChannelMove pick (not while busy) -> 4.95 s countdown -> C->S 0x40a {+0x20 target channel}"
      - "S->C 0x40a {+0x10 key byte, +0x18/+0x1c ticket, +0x20 channel, +0x24 0}"
      - "client closes the socket, connects to that channel's ip:port from serverlist.sof"
      - "C->S 0x4200 {+0x44 channel, +0x4c key byte, +0x50/+0x54 ticket}"
      - "S->C 0x2000 (same char, new uid allowed, +0x6e0 channel) + enter-world burst (full reload)"
  - name: server_initiated_newbie_channel_move
    steps:
      - "S->C 0x41d {+0x10 0xe3 (sysmsg 227), +0x14 channel index} -> dialog 0x42 'Do you want to move to %d Channel?'"
      - "OK -> C->S 0x40a {+0x20 = that channel} immediately (no countdown), then as channel_move"
      - "RISK (verifier, code-read): FUN_00487809 does not set game-scene +0xac = 1, and FUN_0048d666 only runs the state 3/4 reconnect (connect + 0x4200) when +0xac == 1 (set only by PanelChannelMove FUN_005315a7). CGameScene ctor FUN_00428bc3 / init FUN_0048b435 never initialise +0xac. So after the 0x40a ok (socket closed, +0xa0 = 3) a client that never used PanelChannelMove may never reconnect. Test live before relying on 0x41d code 0xe3."
  - name: keepalive
    steps:
      - "C->S 0x401 (header only, extra = key) every 240 s on whatever connection is open; no reply"
  - name: disconnect
    steps:
      - "server closes the socket: login scene -> 'Please try again in a few minutes' (state 10); char select / game -> DisconnectProcess panel (ui/panel/disconnect.panel); during an exit -> client quits"
      - "client closes the socket: after 0x4201 (moving to the game server), after 0x409, on 0x40a ok, on char-select back"

server_rules:
  - name: authentication
    client_expects: "login server answers 0x4207 with 0x4201; the token is all zeros when the client runs with -nosg, and the typed id/password only reach the GAME server in 0x4200 (+0x10/+0x30, plaintext). 0x405 is a legacy id/password path."
    informed_by: "none (accounts are server-side)"
    default: "accept 0x4207 (token login or anonymous dev login), issue a random ticket A/B bound to the account, and authenticate 0x4200 by (account name, ticket A, ticket B); optionally check the 0x4200 password. Reject with 0x4201 result 3."
  - name: version_check
    client_expects: "client version 0x41e (1054) in 0x4207 +0x94, 0x4200/0x4202 +0x48; result 8 shows 'Client Version doesn't match'"
    informed_by: "none"
    default: "accept 0x41e only; else 0x4201 result 8"
  - name: channel_assignment
    client_expects: "0x4201 +0x14 is a 0-based index into the channel list of the selected world in the CLIENT's serverlist.sof (gs1 = 0); out of range -> 'Can not connect now'. The ip:port always comes from serverlist.sof."
    informed_by: "Data/config/serverlist.sof (tools/sof.py), WorldChannel/ChannelList load values"
    default: "index 0 (one game server); for several channels run one listener per gsN entry"
  - name: duplicate_login
    client_expects: "result 7 makes the client send 0x4202 automatically (no dialog)"
    informed_by: "system_msg 118 'Account already logged in connection closed.'"
    default: "on 0x4207/0x4200 for an account already online: answer 7; on 0x4202 kick the old session and answer 0"
  - name: session_tag
    client_expects: "0x2001 extra is echoed in the extra of 0x406/0x407/0x408/0x499/0x200f until 0x2000; 0x2000 extra (player uid) replaces it"
    informed_by: "none"
    default: "use the connection's future player uid as the tag (stub: 1); verify it on char-select packets"
  - name: player_uid_and_key
    client_expects: "0x2000 extra = player uid 1..0x3F6, unique in the scene; it becomes the obfuscation key for all later C->S payloads and the extra of every in-world packet and of 0x401"
    informed_by: "none"
    default: "allocate per scene/channel; de-obfuscate with key = header +0x0c"
  - name: character_ids
    client_expects: "u64 > 0, never 0 or 0xFFFFFFFF_FFFFFFFF (those mean empty / locked); unique per account list"
    informed_by: "none"
    default: "global autoincrement"
  - name: slots
    client_expects: "exactly 5 slot records in 0x2001; locked = id -1 (buyable via 0x499); empty = id 0 with rec+0x8c delete time (reusable after 86400 s, client clock = 0x2001 +0xb80)"
    informed_by: "none (ExpandSlot.tsv is inventory/storage expansion, not character slots)"
    default: "3 open + 2 locked slots, or all 5 open; slot price for 0x499: unknown (spec notes cite 5000 jewels, unverified)"
  - name: character_creation_rules
    client_expects: "name 1..16 ASCII letters/digits; class 1/4/5 (7 refused client-side); starting weapon item code one of the class's Create_Char weaponN_item; nation 1..3 when the account has none; NatBlockN != 0 (WorldChannel.asp) greys out nation N"
    informed_by: "Create_Char.tsv (classes, weapons, face/hair/colour lists), UnitDB.tsv, Item_Base.tsv, Level_Table.tsv, system_msg.tsv (18 name in use)"
    default: "re-validate everything, enforce unique names (0x407 id 0 + 0x2003 sysmsg 18), fill level 1, base stats from UnitDB/Level_Table, give the chosen weapon as rec+0x40 item, set the account nation from +0x18 on the first character"
  - name: delete_rules
    client_expects: "client blocks guild members and wipes the slot before the answer"
    informed_by: "system_msg (e.g. 81/281 guild-related), Strdef texts"
    default: "refuse if in a guild or owning a guild; on success stamp delete time = now; on refusal see 0x408 server_reply (0x2001 alone does not redraw the slot)"
  - name: leave_to_character_select
    client_expects: "after 0x409 mode 0 a 0x2001 within 3 s keeps the connection; otherwise the client disconnects"
    informed_by: "none"
    default: "save the character, despawn it for others (0x806), send 0x2001; keep the connection; keep de-obfuscating that connection's C->S with key = header +0x0c (still the old uid, the client does not reset it)"
  - name: channel_move_tickets
    client_expects: "0x40a ok carries an opaque key byte + 2 u32 tickets that come back in the next 0x4200; the target channel must differ from the current one"
    informed_by: "none"
    default: "random key byte (not 0xff) + ticket; valid 30 s, single use; reply 0x2000 on the new channel with the stored position. Refuse while in combat/match with a sysmsg id in +0x24"
  - name: heartbeat_timeout
    client_expects: "C->S 0x401 only every 240 s; no client-side receive timeout exists"
    informed_by: "none"
    default: "drop a connection after 600 s of silence"
  - name: clocks
    client_expects: "unix seconds in 0x2001 +0xb80 and 0x2000 +0x6f8; server ms tick in every S->C header +0x08 (the client re-bases its outgoing tick on each packet; 0 accepted)"
    informed_by: "none"
    default: "UTC unix time; header tick = server monotonic ms (so C->S ticks become comparable to server time)"
  - name: login_socket_close
    client_expects: "the login server must not close the socket after 0x4201; the client closes it when it moves to the game server (a server-side close in the login scene shows an error)"
    informed_by: "live stub (login and game on different ports)"
    default: "keep it open; close idle login connections after 60 s"
  - name: web_endpoints
    client_expects: "HTTP POST, Content-Type application/x-www-form-urlencoded, to http://<serverlist web host>/JoyImpact/<Page>.asp; status must be 200; body <= 0x32000 bytes parsed as JSON: an array of objects, each field read by name (FUN_006d4400, Json::Value::operator[]) as an integer/text. FUN_006d7b70 is Json::Reader::parse, not an XML parser (corrected 2026-10-05). Connect timeout 1000 ms. Empty 200 body = no rows (accepted)"
    informed_by: "none (web DB was server-side)"
    default: "serve empty 200 bodies for everything except what a feature needs; see web_endpoints below"
  - name: world_and_channel_state
    client_expects: "WorldChannel.asp row: WORLD (= serverlist world index), WORLD_STATE (> 0 online / green 'Medium', <= 0 maintenance), NatBlock1..3 (non-zero = that nation cannot be chosen), CH_01..CH_05 per-channel load (< 0 or > 9999 'Check'/maintenance, < 400 'Medium' green, >= 400 'High' red; any listed channel is marked known), NEWBIE_CHANNEL (read, unused). Live Windows test 2026-10-05: empty/XML responses leave token-mode login at Checking; a JSON array of objects changes the world to green Medium. See docs/spec/world.md section 7."
    informed_by: "player counts per channel"
    default: "JSON array with one object: WORLD echoes the requested index, WORLD_STATE=1, CH_01=0, CH_02..05=-1, NatBlock1..3=0, NEWBIE_CHANNEL=0"

