# Warmonger / Crush Online: client<->server contract, SESSION subsystem
# (login server + game-server login, character list / select / create / delete / buy slot,
#  channels and channel move, leave game, heartbeat, time sync, disconnect, web .asp endpoints).
#
# Conventions
# - All offsets are from packet start; payload begins at +0x10. Header: u16 len | u16 0xA53C |
#   u16 opcode | u16 extra | u32 tick | u32 key.
# - Server packets: plaintext (key 0); the client never de-obfuscates S->C. The dispatcher
#   FUN_0047a36c checks only magic (else 'PACKET HEADER ERROR') and len > 0x10 (else
#   'PACKET SIZE ERROR'); there is no per-opcode size check, so min_size = highest offset the
#   handler reads. Max packet 0x1000. EVERY accepted S->C packet sets the client's tick base:
#   FUN_0046ff2e(hdr+0x08) -> client tick = last server tick + elapsed ms (FUN_0046fefd); that tick
#   is what the client writes into C->S header +0x08. Tick 0 is accepted (live-tested).
# - C->S packets: built by FUN_004a730b (zero-fills, never writes tick/key) or inline
#   (0xA53C0xxx immediates). Send path FUN_004a7d7c -> FUN_004a73b6 sets hdr+0x0c = key
#   (net+0xc, low 16 bits) and, when key != 0, rewrites every u32 word from +0x10 as ~(w - key);
#   FUN_004a7c0d stamps hdr+0x08 = tick and drops the packet if the socket is not connected (<0x13).
#   key = 0 until S->C 0x2000 sets net+0xc = player uid; so login/char-select packets are plaintext
#   ON A FRESH CONNECTION ONLY. The key is cleared only when a new connection is set up (FUN_00470d15 ->
#   FUN_004a7407 memsets the socket object incl. socket+8 = net+0xc); S->C 0x2001 does NOT reset it. So after
#   0x409 mode 0 -> 0x2001 on the same connection, char-select packets (0x406/0x407/0x408/0x499) keep
#   header +0x0c = the OLD player uid and their payloads are obfuscated with it (verified in code, not live).
# - extra on char-select packets (0x406/0x407/0x408/0x499/0x200f) = acct+0xec = the 0x2001 'session
#   tag'; after 0x2000 acct+0xec = player uid.
# - acct = *DAT_00847ac8 (account/session object). entry[i] = acct+0x7ea+i*0x65f (5 slots);
#   rec = the 0x240-byte character record at entry+0x203 (rec+N = entry+0x203+N).
#   acct+0x70 wstring account name, +0xa8 wstring password (typed), +0xee char[256] login token,
#   +0xe0/+0xe4 u32 session ticket A/B, +0xe8 u8 'login ok seen', +0xea i16 channel index from
#   0x4201, +0x618 ptr selected world (serverlist entry, 0x1d8 B), +0x61c/+0x620 connect ip/port,
#   +0x624 current channel index, +0x628 account UID, +0x62c u8 account nation, +0x634/+0x638
#   currency A / jewels, +0x630 jewel bonus.
# - World entry (0x1d8 B, from serverlist.sof): +0x38 wstring Login address ('ip:port', empty =
#   none), +0x70 web host, +0x1c0 i16 world index, +0x1c2 u8 WORLD_STATE, +0x1c4 vector of channel
#   entries (0x74 B each: +0x00 wstring 'ip:port' of that game server, +0x70 i16 load value,
#   +0x72 u8 newbie flag, +0x73 u8 'state known'), +0x1d5/+0x1d6/+0x1d7 u8 NatBlock1..3.
# - Connections: login server = world 'Login' (8815 in our serverlist.sof), game server = the
#   selected channel's address (gs1 = channel 0, 8813), web = 'web' host (HTTP POST, port 80/8080).
#   Command line: '-ologin=<token>' stores a token (DAT_00846ea4, flag DAT_00846ea2); '-steam'
#   sets DAT_00846ea1; '-nosg' skips the patcher. Without a token, 0x4207 carried an empty
#   token in earlier tests; the Windows launcher now passes '-ologin=player'.
# Sources: decompiled.c / disasm.txt (re-checked for this file), spec/group00..03.md,
# spec/world.md, contract/examples.md, server/{stub,handlers,proto}.py and the live server log
# the server log (live-tested = confirmed working).

opcodes:

  # ------------------------------------------------------------------ keepalive
  - opcode: 0x401
    name: heartbeat
    direction: c2s
    c2s:
      size: 0x10
      extra: "net key (= player uid once in world, 0 before); header only"
      fields: []
      variants:
        - {size: 0x1c, extra: "0", fields: [{offset: 0x10, type: u32, name: dev_toggle, values: "1 (button 0x62) / 0 (button 0x63)", notes: "PanelDevTest buttons only (FUN_00520368, inline header 0xA53C001C at 0x520557/0x520590); panel has no opener in the shipped client; meaning unknown"}]}
    s2c: null
    server_reply: "none. Treat any received packet as liveness."
    client_effect: "sent by FUN_00428e23 (main-loop timer) every 240 s (0x7253b8 = 240.0, accumulated frame seconds) whenever a socket exists, in every scene (login, char select, game). Live log: 0x401 extra=1 key=1 len 16 about 4 min after entering the world."
    handler: null
    send_sites: [FUN_004a7d17 (via FUN_0046fff4), FUN_00520368]
    confidence: high
    verified: true
    evidence: "FUN_004a7d17 builds 0xA53C0010 / 0x401 / extra = socket+8; FUN_00428e23 compares the accumulator with 240.0; stub.log 22:04:31 '<- op=0x0401 extra=0x0001 key=0x0001 len=16'"

  # ------------------------------------------------------------------ login
  - opcode: 0x405
    name: legacy_login / login_notice
    direction: both
    c2s:
      size: 0x48
      extra: "0"
      fields:
        - {offset: 0x10, type: u32, name: zero, values: "0", notes: ""}
        - {offset: 0x14, type: "char[32]", name: account, values: "acct+0x70 (typed id), narrow", notes: ""}
        - {offset: 0x34, type: "char[20]", name: password, values: "acct+0xa8 (typed password), narrow, plaintext", notes: ""}
      notes: "Sent only in login state 3 when the selected world has NO Login address (DAT_00846ea0 == 0); the socket then goes straight to channel 0's game server. The shipped serverlist.sof has a Login address, so this path is not used in production config."
    s2c:
      min_size: 0x1c
      extra: "unused"
      fields:
        - {offset: 0x18, type: u32, name: reason, values: "0x14 (= sysmsg 20 StrDef_AccountEmpty 'This account is not registered with us.') is the only value acted on", notes: "anything else is ignored"}
      accepted_if: "login scene exists (DAT_0084e84c) and +0x18 == 0x14; otherwise dropped"
    server_reply: "for C->S 0x405 (legacy path, low confidence): unknown account -> S->C 0x405 {+0x18 = 0x14}; success -> either S->C 0x2001 directly (state 3 -> FUN_0049630a -> state 8), or S->C 0x4201 OK: state 5, after 1 s FUN_00496470 sets state 6 (it skips the reconnect because DAT_00846ea0 == 0), and the login-scene update FUN_00496b5c sees no connect in progress but a connected socket and moves to state 7, which sends C->S 0x4200 (tickets from the 0x4201) on this same connection. (Corrected by verifier: the earlier claim that a 0x4201 does nothing here was wrong.)"
    client_effect: "S->C: FUN_004966f8(3, 0x14) -> error dialog with system message 20 text, login state -> 10 (error; user retries)."
    handler: FUN_0047000f
    send_sites: [FUN_004958d2]
    confidence: medium
    verified: true
    verifier_note: "layout and handler verified; server_reply corrected (0x4201 OK does lead to 0x4200 on the same connection)"
    evidence: "inline header 0xA53C0048/0x405 at 0x495ad1 (ebp-0x58), account -> ebp-0x44 (+0x14), password -> ebp-0x24 (+0x34); handler body 'if (DAT_0084e84c && pkt+0x18 == 0x14) FUN_004966f8(3,0x14)'; system_msg.tsv id 20"

  - opcode: 0x4207
    name: token_login
    direction: c2s
    c2s:
      size: 0x9c
      extra: "0"
      fields:
        - {offset: 0x10, type: u32, name: zero, values: "0", notes: ""}
        - {offset: 0x14, type: "char[128]", name: token, values: "acct+0xee (first 0x80 bytes): the '-ologin=<token>' command-line value or the OAuth/Steam token; ALL ZERO when started with -nosg (live)", notes: "typed id/password are NOT sent here"}
        - {offset: 0x94, type: u32, name: client_version, values: "0x41e (1054)", notes: "constant; NOTES.local.md calls 0x41e an opcode, it is this version number"}
        - {offset: 0x98, type: u8, name: marker, values: "0xff", notes: ""}
        - {offset: 0x99, type: "bytes[3]", name: pad, values: "0", notes: ""}
    s2c: null
    server_reply: "S->C 0x4201 to the sender on the same (login) connection. Do NOT close the socket afterwards: the client closes it itself when it connects to the game server; a server-side close while still in the login scene shows 'Please try again in a few minutes'."
    client_effect: "login state 3 (90 s timeout -> state 0xb). Sent when the world has a Login address (DAT_00846ea0 = 1) and the socket exists."
    handler: null
    send_sites: [FUN_004958d2]
    confidence: high
    verified: true
    evidence: "FUN_004a730b(buf,0x4207,0x9c,0,1) at 0x49595b; rep movs 0x20 dwords acct+0xee -> ebp-0x98 (+0x14); [ebp-0x18]=0x41e (+0x94), [ebp-0x14]=0xff (+0x98); stub.log: 3 live logins '[login] <- op=0x4207 ... len=156' body all zero then '1e040000ff000000'"

  - opcode: 0x4201
    name: login_result
    direction: s2c
    s2c:
      min_size: 0x40
      extra: "unused"
      fields:
        - {offset: 0x10, type: i32, name: result, values: "OK when r == 1 or r < 3 (0, 1, 2, negatives). Errors (FUN_004966f8): 3/4 'Invalid username/password combination', 5 LOGIN_ERR_WEB, 6 LOGIN_ERR_WEBTIME, 7 = already logged in -> client immediately sends C->S 0x4202 (no dialog), 8 'Client Version doesn't match', 9 'administrator is currently verifying' (disabled/banned), >= 10 GUI_Login_Msg_Err_Default", notes: ""}
        - {offset: 0x14, type: i16, name: channel_index, values: "0-based index into the selected world's channel list (serverlist.sof gsN); must be < channel count or 'CantConnect2'", notes: "acct+0xea; overridden by the channel the user picked in the login UI (+0xd8 - 1) if any; echoed in 0x4200 +0x44"}
        - {offset: 0x16, type: "bytes[2]", name: pad, values: "0", notes: ""}
        - {offset: 0x18, type: u32, name: ticket_a, values: "server-chosen session ticket / account id", notes: "acct+0xe0, echoed in 0x4200 +0x50"}
        - {offset: 0x1c, type: u32, name: ticket_b, values: "second ticket word", notes: "acct+0xe4, echoed in 0x4200 +0x54"}
        - {offset: 0x20, type: "char[32]", name: account_name, values: "narrow, NUL-terminated", notes: "converted (FUN_0042d65e) into acct+0x70, replacing the typed id; echoed in 0x4200 +0x10 and 0x200f +0x10"}
      accepted_if: "always parsed; the OK branch also clears acct+0x628 and only proceeds when the login scene exists and acct+0xe8 == 0 (first OK only). Error branch needs the login scene."
    server_reply: "none (client sends 0x4200 to the game server by itself)."
    client_effect: "OK: acct+0xe8 = 1, login state 5; after 1.0 s FUN_00496470: state 6, 'Connecting to game server', connect to channel[channel_index] address (60 s timeout -> state 0xb, refused -> 'Can not connect to game server now'); once connected state 7 sends 0x4200. Error: dialog + state 10 (7 excepted)."
    handler: FUN_00470032
    send_sites: []
    confidence: high
    verified: true
    evidence: "handler body; FUN_00496470 uses acct+0xea as channel index into world+0x1c4 (0x74 B entries); FUN_004966f8 switch at 0x496740 and StringAll_Eng texts; live: stub login_ok() result 0, index 0, A=B=1"

  - opcode: 0x4202
    name: force_login_retry
    direction: c2s
    c2s:
      size: 0x60
      extra: "0"
      fields:
        - {offset: 0x10, type: "char[32]", name: account, values: "acct+0x70", notes: ""}
        - {offset: 0x30, type: "char[20]", name: password, values: "acct+0xa8 (typed password; empty in token mode)", notes: ""}
        - {offset: 0x44, type: u8, name: channel_index, values: "0", notes: ""}
        - {offset: 0x48, type: u32, name: client_version, values: "0x41e", notes: ""}
        - {offset: 0x4c, type: u8, name: marker, values: "0xff", notes: ""}
        - {offset: 0x50, type: u32, name: ticket_a, values: "0", notes: ""}
        - {offset: 0x54, type: u32, name: ticket_b, values: "0", notes: ""}
      notes: "same layout as 0x4200; sent automatically on the current (login) connection when 0x4201 returns result 7, together with 'Connecting to login server.'"
    s2c: null
    server_reply: "disconnect / kick the other session of this account (it may be told with sysmsg 118 'Account already logged in connection closed.'), then S->C 0x4201 result 0 to this sender."
    client_effect: "login state is left unchanged (still waiting for 0x4201)."
    handler: null
    send_sites: [FUN_00494da9]
    confidence: medium
    verified: true
    verifier_note: "layout verified at 0x494dee; reply semantics still inferred"
    evidence: "inline header 0xA53C0060/0x4202 at 0x494dee (ebp-0xa8): account ebp-0x98, password ebp-0x78, [ebp-0x64]=0, [ebp-0x60]=0x41e, [ebp-0x5c]=0xff; called from FUN_004966f8 case 7 (0x49682c). Reply semantics inferred."

  - opcode: 0x4200
    name: game_server_login
    direction: c2s
    c2s:
      size: 0x60
      extra: "0"
      fields:
        - {offset: 0x10, type: "char[32]", name: account, values: "acct+0x70 (name from 0x4201, else typed id)", notes: "live: the account name from 0x4201"}
        - {offset: 0x30, type: "char[20]", name: password, values: "acct+0xa8 typed password (plaintext; empty in token mode / live)", notes: ""}
        - {offset: 0x44, type: u8, name: channel_index, values: "login: acct+0xea (0x4201 +0x14); channel move: 0x40a +0x20", notes: ""}
        - {offset: 0x45, type: "bytes[3]", name: pad, values: "0", notes: ""}
        - {offset: 0x48, type: u32, name: client_version, values: "0x41e", notes: ""}
        - {offset: 0x4c, type: u8, name: move_key, values: "0xff on login; 0x40a +0x10 on a channel move", notes: "tells a fresh login (0xff) from a channel-move reconnect"}
        - {offset: 0x50, type: u32, name: ticket_a, values: "0x4201 +0x18 / 0x40a +0x18", notes: ""}
        - {offset: 0x54, type: u32, name: ticket_b, values: "0x4201 +0x1c / 0x40a +0x1c", notes: ""}
        - {offset: 0x58, type: "bytes[8]", name: pad, values: "0", notes: ""}
    s2c: null
    server_reply: "fresh login (+0x4c = 0xff): S->C 0x2001 character list (extra = new session tag). Channel-move reconnect (+0x4c = key byte from our 0x40a, tickets match): the client is still in the game scene, so reply S->C 0x2000 for the same character (+0x6e0 = new channel; it restarts loading = full reload) followed by the normal enter-world burst; do NOT send 0x2001 there (in game it throws the player back to character select)."
    client_effect: "login state 7 -> waits for 0x2001 (no timeout)."
    handler: null
    send_sites: [FUN_004958d2 (state 7, 0x4960c7), FUN_0048d666 (channel move state 4, 0x48dd2b), FUN_004958d2 (0x4959c5, effectively unreachable: needs the socket check to fail then succeed back to back)]
    confidence: high
    verified: true
    evidence: "0x4960c7: account->ebp-0x60, password->ebp-0x40, acct+0xea->ebp-0x2c (+0x44), 0x41e->ebp-0x28, 0xff->ebp-0x24, acct+0xe0/e4->ebp-0x20/-0x1c; 0x48dd2b: game-scene copy of 0x40a +0x10/+0x18/+0x1c/+0x20 -> +0x4c/+0x50/+0x54/+0x44; stub.log '[game] <- op=0x4200 len=96' body = 'player'..., +0x48 1e040000, +0x4c ff, +0x50 1, +0x54 1 -> 0x2001 (live)"

  # ------------------------------------------------------------------ character select
  - opcode: 0x2001
    name: character_list
    direction: s2c
    s2c:
      min_size: 0xb8c
      extra: "session tag (any non-colliding u16; stub uses 1) -> acct+0xec; echoed in the extra of 0x406/0x407/0x408/0x499/0x200f"
      fields:
        - {offset: 0x10, type: "struct[5] (0x240 each)", name: slots, values: "slot i at +0x10+i*0x240, copied verbatim to entry[i]+0x203", notes: "record layout below"}
        - {offset: 0x10, type: u64, name: "rec+0x00 char_id", values: "0 = empty slot; 0xFFFFFFFF_FFFFFFFF = locked slot (buyable with 0x499); else the character id (> 0)", notes: ""}
        - {offset: 0x18, type: "char[40]", name: "rec+0x08 name", values: "narrow, NUL-terminated (converted to wchar entry+0x1b3)", notes: ""}
        - {offset: 0x44, type: u8, name: "rec+0x34 level", values: ">= 1 (stub forces 1; 0 breaks the avatar)", notes: ""}
        - {offset: 0x46, type: u16, name: "rec+0x36 class", values: "class / unit id from Create_Char (1 Saint, 4 Punisher, 5 Gardian, 7 Valkyrie); non-zero and valid or entering the world aborts (FUN_0048b435)", notes: ""}
        - {offset: 0x48, type: u32, name: "rec+0x38 appearance_a", values: "the bytes sent by 0x407 +0x58 (face/hair/colour choices)", notes: ""}
        - {offset: 0x4c, type: u32, name: "rec+0x3c appearance_b", values: "0x407 +0x5c", notes: ""}
        - {offset: 0x50, type: "bytes[0x30]", name: "rec+0x40 equipment", values: "rec+0x40 main weapon 16-byte item (u16 item code first; 0x407 +0x60), up to rec+0x6f", notes: "same fields 0x803 sends at +0xbc..+0xeb"}
        - {offset: 0x8c, type: i16, name: "rec+0x7c guild_id", values: "< 1 = no guild (delete allowed), else delete refused client-side", notes: ""}
        - {offset: 0x9c, type: u32, name: "rec+0x8c delete_time", values: "unix seconds the slot was emptied; an empty slot is reusable when 0 or older than 86400 s", notes: "client-side only gate"}
        - {offset: 0x10, type: "bytes", name: "rec other", values: "unknown; zeros accepted (rec+0x80 is used by the stub as gold)", notes: ""}
        - {offset: 0xb50, type: u32, name: account_uid, values: "account id", notes: "acct+0x628; used in web/analytics URLs; when it was 0 before, FUN_0040ea95 runs (first login)"}
        - {offset: 0xb54, type: "bytes[0x20]", name: unused, values: "0", notes: "not read"}
        - {offset: 0xb74, type: u8, name: account_nation, values: "0 = not chosen yet (char create then asks for nation 1..3), else 1..3", notes: "acct+0x62c and every entry+0x655"}
        - {offset: 0xb78, type: u32, name: currency_a, values: "", notes: "acct+0x634 (0x499 compares its +0x18 with this)"}
        - {offset: 0xb7c, type: u32, name: jewels, values: "cash balance", notes: "acct+0x638"}
        - {offset: 0xb80, type: u32, name: server_time, values: "unix seconds", notes: "time sync: net+0xb084 = this, net+0xb088 = local tick; server clock = this + elapsed_ms/1000 (FUN_0046ff4e). Used for slot delete cooldown etc."}
        - {offset: 0xb84, type: u8, name: unknown_b3ac, values: "unknown", notes: "acct+0xb3ac; no reader found"}
        - {offset: 0xb88, type: u32, name: unknown_b3b0, values: "unknown", notes: "acct+0xb3b0; no reader found"}
      accepted_if: "always applied. Each slot entry gets unit id (entry+0x1ae) = slot number 1..5 until 0x2000."
    server_reply: "none; the player then sends 0x406 / 0x407 / 0x408 / 0x499 / 0x200f."
    client_effect: "login scene: state 8 -> 9 -> character-select scene (FUN_004298e4(3)). Game scene: resets the character state (FUN_00429d08(0)), kills the game process and switches to character select (so it is the right answer to C->S 0x409 mode 0). Char-select scene: data replaced in place only; the handler calls no char-select refresh (the slot widgets are built by FUN_0049284d / FUN_00491f17, which 0x2001 never reaches), so a slot restored this way is probably not redrawn until the list is rebuilt (verifier: code-read, not live-tested)."
    handler: FUN_004760b2
    send_sites: []
    confidence: high
    verified: true
    verifier_note: "all offsets verified in FUN_004760b2; corrected: no UI redraw in char-select scene"
    evidence: "handler body (memcpy 0x90 dwords per slot, name +8, nation byte, offsets 0xb50..0xb88); live: handlers.character_list -> 0xb8c bytes, char select shown"

  - opcode: 0x406
    name: select_character
    direction: c2s
    c2s:
      size: 0x20
      extra: "session tag (acct+0xec from 0x2001)"
      fields:
        - {offset: 0x10, type: u64, name: char_id, values: "rec+0x00 of the selected slot", notes: ""}
        - {offset: 0x18, type: "bytes[8]", name: pad, values: "0", notes: ""}
    s2c: null
    server_reply: "S->C 0x2000 (extra = new player uid, +0x10 = same char id) + 0x41f and the enter-world burst (see world.yaml). An unknown/foreign char id: no valid answer exists in the client; send nothing or 0x2001 again."
    client_effect: "rate-limited to one per 5 s (this+0x9c); only when a slot is selected (FUN_0042841a)."
    handler: null
    send_sites: [FUN_0049229d (button 'SelBtn' / double click via FUN_004935a7)]
    confidence: high
    verified: true
    evidence: "inline header 0xA53C0020/0x406 at 0x4922ff, char id -> ebp-0x14/-0x10 (= +0x10/+0x14); stub.log '<- op=0x0406 extra=0x0001 ... body=0100000000000000...' -> 0x2000 (live)"

  - opcode: 0x407
    name: create_character
    direction: both
    c2s:
      size: 0x260
      extra: "session tag (acct+0xec)"
      fields:
        - {offset: 0x10, type: u32, name: slot, values: "first slot with id 0 and delete_time 0 or > 86400 s old (0..4)", notes: ""}
        - {offset: 0x14, type: u32, name: zero, values: "0", notes: ""}
        - {offset: 0x18, type: u8, name: nation, values: "1..3 (create panel this+0x9c; 0 or > 3 -> 'Please select a nation.' and nothing is sent)", notes: "chosen only when the account nation is 0; otherwise the account nation"}
        - {offset: 0x19, type: "bytes[7]", name: pad, values: "0", notes: ""}
        - {offset: 0x20, type: "struct (0x240)", name: record, values: "a character record; client fills only the fields below, rest 0", notes: "rec+N = packet +0x20+N"}
        - {offset: 0x28, type: "char[40]", name: "rec+0x08 name", values: "client-validated: 1..16 chars, ASCII letters/digits only, no whitespace (FUN_005a617b(min 1, max 0x11)); forbidden words -> 'Use a different name.'", notes: ""}
        - {offset: 0x56, type: u16, name: "rec+0x36 class", values: "Create_Char class id 1/4/5 (7 Valkyrie is refused client-side)", notes: "create panel this+0x98"}
        - {offset: 0x58, type: u32, name: "rec+0x38 appearance_a", values: "4 bytes this+0xa4..a7: +0x58 face index, +0x59 hair index (Create_Char face/hair lists), others unknown", notes: "labels from the UI handlers FUN_005030fb/FUN_00503146"}
        - {offset: 0x5c, type: u32, name: "rec+0x3c appearance_b", values: "4 bytes this+0xa8..ab: +0x5f colour index (FUN_00503191), others unknown", notes: ""}
        - {offset: 0x60, type: u16, name: "rec+0x40 weapon_code", values: "starting weapon item code chosen from Create_Char weaponN_item of the class (e.g. 10017/10011/10001/10002 Saint)", notes: "u16 item code = first field of the 16-byte main-weapon item"}
      notes: "C->S also requires the account nation (acct+0x62c) or a nation pick; shows 'Requesting character creation ...' and waits."
    s2c:
      min_size: 0x260
      extra: "unused"
      fields:
        - {offset: 0x10, type: u32, name: slot, values: "0..4 (NOT bounds-checked: an invalid slot corrupts memory)", notes: "entry+0x1ae = slot+1"}
