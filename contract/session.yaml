notes_on_assignment:
  - "0x2009 is the second half of the 0x2000 profile (storage area shared with 0x425): items/storage rather than session."
  - "0x408 char id is at +0x10, not +0x18 as the inventory says (+0x18 is a zero u32)."
  - "0x401 0x1c variant is a dead dev-panel toggle, not a heartbeat."
  - "Related opcodes owned elsewhere: 0x2000 enter world (world), 0x41f stats (combat/world), 0x2003 sysmsg popup and 0x41d confirm prompt (system; 0x41d code 0xe3 starts the newbie channel move), 0x200f jewel refresh (items)."
  - "NOTES.local.md lists '0x41e C->S Steam/OAuth login'; 0x41e is the client version constant inside 0x4207/0x4200/0x4202, the token login opcode is 0x4207."
