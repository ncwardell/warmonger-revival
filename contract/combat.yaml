# Warmonger / Crush Online — protocol contract: COMBAT subsystem
# Basic attacks, skills/casts, hit reports, damage/heal, buffs/debuffs, death/revive,
# stats/HP/MP/exp/level-up, TP (war) skills, mastery.
#
# Conventions
# - Every offset is from the start of the packet (16-byte header, payload at +0x10).
# - Header: u16 len | u16 0xA53C | u16 opcode | u16 extra | u32 tick | u32 key.
#   C->S payload u32 words are obfuscated ~(w - key) when key != 0; S->C packets are
#   plaintext (key 0) and must be > 16 bytes.
# - "uid" = unit id (header extra / unit+0x35e). Players 1..0x3F6, monsters/NPCs 0x3F7..0x2B05.
# - "char" = a unit's char record (unit+0x3a0). Stat block = 0x5c bytes at char+0x443.
# - "me" = the local player unit (DAT_0084a758). "in game" = DAT_0084e3ec != 0.
# - A min_size is the highest byte the handler reads. The dispatcher FUN_0047a36c does not
#   check sizes, so send at least that many bytes (zero-filled).
# - Sources: decompiled decompiled.c, decompiled disasm.txt, docs/spec/{combat,skills,monsters,world,group00-03}.md,
#   WarmongerRevamp/server/{world,ai,skills,handlers}.py (live-tested). The contract/examples.md
#   ground-truth set has no client-built packet for any opcode in this file (its local
#   packets are 0x803/0x806/0x44e/0x416 only).
#
# Corrections to the earlier specs found while writing this contract
# - 0x411 S->C: a non-zero skill id unknown to Skill_Base is NOT ignored. FUN_00497fba
#   returns 0, so the handler takes the basic-attack branch (every target gets the
#   swing/hit event with +0x16 as motion). (combat.md section 2.1 said "ignored".)
# - 0x411/0x412 flags 0x1000/0x2000 do not show UI notices. When the attacker is me, the
#   handler feeds the quest/achievement manager FUN_00597c31 (event 0x2711 "attack/skill
#   used", or 0x271d for flag 0x2000 - 0x411 ONLY; the 0x412 handler has no 0x2000 branch
#   and always uses 0x2711), which may send C->S 0x492 (quest progress).
# - 0x412 S->C push: a target moves only when it is not the caster, its new x > 0 and z > 0
#   (strictly positive), its status flags lack bit 0x1000, and skill+0x2b is 3 (knock-back,
#   event 8) or 4 (pull, event 9). The caster's own dash/blink destination is carried in the
#   target slot whose uid == caster (the client puts itself in the list).
# - 0x413: +0x12 source uid is looked up and the resulting UNIT POINTER is OR'd into the
#   number style (style = ptr | 0x40000000 | 0x100 if damage != 0; disasm 0x478c3f/0x478cc3).
#   FUN_00485f58 ignores its first argument, so the source does not affect HP. Send 0 (or an
#   unspawned uid) to get the clean 0x40000000 style. [verifier correction]
# - 0x421: the death/revive check (FUN_004890cb) only runs in game; HP/MP/max values are
#   written either way.
# - 0x422: also shows an exp-gain popup with (new exp - old exp) and, for other players
#   with +0x11 != 0, plays a level-up effect on them.
# - 0x429 type 3 is the GUILD ID (char+0x27f), type 5 the guild grade (char+0x656), not
#   "title/rank". Only type 1 (nation) is combat-relevant (friend/foe).
# - 0x4a2 +0x30 is the 32 x 12-byte BUFF table (FUN_0046fd59 -> FUN_004bf542), not
#   equipment; +0x14 is a system-message id, not an effect id; +0x20 is the costume slot.
# - 0x450 +0x12/+0x14 are system-message ids (formatted with the target's name), not effect
#   ids; action 10 writes +0x18 into the TARGET's current HP (capture gauge).
# - 0x4b4 +0x10 is the uid of the TP NPC whose panel is open, +0x12 the Skill_TP id.
# - 0x4b6 is the TP-skill USE command (HUD buttons in "mode 1"), not a generic action.
# - 0x4ba is a command to the player's owned/summoned unit (category 0x0b, owner == me).
#
# Misassignment notes
# - 0x429 is mostly social (guild id/grade); 0x4a2 is a whole-character refresh (world);
#   0x450 is a match capture/rescue mechanic (pvp); 0x4ba is summon/pet control (pvp/world).
#   They are documented here as assigned.
# - Opcodes this subsystem depends on but that belong elsewhere: 0x803/0x804/0x806/0x43e
#   (spawn, refresh/respawn, remove), 0x4ca (unknown-unit query), 0x427/0x426 (equipment
#   -> skill bar), 0x41b (system message), 0x443 (match kill feed), 0x4b5 (war status incl.
#   the TP HUD table), 0x424/0x428 field 0xe (TP balance), 0x492 (quest progress).
# - Mastery: no character-mastery opcode exists in the client. Mastery.cdb (CMasteryDB,
#   DAT_00846958) is only read by the icon/tooltip code (FUN_004e8fd8 case 4, keyed by
#   char+0x239 class). Guild/fort mastery are guild/pvp opcodes (0x4c3 etc.).

opcodes:

  - opcode: 0x40f
    name: skill_precast
    direction: both
    c2s:
      size: 0x14
      extra: "sender uid (me)"
      fields:
        - {offset: 0x10, type: u32, name: skill_id, values: "Skill_Base id of a skill with a cast time (Skill_Base +0x4f > 0)", notes: "nothing else in the packet"}
      sent_when: "ActionSkill FUN_00461f47 starts the charge/precast phase; only if the connection is up (FUN_0046ffbf)."
    s2c:
      min_size: 0x14
      extra: "caster uid"
      fields:
        - {offset: 0x10, type: u32, name: skill_id, values: "Skill_Base id", notes: "looked up with FUN_004c2f58"}
      accepted_if: "caster uid (extra) is a spawned unit AND skill_id is in Skill_Base; otherwise dropped silently."
    server_reply: "None to the sender. Forward the packet unchanged (extra = caster) to every other client that sees the caster. Do not echo to the caster (it would replay its own precast animation)."
    client_effect: "Posts unit event 4 (ground-target skill, skill+0x17 == 2) or 1 (other) to the caster via FUN_0048d424 with the cast time skill+0x4f: remote caster plays the charge animation/bar."
    handler: FUN_004734b3
    send_sites: [FUN_00461f47]
    confidence: high
    verified: true
    evidence: "Handler read directly; sender builds 0xa53c0014 inline (combat.md 1.5); server world.cast() returns nothing (live)."

  - opcode: 0x410
    name: skill_cast_announce
    direction: both
    c2s:
      size: 0x38
      extra: "sender uid (me)"
      fields:
        - {offset: 0x10, type: u16, name: caster_uid, values: "me", notes: ""}
        - {offset: 0x12, type: u16, name: display_skill_id, values: "skill as slotted on the bar (ActionSkill+0x1c, FUN_004871cf maps buff overrides)", notes: "echo"}
        - {offset: 0x14, type: i16, name: skill_id, values: "Skill_Base id", notes: ""}
        - {offset: 0x16, type: u16, name: pad, values: "0", notes: ""}
        - {offset: 0x18, type: "bytes[8]", name: unused, values: "0", notes: ""}
        - {offset: 0x20, type: f32, name: target_x_or_uid, values: "ActionSkill point x (ActionSkill+0xf0); replaced by float(target uid) (and +0x24 = 0) when (skill+0x34 == 1 AND skill+0x32 == 1) OR skill+0x34 == 2 (disasm 0x4620a2..0x4620b2; byte offsets, NOT +0x17/+0x19/+0x1a)", notes: "verifier-corrected"}
        - {offset: 0x24, type: f32, name: target_z, values: "ground point z; 0 for unit target", notes: ""}
        - {offset: 0x28, type: f32, name: move_x, values: "dash/blink destination x (FUN_005852a4) or 0", notes: "0,0 = no displacement"}
        - {offset: 0x2c, type: f32, name: move_z, values: "dash/blink destination z or 0", notes: ""}
        - {offset: 0x30, type: u32, name: caster_hp, values: "0 (server fills)", notes: ""}
        - {offset: 0x34, type: u32, name: caster_mp, values: "0 (server fills)", notes: ""}
      sent_when: "FUN_00461fc1 (via FUN_00463214) at the fire frame of a skill with delivery skill+0x34 != 0 (projectile / ground field). The hits arrive later as 0x411/0x412 with flag 0x200."
    s2c:
      min_size: 0x38
      extra: "caster uid (not read; set it anyway)"
      fields:
        - {offset: 0x10, type: i16, name: caster_uid, values: "spawned unit", notes: "unknown caster -> no animation (HP/MP update is a no-op too since the unit is unknown)"}
        - {offset: 0x14, type: i16, name: skill_id, values: "Skill_Base id", notes: "unknown -> no animation, but +0x30/+0x34 caster HP/MP ARE still applied (FUN_00472079 runs after the skipped block)"}
        - {offset: 0x20, type: f32, name: target_x_or_uid, values: "as C->S", notes: "every skill with skill+0x17 != 2 (not only unit-target) is read as float(uid); unknown unit or template class 0x10 -> the handler returns early (HP/MP below NOT applied)"}
        - {offset: 0x24, type: f32, name: target_z, values: "", notes: ""}
        - {offset: 0x28, type: f32, name: move_x, values: "", notes: "used only for remote casters with skill+0x26 == 1 (event 11 teleport) or 2 (event 10 dash); 0,0 with a dash skill -> FUN_004bcfe9 and return without the HP/MP update"}
        - {offset: 0x2c, type: f32, name: move_z, values: "", notes: ""}
        - {offset: 0x30, type: u32, name: caster_hp, values: "the caster's REAL current HP", notes: "applied by FUN_00472079; < 1 kills the caster"}
        - {offset: 0x34, type: u32, name: caster_mp, values: "caster's current MP after the cost", notes: ""}
      accepted_if: "No gate on the HP/MP part except the two early returns. Animation needs caster spawned and skill known (FUN_004c2f58). Early return (no HP/MP) when skill+0x17 != 2 and float(+0x20) is not a spawned unit / is template class 0x10, or for a remote caster with skill+0x26 in {1,2} and +0x28 == +0x2c == 0 (FUN_004bcfe9)."
    server_reply: "Deduct cost (Skill_Base +0x39/+0x3d), start the server cooldown, then send 0x410 with +0x30/+0x34 = caster HP/MP to every other observer of the caster; send the caster a 0x420 {HP, MP} if its MP changed. Echoing 0x410 to the caster re-plays the cast event on its own avatar - avoid."
    client_effect: "Remote caster turns toward the point/target (skill+0x30 face flag), plays the cast animation (event 5 ground / 2 unit) and the dash/teleport (events 10/11). Then caster HP/MP are set."
    handler: FUN_00474062
    send_sites: [FUN_00461fc1]
    confidence: high
    verified: true
    evidence: "Handler and sender read directly; layout matches combat.md 1.4/2.3; world.cast() (live) sends nothing back when alone."

  - opcode: 0x411
    name: hit
    direction: both
    c2s:
      size: 0x64
      extra: "sender uid (me)"
      fields:
        - {offset: 0x10, type: u16, name: attacker_uid, values: "me", notes: "drop the packet if != sender"}
        - {offset: 0x12, type: u16, name: display_skill_id, values: "0 for basic attack; else bar skill id", notes: "echo"}
        - {offset: 0x14, type: i16, name: skill_id, values: "0 = basic attack; else Skill_Base id", notes: ""}
        - {offset: 0x16, type: u16, name: motion, values: "basic: attack motion/combo index (ActionAttack+0x64); skill: 0 (SFX senders: projectile FX param)", notes: "echo; remote clients use it for the swing animation"}
        - {offset: 0x18, type: u16, name: flags, values: "0x0100 basic attack replaced by a buff skill (FUN_004b96e4); 0x0200 projectile/field tick (SFX senders); 0x1000 command mode 1; 0x2000 command mode 2 (ActionSkill+0x110)", notes: "echo; server ORs in 0x4 crit / 0x8 evade"}
        - {offset: 0x1a, type: u16, name: lethal_mask, values: "0", notes: "server fills"}
        - {offset: 0x1c, type: f32, name: attacker_x, values: "", notes: ""}
        - {offset: 0x20, type: f32, name: attacker_z, values: "", notes: ""}
        - {offset: 0x24, type: f32, name: target_x, values: "target unit position or ground point; 0 for basic attacks", notes: ""}
        - {offset: 0x28, type: f32, name: target_z, values: "", notes: ""}
        - {offset: 0x2c, type: u32, name: attacker_hp, values: "0", notes: "server fills"}
        - {offset: 0x30, type: u32, name: attacker_mp, values: "0", notes: "server fills"}
        - {offset: 0x34, type: "struct[12] {u16 uid, i16 amount}", name: targets, values: "basic: slot 0 = clicked target. Skill: slot 0 = clicked target (skill+0x17 == 1) or self (+0x17 == 3, or kind +0x0c == 4); AoE (skill+0x43 == 1) gathered by FUN_00588a96/FUN_00588e87 within skill+0x44 of the point, max skill+0x22, nearest first", notes: "amount always 0 from the client; uid 0 = empty"}
      sent_when: "Basic attack impact frame (FUN_00462af7); instant skill fire with skill+0x34 == 0, +0x2b == 0, +0x26 == 0 (FUN_004621bd); projectile/field SFX reaching targets with hit_packet 0-2 (FUN_005a233f, FUN_005a2f4d, FUN_005a3de6; one per field tick). Replaced by 0x42b when the skill came from an item."
    s2c:
      min_size: 0x64
      extra: "attacker uid (damage numbers are also shown to the client whose uid == extra)"
      fields:
        - {offset: 0x10, type: i16, name: attacker_uid, values: "", notes: "unknown uid in 1..0x2B05 while me exists -> client sends C->S 0x4ca {u32 uid} (100-entry cache, 50 s); targets are still processed"}
        - {offset: 0x12, type: u16, name: display_skill_id, values: "echo", notes: "not read by the handler"}
        - {offset: 0x14, type: i16, name: skill_id, values: "0 basic; else Skill_Base id", notes: "<= 0 or unknown id -> basic-attack branch"}
        - {offset: 0x16, type: u16, name: motion, values: "basic: swing motion index (low byte, high byte packed into the event); skill: projectile FX param (passed to FUN_005a344c for delivery 2 SFX)", notes: "monsters: 0 works (live)"}
        - {offset: 0x18, type: u16, name: flags, values: "0x0004 critical (crit SFX + number style 0x10); 0x0008 evade (shows 'Evade', no blood); 0x0100/0x0200/0x1000/0x2000 echo", notes: "basic attack: 0 is treated as 1"}
        - {offset: 0x1a, type: u16, name: lethal_mask, values: "bit i = target i may reach 0 HP", notes: "FUN_00485e4b: if HP < dmg then HP = bit ? 0 : 1 else HP -= dmg"}
        - {offset: 0x1c, type: f32, name: attacker_x, values: "echo", notes: "not read by the S->C handler"}
        - {offset: 0x20, type: f32, name: attacker_z, values: "echo", notes: ""}
        - {offset: 0x24, type: f32, name: target_x, values: "ground point", notes: "used for ground skills' cast FX (skill+0x17 == 2) and AoE projectile FX"}
        - {offset: 0x28, type: f32, name: target_z, values: "", notes: ""}
        - {offset: 0x2c, type: u32, name: attacker_hp, values: "attacker's REAL current HP", notes: "applied to the attacker on every receiver (FUN_00472079); 0 KILLS the attacker"}
        - {offset: 0x30, type: u32, name: attacker_mp, values: "attacker's current MP", notes: ""}
        - {offset: 0x34, type: "struct[12] {u16 uid, i16 amount}", name: targets, values: "amount = damage; skill+0x67 == 0x1f heal HP / 0x21 restore MP (no damage applied); 0x2d applies the amount as HP DAMAGE (with lethal bit) AND drains the same amount of MP (FUN_00485e4b then FUN_00485f58)", notes: "uid 0, unknown, or template class 0x10 skipped. Note FUN_00485e4b: HP == dmg reaches 0 even without the lethal bit (only HP < dmg is clamped to 1)"}
      accepted_if: "in game (else dropped). No other gate; each target slot is processed independently."
    server_reply: "Validate (attacker == sender, alive, skill owned via equipped weapon, cooldown, cost, range), fill +0x36+4i damage, OR crit/evade bits into +0x18, set +0x1a lethal bits, +0x2c/+0x30 attacker HP/MP; send S->C 0x411 (extra = attacker) to every client that sees the attacker or a target INCLUDING the sender. Then for each kill 0x420 {HP 0} (optional, confirms) and loot; then match 0x443 for PvP kills."
    client_effect: "Damage applied immediately (absorb shield: buff slot 0 with effect 0x1b8 takes MP first; else entry+6 absorb counter); heal/MP effects (skill+0x67 0x1f heal HP, 0x21 restore MP, 0x2d drain MP) via FUN_00485f58 clamped to max. Remote attacker: basic = event 6 swing then hit at impact; skill = cast event 2/5 then per-target event 7. Local attacker (basic-attack branch only, and only while DAT_00853cc8+0x78 != 0): first hit attaches to the running action (FUN_00585202). Numbers via FUN_00487ff8 (styles 0x40 normal, 0x10 crit, 4 evade, 0x20000000 heal, 0x4000000 MP). Target with HP < 1 after the hit plays death (FUN_00488565). Local attacker also feeds quest/achievement events 0x2711/0x271d."
    handler: FUN_00475654
    send_sites: [FUN_004621bd, FUN_00462af7, FUN_005a233f, FUN_005a2f4d, FUN_005a3de6]
    confidence: high
    verified: true
    evidence: "Handler re-read in full; server world.hit()/ai.py attack (live-tested: kills, crits, lethal bit, player death)."

  - opcode: 0x412
    name: hit_displace
    direction: both
    c2s:
      size: 0x88
      extra: "sender uid (me)"
      fields:
        - {offset: 0x10, type: u16, name: caster_uid, values: "me", notes: ""}
        - {offset: 0x12, type: u16, name: display_skill_id, values: "", notes: "echo"}
        - {offset: 0x14, type: i16, name: skill_id, values: "Skill_Base id", notes: ""}
        - {offset: 0x16, type: u16, name: pad, values: "0", notes: ""}
        - {offset: 0x18, type: u16, name: flags, values: "as 0x411 (0x200 SFX, 0x1000/0x2000 command mode)", notes: "echo"}
        - {offset: 0x1a, type: u16, name: lethal_mask, values: "0", notes: "server fills (7 bits)"}
        - {offset: 0x1c, type: f32, name: caster_x, values: "", notes: ""}
        - {offset: 0x20, type: f32, name: caster_z, values: "", notes: ""}
        - {offset: 0x24, type: f32, name: target_x, values: "target unit position for skill+0x17 == 1 with a target; otherwise 0 (FUN_0046260d zeroes local_30/local_28 and only fills them in the unit-target branch - no ground point is sent)", notes: "verifier-corrected"}
        - {offset: 0x28, type: f32, name: target_z, values: "", notes: ""}
        - {offset: 0x2c, type: u32, name: caster_hp, values: "0", notes: "server fills"}
        - {offset: 0x30, type: u32, name: caster_mp, values: "0", notes: "server fills"}
        - {offset: 0x34, type: "struct[7] {u16 uid, i16 amount}", name: targets, values: "clicked target and/or AoE list; for dash/blink skills (skill+0x26 1/2) the CASTER's own uid is in the list (slot 1 after a unit target, slot 0 for a ground target)", notes: "amount 0"}
        - {offset: 0x50, type: "f32[7]", name: new_x, values: "per slot: push/pull destination (FUN_00585771) or, in the caster's slot, its dash destination (FUN_005852a4); 0 = not moved", notes: ""}
        - {offset: 0x6c, type: "f32[7]", name: new_z, values: "as new_x", notes: ""}
      sent_when: "FUN_0046260d at fire time for instant skills with knock-back/pull (skill+0x2b != 0) or dash/blink (skill+0x26 != 0); SFX senders FUN_005a233f/FUN_005a2f4d/FUN_005a3942/FUN_005a3de6 for projectiles with hit_packet 3-4."
    s2c:
      min_size: 0x88
      extra: "caster uid"
      fields:
        - {offset: 0x10, type: i16, name: caster_uid, values: "", notes: "may be unknown (targets still processed, no animation)"}
        - {offset: 0x14, type: i16, name: skill_id, values: "Skill_Base id", notes: "unknown -> whole packet dropped"}
        - {offset: 0x18, type: u16, name: flags, values: "as 0x411", notes: "passed into the hit event"}
        - {offset: 0x1a, type: u16, name: lethal_mask, values: "bits 0..6", notes: ""}
        - {offset: 0x1c, type: f32, name: caster_x, values: "", notes: "start point of the knock/pull event"}
        - {offset: 0x20, type: f32, name: caster_z, values: "", notes: ""}
        - {offset: 0x24, type: f32, name: target_x, values: "ground point for AoE FX", notes: ""}
        - {offset: 0x28, type: f32, name: target_z, values: "", notes: ""}
        - {offset: 0x2c, type: u32, name: caster_hp, values: "caster's REAL HP", notes: "0 kills the caster"}
        - {offset: 0x30, type: u32, name: caster_mp, values: "", notes: ""}
        - {offset: 0x34, type: "struct[7] {u16 uid, i16 amount}", name: targets, values: "damage per slot", notes: "heal types (0x1f/0x21/0x2d) apply NO damage here and no heal either"}
        - {offset: 0x50, type: "f32[7]", name: new_x, values: "", notes: "target moved only if: not the caster, x > 0 AND z > 0, target status flags lack 0x1000, skill+0x2b == 3 (event 8 knock-back) or 4 (event 9 pull). Caster slot: dash (event 10) / blink (event 11) for remote casters"}
        - {offset: 0x6c, type: "f32[7]", name: new_z, values: "", notes: ""}
      accepted_if: "in game, me exists, and skill_id is in Skill_Base. ABORT (no damage, no HP/MP, nothing) when the caster is a spawned REMOTE unit, skill+0x26 is 1/2 (or 0x33/0x34), its own uid is in the target list and that slot's new_x == new_z == 0 -> FUN_004bcfe9 and return (0x474abd). Never echo a dash with a zero caster destination."
    server_reply: "As 0x411 with 7 slots: fill damage, lethal bits, caster HP/MP; clamp new_x/new_z to walkable ground (navmesh) and update server positions of moved units (and the caster's own position from its slot); broadcast 0x412 (extra = caster) to all observers INCLUDING the sender. Deaths as 0x411."
    client_effect: "Damage (FUN_00485e4b), per-target hit event 7, knock/pull movement, remote-caster dash (event 10) / blink (event 11), caster HP/MP; local caster feeds quest event 0x2711 (no 0x271d branch here). The FUN_004b9d66/FUN_0058b479/FUN_0058b455 calls are DEAD code (inside a block guarded by caster != me, then tested for caster == me), so nothing ends the local caster's action. A pushed local player has its action cancelled. Template class 0x10 targets are NOT skipped here (unlike 0x411)."
    handler: FUN_0047445f
    send_sites: [FUN_0046260d, FUN_005a233f, FUN_005a2f4d, FUN_005a3942, FUN_005a3de6]
    confidence: high
    verified: true
    evidence: "Handler and sender read; world.hit_push() live-tested (skill 5024 dash, 10 packets in the 04 Oct log)."

  - opcode: 0x413
    name: damage_tick
    direction: s2c
    s2c:
      min_size: 0x30
      extra: "not read (send the target uid)"
      fields:
        - {offset: 0x10, type: "bytes[2]", name: unused, values: "0", notes: ""}
        - {offset: 0x12, type: i16, name: source_uid, values: "send 0 (or an unspawned uid)", notes: "looked up with FUN_0044d3b9 and the unit POINTER is OR'd into the damage-number style dword (0x478cc3) - a spawned source corrupts the style bits. FUN_00485f58(src, target, 1, dmg) ignores src; type 1 just copies char HP to the bar HP (unit+0x5f8)."}
        - {offset: 0x14, type: "bytes[0x16]", name: unused, values: "0", notes: "not read"}
        - {offset: 0x2a, type: u16, name: lethal, values: "0 = HP stops at 1; non-zero = may reach 0", notes: ""}
        - {offset: 0x2c, type: u16, name: target_uid, values: "spawned unit", notes: "unknown -> ignored"}
        - {offset: 0x2e, type: i16, name: damage, values: "> 0", notes: "goes through the absorb-shield logic"}
      accepted_if: "target uid is spawned AND has a char record (unit+0x3a0): the death check at 0x478c99 dereferences it unconditionally - a char-less target crashes the client. No in-game check."
    server_reply: "n/a (server-initiated)."
    client_effect: "HP -= damage (absorb first); number shown on the target with style (src ptr | 0x40000000, |0x100 when non-zero) to every receiver; HP < 1 -> unit+0x36c cleared and death animation (FUN_00488565) - this runs on EVERY 0x413 to a unit at HP < 1, even if already dead, so stop ticking dead units; UI event 0xf (HP bars)."
    handler: FUN_00478c1a
    send_sites: []
    confidence: high
    verified: true
    evidence: "Handler read directly."

  - opcode: 0x41e
    name: buff_list
