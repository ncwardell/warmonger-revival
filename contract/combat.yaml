    confidence: medium
    verified: true
    evidence: "Disassembly of the builder read; the category-0x0b owner check identifies it as a summon/pet command."

flows:

  - name: enter_world_combat_state
    steps:
      - "S->C 0x2000 (enter world; builds the avatar with HP 0, speed 0)"
      - "S->C 0x41f (extra = me): HP/MP/maxes > 0, +0x2c attack speed 500, +0x2e basic range 200, +0x46 speed 450, +0x50 revive delay 5  [required]"
      - "S->C 0x427 container 3 slot 0 (and slot 1) = equipped weapon(s) -> skill bar loads (skills.md)"
      - "S->C 0x422 {level, 0, exp} (optional; slot record already has them)"
      - "S->C 0x41e {flags 0, win 0, mask 0} (optional, empty buffs)"
      - "S->C 0x803/0x805 + 0x804/0x41f per visible unit (monsters need a speed)"

  - name: basic_attack_player_on_monster
    steps:
      - "client: walks into range (dist < target radius + stat +0x1e x 0.01), swings (no packet before impact)"
      - "C->S 0x411 {+0x10 me, +0x14 0, +0x16 motion, +0x1c/+0x20 my x,z, +0x34 {monster uid, 0}}"
      - "S->C 0x411 to sender + observers (extra = me): +0x36 damage, +0x18 |= 0x4 crit / 0x8 evade, +0x1a bit 0 if lethal, +0x2c/+0x30 my HP/MP"
      - "if killed: S->C 0x420 {HP 0, MP 0} extra = monster (optional confirm) + loot (0x427/0x428 per loot.py)"
      - "later: S->C 0x804 respawn at home with full HP"

  - name: instant_skill
    steps:
      - "client gates locally: target, range (skill +0x41), own cooldown, global cooldown, cost (MP x (100 - stat +0x54)%)"
      - "[if cast time > 0] C->S 0x40f {skill}; S->C 0x40f to others"
      - "C->S 0x411 {+0x12 display id, +0x14 skill, +0x24/+0x28 point, +0x34 targets}  (or 0x412 for knock-back/dash, see below)"
      - "S->C 0x411 to all incl. sender: damage/heal per slot, flags, lethal mask, +0x2c/+0x30 caster HP/MP (MP already minus cost)"
      - "deaths as basic attack"

  - name: projectile_or_ground_field_skill
    steps:
      - "[cast time] C->S 0x40f -> S->C 0x40f to others"
      - "C->S 0x410 {skill, point or float(target uid), dash dest} at the fire frame"
      - "S->C 0x410 to others with +0x30/+0x34 caster HP/MP; S->C 0x420 {HP, MP} to the caster"
      - "per impact / per field tick (Skill_Base +0x35): C->S 0x411 (hit_packet 0-2) or 0x412 (3-4) with flags 0x200"
      - "S->C 0x411/0x412 results to all incl. sender (server must not charge cost again for 0x200 hits)"

  - name: knockback_or_dash_skill
    steps:
      - "C->S 0x412 {targets incl. own uid for dash skills, +0x50/+0x6c destinations}"
      - "server: clamp destinations to the navmesh (both coordinates must stay > 0), move server positions"
      - "S->C 0x412 to all incl. sender (damage, lethal mask, destinations echoed); for a dash/blink skill the caster slot must carry a non-zero destination, else remote clients abort the WHOLE packet (no damage shown)"

  - name: monster_attacks_player
    steps:
      - "S->C 0x416 type 2 chase (extra = monster) / type 0 stop-and-face"
      - "S->C 0x411 every attack interval (extra = monster): +0x10 monster, +0x14 0 (or a unit skill id), +0x16 motion 0, +0x1c/+0x20 monster x,z, +0x24/+0x28 player x,z, +0x2c monster HP (> 0!), +0x30 MP, +0x34 {player uid, damage}, +0x1a bit 0 if lethal"
      - "if the player died: S->C 0x420 {0, MP} extra = player"

  - name: player_death_and_revive
    steps:
      - "lethal 0x411/0x412/0x413, or 0x420/0x421/0x41f with HP 0: client plays death and counts down stat +0x50 (revive delay) seconds, then shows 'WaitingRevive'; it sends NOTHING"
      - "server waits revive delay, then either: S->C 0x421 {max HP, max MP, max HP, max MP} (revive in place) + S->C 0x416 type 1 (snap to spawn) [live-tested]"
      - "or: S->C 0x804 (extra = player) at the respawn point with HP > 0 (must carry full player state: equipment, team, buffs) to the player and observers"
      - "or (scene change): 0x44e/0x44f/0x2000 then 0x41f with HP > 0"
      - "observers: S->C 0x420 {HP > 0} or 0x804 for the revived player"

  - name: monster_death_and_respawn
    steps:
      - "lethal hit (S->C 0x411/0x412 lethal bit) -> death animation on every receiver"
      - "S->C 0x420 {0,0} (optional confirm)"
      - "after the respawn time: S->C 0x804 (extra = monster) at home, full HP, speed"
      - "C->S 0x4ca {uid} for a unit the client lost -> S->C 0x803 + 0x420 HP 0 (still dead) / 0x803 + 0x804 (alive) / 0x806 mode 2 (gone)"

  - name: buff_apply_and_expire
    steps:
      - "C->S 0x411 for a buff skill (e.g. 5023, self target slot 0 = caster)"
      - "S->C 0x411 echo (amount 0 shows nothing)"
      - "S->C 0x41e (extra = target) with the new full buff table (12-byte entries, remaining seconds) and status flags"
      - "if the buff changes stats: S->C 0x41f for the target"
      - "on expiry/dispel: S->C 0x41e without the entry (+ 0x41f)"

  - name: damage_over_time
    steps:
      - "every tick: S->C 0x413 {+0x12 0 (a spawned source corrupts the number style), +0x2a 1 if lethal allowed, +0x2c target (must have a char record), +0x2e damage} to observers; stop ticking once the target is dead (each tick at HP < 1 replays the death animation)"
      - "on death: client handles it; optional 0x420 HP 0"

  - name: exp_and_level_up
    steps:
      - "kill credited -> S->C 0x422 {level, 0, new exp} (popup shows the gain)"
      - "exp >= Level_Table[level+1].exp -> S->C 0x422 {level + 1, 1, exp}"
      - "S->C 0x41f with the new stats; S->C 0x421 if HP/MP refilled"
      - "others: S->C 0x422 {level, 1, -} with extra = the player (level-up effect) and 0x804/0x803 +level for nameplates"

  - name: channel_capture
    steps:
      - "C->S 0x450 {target, action 10} about once per second while holding"
      - "S->C 0x450 {target, action 10, +0x18 progress} to actor + observers"
      - "complete: S->C 0x450 {target, msg_ally, msg_enemy, action 1, +0x18 new side}"
      - "cancel: C->S 0x450 action 11 / interruption -> S->C 0x450 action 11 (or 13)"

  - name: tp_skill_purchase_and_use
    steps:
      - "player interacts (mode 2) with a war NPC of category 0x1f/0x22 -> PanelTPSkillQuick opens (client only)"
      - "C->S 0x4b4 {npc uid, tp id}"
      - "S->C TP balance (0x424/0x428 field 0xe) + war status 0x4b5 publishing {tp id, unit uid, start tick} in the TP HUD table [inferred]"
      - "player presses the HUD button: C->S 0x4b6 {tp unit uid, tp id, x, z}"
      - "S->C 0x410/0x411/0x412 for the resulting skill (Skill_TP skill_id) [inferred]"

  - name: summon_command
    steps:
      - "C->S 0x4ba {owned unit, mode 2, target uid} or {owned unit, mode 1, x, z}"
      - "S->C 0x416 (extra = owned unit) moves; S->C 0x411 attacks (extra = owned unit)"

  - name: item_triggered_skill
    steps:
      - "C->S 0x42b {container, slot, item code, 1, 12 target uids, x, z} (client decrements the stack locally)"
      - "S->C 0x411 or 0x412 (extra = sender, +0x14 = the item's skill) to all incl. sender"
      - "S->C 0x427 for the slot if the authoritative count differs"

server_rules:

  - name: hit_authority_and_validation
    client_expects: "The client picks targets, plays animations and reports hits with damage 0; it never re-requests a result. A dropped report just shows no numbers."
    data_table: "Skill_Base (range +0x41, AoE +0x43/+0x44, max targets +0x22, relation +0x16, target type +0x17), stat block +0x1e (basic range)"
    suggested_default: "Accept when attacker == sender and alive, skill is one of the 8 skills of the equipped weapons (WeaponBase) or 0, target alive, hostile per relation bits, distance <= range + target radius + 3 units lag margin, at most max targets. Drop silently otherwise."

  - name: damage_formula
    client_expects: "Any i16 per target; 0 shows nothing unless flag 0x8 (Evade). Crit flag 0x4 only changes the style."
    data_table: "Skill_Base effect slots (+0x80.. 4 x {type, value, rate}; damage numbers are not in the client), stat block (attack/magic damage, armor, MR, pen, crit rate x0.1 %, crit damage %, reductions), ItemOption codes, Level_Table atk?/def? columns"
    suggested_default: "dmg = max(1, (atk x skill_coeff) x 100 / (100 + max(0, armor - pen))) x rand(0.9..1.1); crit if rand < crit_rate/1000 -> x (1.5 + crit_damage%/100 - target crit_damage_reduction%/100); evade if rand < target dodge%. Basic attack coeff 1.0, skills 1.5-3.0 by tier; current server: basic 30, skill flat, monster (40 + 15 x (level-1)) x 0.8..1.2, 5 % crit."

  - name: lethal_bit_and_hp_tracking
    client_expects: "+0x1a bit set for every target whose server HP reached 0; +0x2c/+0x30 must be the attacker's real HP/MP (0 kills the attacker on every client)."
    data_table: "none"
    suggested_default: "Track HP/MP for every unit server-side; set the bit only when HP hits 0; always fill attacker HP from server state (monsters included)."

  - name: skill_costs_and_cooldowns
    client_expects: "The client gates and starts its own cooldowns (skill +0x5b ms x (100 - CDR)%), and cannot be told to reset them (no opcode)."
    data_table: "Skill_Base cost type +0x39 (4 HP %, 5 MP, 6 EXP, 0xe TP) / value +0x3d, cooldown +0x5b ms, cd group +0x0d; stat block +0x54 MP reduction, +0x56 CDR"
    suggested_default: "Deduct cost once per cast (on 0x410, or on the first non-0x200 0x411/0x412); enforce cooldown x 0.9 tolerance; silently drop early casts. Report new MP in +0x30 and a 0x420 to the caster."

  - name: heal_and_mana_effects
    client_expects: "For skill effect type +0x67 = 0x1f (heal HP), 0x21 (restore MP), 0x2d (drain MP) the 0x411 amount is applied as a heal/restore/drain clamped to max; 0x412 applies none of them."
    data_table: "Skill_Base +0x67 (col 49) and effect slots"
    suggested_default: "Heal = Skill_Base effect value x (1 + magic_damage/1000); send heals only via 0x411; follow with 0x420 for the healed unit if exactness matters."

  - name: buffs_and_status
    client_expects: "Full buff table per unit via 0x41e (also inside 0x803/0x804/0x426/0x453/0x4a2) with remaining seconds; status flags select client restrictions (no attack/skills/move/untargetable/knock-back immunity)."
    data_table: "Skill_Buff.cdb (duration ms, category +0x44, 3 x {effect code, value}), Skill_Base effect slots (type 314/330 = apply buff, value = buff id, rate %), WinAffect.cdb"
    suggested_default: "Apply buffs from skill effect slots by rate; slots 0..31 first free (slot 0 reserved for absorb shields); re-send 0x41e on every change and on expiry tick; recompute stats and send 0x41f when an effect changes a stat; map CC effects to status bits (stun = bit 5 -> restriction 0x10, silence = bit 13 -> 0x80, disarm = bit 10 -> 0x1)."

  - name: absorb_shields
    client_expects: "Buff slot 0 entry +6 is an absorb pool decremented by damage; when used up the client clears slot 0 itself. Effect 0x1b8 in slot 0 = mana shield (damage hits MP first)."
    data_table: "Skill_Buff effect values"
    suggested_default: "Mirror the client's arithmetic server-side so HP stays in sync; put shields in slot 0 only."

  - name: knockback_clamping
    client_expects: "The client computes push/pull/dash destinations; zero or non-positive coordinates mean 'not moved'."
    data_table: "navmesh (tools/navmesh.py)"
    suggested_default: "Accept destinations within skill range + 2 units of the start, snap to walkable navmesh, never emit coordinates <= 0; update server positions."

  - name: death_and_respawn
    client_expects: "After death the client counts down stat +0x50 seconds and waits; it never requests a revive. A unit is revived by any HP > 0 update (0x420/0x421/0x41f/0x804)."
    data_table: "none (respawn points: map/zone data, world.PLAYER spawn)"
    suggested_default: "Revive delay 5 s (open world), match rules per match subsystem; revive at the nearest town/nation spawn with full HP/MP via 0x421 + 0x416 type 1; monsters respawn after 30 s at home via 0x804."

  - name: exp_rewards_and_levels
    client_expects: "0x422 total exp; exp bar target = Level_Table[level+1].exp; level cap = last Level_Table row (30)."
    data_table: "Level_Table.cdb (exp@04, hp?/mp?/atk?/def? linear per-level values), UnitDB (no exp column), Quest rewards (type 2 = exp)"
    suggested_default: "Kill exp = 10 + 5 x monster level x (1 - 0.1 x max(0, player level - monster level)), min 1; on level-up add Level_Table per-level HP/MP/atk/def to base stats, refill HP/MP, send 0x422 {lvl, 1, exp} + 0x41f + 0x421."

  - name: stat_derivation
    client_expects: "Every display stat and attack speed/range/move speed come from the server's stat block; nothing is computed client-side except the item tooltip."
    data_table: "Level_Table per-level values, Item_Base options (ItemOption codes: 1 attack, 2 AP, 3 AS, 4 range, 5 move, 6 armor, 7 MR, 9 crit, 31 HP, 33 MP, 41 life steal, 1xx %-variants, 212 CDR), SetBounsItem, Item_Jewel (server-only), WeaponBase, buffs"
    suggested_default: "base(class, level) + sum(item options) + set bonuses + buffs; attack range from the weapon (melee 200, guns/bows/wands/cannon 700); attack speed 500; move speed 450; resend 0x41f after any change (equip 0x42a, level, buff)."

  - name: item_skill_map
    client_expects: "0x42b names only the item; the server must know which skill it triggers."
    data_table: "Item_Base option types 301/340 (values like 2135, 4006 look like skill ids) - unverified"
    suggested_default: "Map item -> Skill_Base id from the item's option 301 or 340 value when it is a valid Skill_Base id; otherwise reject (no reply)."

  - name: tp_economy
    client_expects: "TP balance at match obj +0xb0 (cost check), 6-entry TP HUD table at match obj +0x280; 0x4b4 to buy, 0x4b6 to use."
    data_table: "Skill_TP.cdb (id, skill_id, tp_cost, cooldown_s, grade/side/match-type/guild-item requirements), Skill_Base 45xx/47xx"
    suggested_default: "Earn TP from kills/captures in matches (e.g. 100 per kill, 300 per capture); on 0x4b4 check the same enable rules as FUN_0052d54b, deduct cost, add the HUD entry; on 0x4b6 enforce the Skill_TP cooldown and execute the skill server-side."

  - name: capture_channel
    client_expects: "Progress replies to each 1 s tick (0x450 action 10), a completion (action 1) or an end (11/13)."
    data_table: "match/fort data (match subsystem)"
    suggested_default: "Capture takes 5 ticks; any damage to the channeller or a move cancels (action 11); completion flips the target's side and broadcasts action 1 to all."

  - name: friend_or_foe
    client_expects: "Relation (FUN_004872bd) from nation char+0x655 and battle side char+0x659 (non-zero on both overrides nation); the client already refuses invalid targets."
    data_table: "none"
    suggested_default: "Use the same rule server-side: same non-zero battle side = ally; else same nation = ally; nation 0 monsters hostile to all players; status bit 0x400 = untargetable."

  - name: mastery
    client_expects: "No client packet reads or writes character mastery; Mastery.cdb is icon/tooltip data only."
    data_table: "Mastery.cdb (78 nodes: class, tier, max level, slot)"
    suggested_default: "Not implemented in the protocol; if wanted, fold mastery bonuses into the server-computed stat block (0x41f) and buffs."

  - name: summon_control
    client_expects: "0x4ba commands only units of category 0x0b whose char+0x4d1 is the player's uid."
    data_table: "UnitDB (category +0x8a)"
    suggested_default: "Spawn summons with category 0x0b and owner = player uid (0x803 field feeding char+0x4d1); obey 0x4ba: move (0x416) or attack (0x411 extra = summon)."
