name: ci
on: [push, pull_request]
jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server self-tests (no game data needed)
        working-directory: server
        run: |
          python3 -c "import handlers"
          for m in world ai skills loot; do echo "== $m"; python3 $m.py; done
      - name: Tools import
        run: |
          python3 -c "import ast,sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]" tools/*.py
